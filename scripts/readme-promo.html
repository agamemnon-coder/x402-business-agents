<!doctype html>
<!-- Rendered to docs/assets/readme/promo.webp (720x720, 30 fps, 12 s loop): render(t) is called for t = i/30, i = 0..359, each frame screenshotted with Playwright at 1080x1080, then scaled to 720x720; identical neighbouring frames are merged into one longer frame, and every frame is written whole (Pillow WebP: quality 65, method 6, kmax=1: each frame a key frame, no blending), so a phone that drops frames never shows a half-drawn one. Values from the live /try run of 16 Nov 2026 (test money). -->
<html><head><meta charset="utf-8"><title>Purser promo</title>
<style>
:root{--bg:#0b1020;--card:#121a30;--line:#24304f;--text:#eef2ff;--muted:#9aa6c6;--ok:#22c55e;--okbg:rgba(34,197,94,.14);--bad:#ef4444;--badbg:rgba(239,68,68,.15);--warn:#f59e0b;--violet:#7baeff;--mono:'DejaVu Sans Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1080px;overflow:hidden}
body{background:radial-gradient(1200px 700px at 85% -10%,#233d66 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#0f3b3a 0%,transparent 55%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;padding:56px 60px}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:34px;color:#c9d2f0}
.brand i{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;font-style:normal;color:#0b1020;font-size:26px}
h1{margin-top:22px;font-size:72px;line-height:1.02;font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--violet)}
.steps{display:flex;gap:12px;margin-top:28px}
.steps div{flex:1;padding:14px 16px;border-radius:16px;border:2px solid var(--line);font-size:27px;font-weight:650;color:var(--muted);white-space:nowrap}
.steps div b{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--line);color:var(--text);font-size:21px;margin-right:10px;vertical-align:2px}
.steps div.on{color:var(--text);border-color:var(--violet);background:rgba(123,174,255,.14)}
.steps div.on b{background:var(--violet)}
.stage{position:relative;margin-top:24px;height:590px}
.scene{position:absolute;inset:0;border-radius:28px;background:var(--card);border:2px solid var(--line);padding:34px 38px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.top{display:flex;justify-content:space-between;align-items:baseline}
.inv{font-size:30px;color:var(--muted);font-weight:600}
.amt{font-size:68px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.amt s{color:var(--muted);font-weight:600;font-size:44px;margin-right:16px}
.amt .new{color:var(--bad)}
.rows{margin-top:22px;display:grid;gap:12px}
.row{font-size:34px;font-weight:600;display:flex;align-items:center;gap:16px;padding:12px 20px;border-radius:16px;white-space:nowrap}
.row.ok::before{content:"✓";color:var(--ok);font-weight:800}
.row.code{font-family:var(--mono);font-size:33px;background:#0a1124;border:2px solid var(--line);color:#c7f9d4}
.row.warn{font-family:var(--mono);font-size:33px;background:#0a1124;border:2px solid var(--line);color:#fcd38d}
.row.bad{font-family:var(--mono);font-size:33px;background:#0a1124;border:2px solid var(--bad);color:#fecaca}
.row.sign{background:rgba(123,174,255,.16);border:2px solid var(--violet)}
.row.sign b{font-family:var(--mono);color:#d4e4ff}
.row.stamp{background:var(--okbg);border:2px solid var(--ok);color:#bbf7d0;font-weight:750}
.row.stamp::before{content:"✓";display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ok);color:#052e16;font-weight:900;flex:none}
.row.refused{background:var(--badbg);border:2px solid var(--bad);color:#fecaca;font-weight:800;font-size:40px}
.row.refused::before{content:"✕";display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--bad);color:#2b0606;font-weight:900;flex:none}
.pill{display:inline-flex;gap:10px;align-items:center;font-size:26px;font-weight:700;padding:8px 16px;border-radius:999px;background:#fff;color:#111827}
.pill.dot::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--ok)}
.bar{position:absolute;left:38px;right:38px;bottom:22px;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--violet);width:0;transition:none}
.foot{position:absolute;left:60px;right:60px;bottom:30px;white-space:nowrap;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:var(--muted)}
.foot .who{display:flex;gap:10px}
.foot .who span{padding:6px 14px;border-radius:999px;border:2px solid var(--line);color:#c9d2f0;font-weight:600}
</style></head><body>
<div class="brand"><i>✎</i>Purser</div>
<h1>AI agents spend.<br><span>You sign off.</span></h1>
<div class="steps"><div id="s0"><b>1</b>Agent pays alone</div><div id="s1"><b>2</b>CFO signs</div><div id="s2"><b>3</b>Tamper refused</div></div>
<div class="stage" id="stage"></div>
<div class="foot"><div>Live /try run · 16 Nov 2026 · test money</div><div class="who"><span>Claude</span><span>Airwallex sandbox</span></div></div>
<script>
// One loop of 12 s: three scenes of 4 s. Every value is from the live /try run of 16 Nov 2026 (test money).
const L=12;
const S=[
 {from:0,to:4,inv:'Invoice BTX-2026-23 · Bergtex',amt:'EUR 120.00',rows:[
   [0.6,'ok','Claude read it · 3 checks passed'],
   [1.3,'code','120.00 ≤ 500.00 → agent may pay'],
   [2.1,'stamp','Paid by the agent · approved by your policy'],
   [2.8,'pillrow','Airwallex sandbox · PAID']]},
 {from:4,to:8,inv:'Invoice BTX-2026-21 · Bergtex',amt:'EUR 1,850.00',rows:[
   [4.5,'ok','Claude read it · checks passed'],
   [5.1,'warn','1,850.00 > 500.00 → CFO must sign'],
   [5.8,'sign','Face ID signs <b>sha256 c0c8a884…</b>'],
   [6.6,'stamp','Paid at Airwallex · fingerprint attached']]},
 {from:8,to:12,inv:'Same payment · one cent changed',amt:'<s>EUR 1,850.00</s><span class="new">EUR 1,850.01</span>',rows:[
   [8.6,'code','signed  c0c8a884…'],
   [9.1,'bad','asked   664215b0…  ≠'],
   [9.7,'refused','Refused · EUR 0.00 moved']]},
];
const stage=document.getElementById('stage');
const els=S.map((s,i)=>{const d=document.createElement('div');d.className='scene';
  d.innerHTML=`<div class="top"><div class="inv">${s.inv}</div></div><div class="amt">${s.amt}</div><div class="rows">${s.rows.map(([,k,t])=>k==='pillrow'?`<div class="row" style="padding-left:0"><span class="pill dot">${t}</span></div>`:`<div class="row ${k}">${t}</div>`).join('')}</div><div class="bar"><i></i></div>`;
  stage.append(d);return d});
const clamp=(x)=>Math.max(0,Math.min(1,x));const ease=(x)=>1-Math.pow(1-clamp(x),3);
window.render=(t)=>{t=((t%L)+L)%L;
  S.forEach((s,i)=>{const e=els[i];
    // scene in over 0.35 s, out over 0.35 s
    const a=Math.min(ease((t-s.from)/0.35),1-ease((t-(s.to-0.35))/0.35));
    e.style.opacity=a;e.style.transform=`translateY(${(1-ease((t-s.from)/0.35))*24}px) scale(${0.985+0.015*a})`;
    const rows=e.querySelectorAll('.row');
    s.rows.forEach(([at,k],j)=>{const p=ease((t-at)/0.35);const r=rows[j];r.style.opacity=p;
      let x=(1-p)*-18;
      if(k==='bad'||k==='refused'){const q=t-at;if(q>0&&q<0.5)x+=Math.sin(q*60)*10*(1-q/0.5)}
      r.style.transform=`translateX(${x}px)`;
      if(k==='sign'&&t>at&&t<at+0.8){const q=(t-at)/0.8;r.style.boxShadow=`0 0 0 ${q*16}px rgba(123,174,255,${0.35*(1-q)})`}else r.style.boxShadow='';
      if(k==='stamp'||k==='refused'){const q=t-at;const sc=q>0&&q<0.35?1+0.06*Math.sin(q/0.35*Math.PI):1;r.style.transform+=` scale(${sc})`}});
    const shown=s.rows.filter(([at])=>t>=at).length;e.querySelector('.bar i').style.width=(shown/s.rows.length*100)+'%';
    document.getElementById('s'+i).classList.toggle('on',t>=s.from&&t<s.to)});
};
render(0);
</script></body></html>
