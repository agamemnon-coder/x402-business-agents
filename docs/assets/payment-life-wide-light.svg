<svg xmlns="http://www.w3.org/2000/svg" class="pv pv-life-wide" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="pv-life-wide-t pv-life-wide-d">
<title id="pv-life-wide-t">One payment's life</title><desc id="pv-life-wide-d">Eight steps: an invoice arrives; Claude reads it; Purser's code checks it; the exact terms are hashed; above a limit, the CFO signs that hash with Face ID; the rail checks with its own controls; the payment is made; it is written to the ledger. Each layer can stop it on its own.</desc>
<style>.pv{--bg:#f7f8fa;--surface:#ffffff;--sunken:#f1f3f7;--border:#e3e6ec;--text:#0b1220;--muted:#586174;--faint:#646d7e;--accent:#4f46e5;--accent-soft:#eef0ff;--ok:#0b7d43;--ok-soft:#e6f6ee;--bad:#c5363c;--bad-soft:#fdecec;--metal:#0b7a70;--metal-soft:#e3f5f2;--awx:#ad4a0c;--awx-soft:#fdf0e7;--claude:#a84d2b;--claude-soft:#fbefe9;--a-sourcing:#2563eb}
.pv { display: block; width: 100%; height: auto; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.pv .pv-bg { fill: var(--bg); }
.pv .pv-box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
.pv .pv-sunk { fill: var(--sunken); stroke: none; }
.pv .pv-layer { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 5; }
.pv .pv-trust { fill: var(--accent-soft); stroke: none; }
.pv .pv-awx { fill: var(--awx-soft); stroke: none; } .pv .pv-metal { fill: var(--metal-soft); stroke: none; } .pv .pv-airi { fill: color-mix(in srgb, var(--a-sourcing) 13%, var(--surface)); stroke: none; }
.pv .pv-claude { fill: var(--claude-soft); stroke: none; } .pv .pv-ok { fill: var(--ok-soft); stroke: none; } .pv .pv-badbg { fill: var(--bad-soft); stroke: none; }
.pv text { fill: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.pv .t-eye { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: var(--faint); }
.pv .t-h { font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.pv .t-h2 { font-size: 16px; font-weight: 700; }
.pv .t-b { font-size: 14.5px; fill: var(--muted); }
.pv .t-s { font-size: 13px; fill: var(--muted); }
.pv .t-f { font-size: 12.5px; fill: var(--faint); }
.pv .t-cap { font-size: 15px; font-weight: 650; fill: var(--accent); }
.pv .t-bad { font-size: 13px; font-weight: 650; fill: var(--bad); }
.pv .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: var(--bad); }
.pv .t-awx { fill: var(--awx); } .pv .t-metal { fill: var(--metal); } .pv .t-airi { fill: var(--a-sourcing); } .pv .t-acc { fill: var(--accent); } .pv .t-rail { fill: var(--text); } .pv .t-claude { fill: var(--claude); } .pv .t-ok { fill: var(--ok); }
.pv .t-link { font-size: 13.5px; font-weight: 650; fill: var(--accent); }
.pv a:hover .t-link, .pv a:focus .t-link { text-decoration: underline; }
.pv a:focus-visible .pv-box { stroke: var(--accent); stroke-width: 3; }
.pv .pv-flow, .pv .pv-still { fill: none; stroke: var(--faint); stroke-width: 2; stroke-dasharray: 5 5; }
.pv .pv-tip { fill: var(--faint); }
.pv .pv-line { fill: none; stroke: var(--border); stroke-width: 3; stroke-linecap: round; }
.pv .pv-prog { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
.pv .pv-dot { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
.pv .pv-num { font-size: 15px; font-weight: 750; fill: var(--text); }
.pv .pv-ring { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.pv .pv-step-hl { fill: var(--accent-soft); opacity: 0; }
.pv-life-wide { --pv-len: 1032; } .pv-life-tall { --pv-len: 462; }
@media (prefers-reduced-motion: no-preference) {
  .pv .pv-flow { animation: pv-dash 1.6s linear infinite; }
  .pv .pv-prog { animation: pv-prog 15.91s linear infinite; }
  .pv .pv-ring, .pv .pv-step-hl { animation: pv-step 15.91s linear infinite; }
  .pv .pv-d0 { animation-delay: 0.00s; }
  .pv .pv-d1 { animation-delay: 1.75s; }
  .pv .pv-d2 { animation-delay: 3.50s; }
  .pv .pv-d3 { animation-delay: 5.25s; }
  .pv .pv-d4 { animation-delay: 7.00s; }
  .pv .pv-d5 { animation-delay: 8.75s; }
  .pv .pv-d6 { animation-delay: 10.50s; }
  .pv .pv-d7 { animation-delay: 12.25s; }
}
@keyframes pv-dash { to { stroke-dashoffset: -20; } }
@keyframes pv-prog { 0% { stroke-dashoffset: var(--pv-len); } 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
@keyframes pv-step { 0% { opacity: 0; } 1.5% { opacity: 1; } 11% { opacity: 1; } 13% { opacity: 0; } 100% { opacity: 0; } }
</style><defs><marker id="pv-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="pv-tip" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="pv-bg" width="1200" height="250"/>
<path class="pv-line" d="M84 104 H1116"/>
<path class="pv-prog" d="M84 104 H1116" stroke-dasharray="1032" stroke-dashoffset="0"/>
<rect class="pv-step-hl pv-d0" x="16" y="30" width="136" height="196" rx="16"/>
<text class="t-eye " x="84" y="60" text-anchor="middle"><tspan x="84" dy="0">SUPPLIER</tspan></text>
<circle class="pv-dot" cx="84" cy="104" r="20"/>
<circle class="pv-ring pv-d0" cx="84" cy="104" r="27"/>
<text class="pv-num" x="84" y="109" text-anchor="middle"><tspan x="84" dy="0">1</tspan></text>
<text class="t-h2" x="84" y="154" text-anchor="middle"><tspan x="84" dy="0">Invoice</tspan></text>
<text class="t-s" x="84" y="176" text-anchor="middle"><tspan x="84" dy="0">Arrives by</tspan><tspan x="84" dy="17">e-mail or upload</tspan></text>
<rect class="pv-step-hl pv-d1" x="163" y="30" width="136" height="196" rx="16"/>
<text class="t-eye t-claude" x="231" y="60" text-anchor="middle"><tspan x="231" dy="0">CLAUDE</tspan></text>
<circle class="pv-dot" cx="231" cy="104" r="20"/>
<circle class="pv-ring pv-d1" cx="231" cy="104" r="27"/>
<text class="pv-num" x="231" y="109" text-anchor="middle"><tspan x="231" dy="0">2</tspan></text>
<text class="t-h2" x="231" y="154" text-anchor="middle"><tspan x="231" dy="0">Read</tspan></text>
<text class="t-s" x="231" y="176" text-anchor="middle"><tspan x="231" dy="0">Payee, amount,</tspan><tspan x="231" dy="17">account</tspan></text>
<rect class="pv-step-hl pv-d2" x="311" y="30" width="136" height="196" rx="16"/>
<text class="t-eye t-acc" x="379" y="60" text-anchor="middle"><tspan x="379" dy="0">PURSER'S CODE</tspan></text>
<circle class="pv-dot" cx="379" cy="104" r="20"/>
<circle class="pv-ring pv-d2" cx="379" cy="104" r="27"/>
<text class="pv-num" x="379" y="109" text-anchor="middle"><tspan x="379" dy="0">3</tspan></text>
<text class="t-h2" x="379" y="154" text-anchor="middle"><tspan x="379" dy="0">Checked</tspan></text>
<text class="t-s" x="379" y="176" text-anchor="middle"><tspan x="379" dy="0">Limits, payee,</tspan><tspan x="379" dy="17">totals</tspan></text>
<rect class="pv-step-hl pv-d3" x="458" y="30" width="136" height="196" rx="16"/>
<text class="t-eye t-acc" x="526" y="60" text-anchor="middle"><tspan x="526" dy="0">PURSER'S CODE</tspan></text>
<circle class="pv-dot" cx="526" cy="104" r="20"/>
<circle class="pv-ring pv-d3" cx="526" cy="104" r="27"/>
<text class="pv-num" x="526" y="109" text-anchor="middle"><tspan x="526" dy="0">4</tspan></text>
<text class="t-h2" x="526" y="154" text-anchor="middle"><tspan x="526" dy="0">Terms</tspan></text>
<text class="t-s" x="526" y="176" text-anchor="middle"><tspan x="526" dy="0">The exact terms,</tspan><tspan x="526" dy="17">hashed</tspan></text>
<rect class="pv-step-hl pv-d4" x="606" y="30" width="136" height="196" rx="16"/>
<text class="t-eye t-ok" x="674" y="60" text-anchor="middle"><tspan x="674" dy="0">THE CFO</tspan></text>
<circle class="pv-dot" cx="674" cy="104" r="20"/>
<circle class="pv-ring pv-d4" cx="674" cy="104" r="27"/>
<text class="pv-num" x="674" y="109" text-anchor="middle"><tspan x="674" dy="0">5</tspan></text>
<text class="t-h2" x="674" y="154" text-anchor="middle"><tspan x="674" dy="0">Face ID</tspan></text>
<text class="t-s" x="674" y="176" text-anchor="middle"><tspan x="674" dy="0">Above a limit: a</tspan><tspan x="674" dy="17">passkey signs</tspan></text>
<rect class="pv-step-hl pv-d5" x="753" y="30" width="136" height="196" rx="16"/>
<text class="t-eye t-rail" x="821" y="60" text-anchor="middle"><tspan x="821" dy="0">THE RAIL</tspan></text>
<circle class="pv-dot" cx="821" cy="104" r="20"/>
<circle class="pv-ring pv-d5" cx="821" cy="104" r="27"/>
<text class="pv-num" x="821" y="109" text-anchor="middle"><tspan x="821" dy="0">6</tspan></text>
<text class="t-h2" x="821" y="154" text-anchor="middle"><tspan x="821" dy="0">Rail's control</tspan></text>
<text class="t-s" x="821" y="176" text-anchor="middle"><tspan x="821" dy="0">Its own limits</tspan><tspan x="821" dy="17">and approvals</tspan></text>
<rect class="pv-step-hl pv-d6" x="901" y="30" width="136" height="196" rx="16"/>
<text class="t-eye t-rail" x="969" y="60" text-anchor="middle"><tspan x="969" dy="0">THE RAIL</tspan></text>
<circle class="pv-dot" cx="969" cy="104" r="20"/>
<circle class="pv-ring pv-d6" cx="969" cy="104" r="27"/>
<text class="pv-num" x="969" y="109" text-anchor="middle"><tspan x="969" dy="0">7</tspan></text>
<text class="t-h2" x="969" y="154" text-anchor="middle"><tspan x="969" dy="0">Paid</tspan></text>
<text class="t-s" x="969" y="176" text-anchor="middle"><tspan x="969" dy="0">When no layer</tspan><tspan x="969" dy="17">said no</tspan></text>
<rect class="pv-step-hl pv-d7" x="1048" y="30" width="136" height="196" rx="16"/>
<text class="t-eye t-rail" x="1116" y="60" text-anchor="middle"><tspan x="1116" dy="0">LEDGER</tspan></text>
<circle class="pv-dot" cx="1116" cy="104" r="20"/>
<circle class="pv-ring pv-d7" cx="1116" cy="104" r="27"/>
<text class="pv-num" x="1116" y="109" text-anchor="middle"><tspan x="1116" dy="0">8</tspan></text>
<text class="t-h2" x="1116" y="154" text-anchor="middle"><tspan x="1116" dy="0">Booked</tspan></text>
<text class="t-s" x="1116" y="176" text-anchor="middle"><tspan x="1116" dy="0">Ledger and audit</tspan><tspan x="1116" dy="17">log</tspan></text>
<text class="t-f" x="600" y="236" text-anchor="middle"><tspan x="600" dy="0">Each layer can stop it on its own. Sandbox and testnet runs, test money.</tspan></text>
</svg>
