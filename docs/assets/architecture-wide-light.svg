<svg xmlns="http://www.w3.org/2000/svg" class="pv pv-arch-wide" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="pv-arch-wide-t pv-arch-wide-d">
<title id="pv-arch-wide-t">Purser: who can stop a payment</title><desc id="pv-arch-wide-d">AI agents propose payments. Three layers that do not trust each other can each stop one on its own: Purser's checks in code; the CFO's Face ID, a passkey over the exact terms, above the limits and on every change to them; and the rail's own controls (Airwallex, Metal, Visa Intelligent Commerce via Airi). Then the ledger and its hash-chained audit log; the books in sandbox runs; the archive in Purser Cloud, a private preview.</desc>
<style>.pv{--bg:#f7f8fa;--surface:#ffffff;--sunken:#f1f3f7;--border:#e3e6ec;--text:#0b1220;--muted:#586174;--faint:#646d7e;--accent:#4f46e5;--accent-soft:#eef0ff;--ok:#0b7d43;--ok-soft:#e6f6ee;--bad:#c5363c;--bad-soft:#fdecec;--metal:#0b7a70;--metal-soft:#e3f5f2;--awx:#ad4a0c;--awx-soft:#fdf0e7;--claude:#a84d2b;--claude-soft:#fbefe9;--a-sourcing:#2563eb}
.pv { display: block; width: 100%; height: auto; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.pv .pv-bg { fill: var(--bg); }
.pv .pv-box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
.pv .pv-sunk { fill: var(--sunken); stroke: none; }
.pv .pv-layer { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 5; }
.pv .pv-trust { fill: var(--accent-soft); stroke: none; }
.pv .pv-awx { fill: var(--awx-soft); stroke: none; } .pv .pv-metal { fill: var(--metal-soft); stroke: none; } .pv .pv-airi { fill: color-mix(in srgb, var(--a-sourcing) 13%, var(--surface)); stroke: none; }
.pv .pv-claude { fill: var(--claude-soft); stroke: none; } .pv .pv-ok { fill: var(--ok-soft); stroke: none; } .pv .pv-badbg { fill: var(--bad-soft); stroke: none; }
.pv text { fill: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.pv .t-eye { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: var(--faint); }
.pv .t-h { font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.pv .t-h2 { font-size: 16px; font-weight: 700; }
.pv .t-b { font-size: 14.5px; fill: var(--muted); }
.pv .t-s { font-size: 13px; fill: var(--muted); }
.pv .t-f { font-size: 12.5px; fill: var(--faint); }
.pv .t-cap { font-size: 15px; font-weight: 650; fill: var(--accent); }
.pv .t-bad { font-size: 13px; font-weight: 650; fill: var(--bad); }
.pv .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: var(--bad); }
.pv .t-awx { fill: var(--awx); } .pv .t-metal { fill: var(--metal); } .pv .t-airi { fill: var(--a-sourcing); } .pv .t-acc { fill: var(--accent); } .pv .t-rail { fill: var(--text); } .pv .t-claude { fill: var(--claude); } .pv .t-ok { fill: var(--ok); }
.pv .t-link { font-size: 13.5px; font-weight: 650; fill: var(--accent); }
.pv a:hover .t-link, .pv a:focus .t-link { text-decoration: underline; }
.pv a:focus-visible .pv-box { stroke: var(--accent); stroke-width: 3; }
.pv .pv-flow, .pv .pv-still { fill: none; stroke: var(--faint); stroke-width: 2; stroke-dasharray: 5 5; }
.pv .pv-tip { fill: var(--faint); }
.pv .pv-line { fill: none; stroke: var(--border); stroke-width: 3; stroke-linecap: round; }
.pv .pv-prog { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
.pv .pv-dot { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
.pv .pv-num { font-size: 15px; font-weight: 750; fill: var(--text); }
.pv .pv-ring { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.pv .pv-step-hl { fill: var(--accent-soft); opacity: 0; }
.pv-life-wide { --pv-len: 1032; } .pv-life-tall { --pv-len: 462; }
@media (prefers-reduced-motion: no-preference) {
  .pv .pv-flow { animation: pv-dash 1.6s linear infinite; }
  .pv .pv-prog { animation: pv-prog 15.91s linear infinite; }
  .pv .pv-ring, .pv .pv-step-hl { animation: pv-step 15.91s linear infinite; }
  .pv .pv-d0 { animation-delay: 0.00s; }
  .pv .pv-d1 { animation-delay: 1.75s; }
  .pv .pv-d2 { animation-delay: 3.50s; }
  .pv .pv-d3 { animation-delay: 5.25s; }
  .pv .pv-d4 { animation-delay: 7.00s; }
  .pv .pv-d5 { animation-delay: 8.75s; }
  .pv .pv-d6 { animation-delay: 10.50s; }
  .pv .pv-d7 { animation-delay: 12.25s; }
}
@keyframes pv-dash { to { stroke-dashoffset: -20; } }
@keyframes pv-prog { 0% { stroke-dashoffset: var(--pv-len); } 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
@keyframes pv-step { 0% { opacity: 0; } 1.5% { opacity: 1; } 11% { opacity: 1; } 13% { opacity: 0; } 100% { opacity: 0; } }
</style><defs><marker id="pv-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="pv-tip" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="pv-bg" width="1200" height="540"/>
<rect class="pv-claude" x="16" y="74" width="172" height="410" rx="18"/>
<text class="t-eye" x="34" y="106"><tspan x="34" dy="0">AGENTS</tspan></text>
<text class="t-h" x="34" y="132"><tspan x="34" dy="0">AI agents</tspan></text>
<text class="t-b" x="34" y="160"><tspan x="34" dy="0">Claude reads</tspan><tspan x="34" dy="20">invoices and</tspan><tspan x="34" dy="20">proposes payments</tspan></text>
<rect class="pv-box" x="32" y="244" width="140" height="36" rx="18"/>
<text class="t-h2" x="102" y="267" text-anchor="middle"><tspan x="102" dy="0">Sourcing</tspan></text>
<rect class="pv-box" x="32" y="290" width="140" height="36" rx="18"/>
<text class="t-h2" x="102" y="313" text-anchor="middle"><tspan x="102" dy="0">Support</tspan></text>
<rect class="pv-box" x="32" y="336" width="140" height="36" rx="18"/>
<text class="t-h2" x="102" y="359" text-anchor="middle"><tspan x="102" dy="0">Treasury</tspan></text>
<text class="t-bad" x="34" y="458"><tspan x="34" dy="0">Cannot change</tspan><tspan x="34" dy="18">its own limits</tspan></text>
<rect class="pv-layer" x="224" y="60" width="748" height="438" rx="24"/>
<text class="t-cap" x="598" y="48" text-anchor="middle"><tspan x="598" dy="0">Three layers that do not trust each other: each can stop a payment on its own.</tspan></text>
<rect class="pv-box" x="238" y="74" width="216" height="410" rx="18"/>
<text class="t-eye" x="256" y="106"><tspan x="256" dy="0">LAYER 1 · CODE</tspan></text>
<text class="t-h" x="256" y="132"><tspan x="256" dy="0">Purser's checks</tspan></text>
<text class="t-b" x="256" y="166"><tspan x="256" dy="0">Limits and budgets</tspan><tspan x="256" dy="20">per agent</tspan></text>
<text class="t-b" x="256" y="216"><tspan x="256" dy="0">Allowed payees and</tspan><tspan x="256" dy="20">merchants</tspan></text>
<text class="t-b" x="256" y="266"><tspan x="256" dy="0">The invoice adds up</tspan></text>
<text class="t-b" x="256" y="296"><tspan x="256" dy="0">Hashes the exact</tspan><tspan x="256" dy="20">terms</tspan></text>
<rect class="pv-badbg" x="250" y="350" width="192" height="58" rx="12"/>
<text class="t-bad" x="262" y="375"><tspan x="262" dy="0">Refuses over a limit</tspan><tspan x="262" dy="18">or an unknown payee</tspan></text>
<rect class="pv-box" x="490" y="74" width="216" height="410" rx="18"/>
<text class="t-eye" x="508" y="106"><tspan x="508" dy="0">LAYER 2 · SIGNATURE</tspan></text>
<text class="t-h" x="508" y="132"><tspan x="508" dy="0">CFO's Face ID</tspan></text>
<text class="t-b" x="508" y="166"><tspan x="508" dy="0">Above a limit, a</tspan><tspan x="508" dy="20">passkey signs the</tspan><tspan x="508" dy="20">hash of the exact</tspan><tspan x="508" dy="20">terms</tspan></text>
<text class="t-b" x="508" y="256"><tspan x="508" dy="0">Every change to a</tspan><tspan x="508" dy="20">limit is signed too</tspan></text>
<rect class="pv-badbg" x="502" y="310" width="192" height="76" rx="12"/>
<text class="t-bad" x="514" y="335"><tspan x="514" dy="0">Refuses terms</tspan><tspan x="514" dy="18">changed after</tspan><tspan x="514" dy="18">signing</tspan></text>
<rect class="pv-box" x="742" y="74" width="216" height="410" rx="18"/>
<text class="t-eye" x="760" y="106"><tspan x="760" dy="0">LAYER 3 · THE RAIL</tspan></text>
<text class="t-h" x="760" y="132"><tspan x="760" dy="0">The rail's own</tspan><tspan x="760" dy="22">controls</tspan></text>
<rect class="pv-awx" x="754" y="170" width="192" height="58" rx="12"/>
<text class="t-h2 t-awx" x="768" y="194"><tspan x="768" dy="0">Airwallex</tspan></text>
<text class="t-s" x="768" y="215"><tspan x="768" dy="0">Approvals, card limits</tspan></text>
<rect class="pv-metal" x="754" y="236" width="192" height="58" rx="12"/>
<text class="t-h2 t-metal" x="768" y="260"><tspan x="768" dy="0">Metal</tspan></text>
<text class="t-s" x="768" y="281"><tspan x="768" dy="0">Mandate cap on chain</tspan></text>
<rect class="pv-airi" x="754" y="302" width="192" height="58" rx="12"/>
<text class="t-h2 t-airi" x="768" y="326"><tspan x="768" dy="0">Visa via Airi</tspan></text>
<text class="t-s" x="768" y="347"><tspan x="768" dy="0">Cardholder's passkey</tspan></text>
<rect class="pv-badbg" x="754" y="370" width="192" height="76" rx="12"/>
<text class="t-bad" x="766" y="395"><tspan x="766" dy="0">Refuses over its own</tspan><tspan x="766" dy="18">limits, even after</tspan><tspan x="766" dy="18">Purser's yes</tspan></text>
<rect class="pv-box" x="1002" y="74" width="182" height="214" rx="18"/>
<text class="t-eye" x="1020" y="106"><tspan x="1020" dy="0">RECORD</tspan></text>
<text class="t-h" x="1020" y="132"><tspan x="1020" dy="0">Ledger</tspan></text>
<text class="t-b" x="1020" y="164"><tspan x="1020" dy="0">Hash-chained</tspan><tspan x="1020" dy="20">audit log</tspan></text>
<text class="t-b" x="1020" y="212"><tspan x="1020" dy="0">Books: T:0 and</tspan><tspan x="1020" dy="20">Moneybird,</tspan><tspan x="1020" dy="20">sandbox runs</tspan></text>
<rect class="pv-box" x="1002" y="318" width="182" height="166" rx="18"/>
<text class="t-h" x="1020" y="350"><tspan x="1020" dy="0">Archive</tspan></text>
<text class="t-s" x="1020" y="376"><tspan x="1020" dy="0">Purser Cloud</tspan><tspan x="1020" dy="17">(private preview):</tspan><tspan x="1020" dy="17">invoices,</tspan><tspan x="1020" dy="17">suppliers,</tspan><tspan x="1020" dy="17">payments, every</tspan><tspan x="1020" dy="17">version kept</tspan></text>
<path class="pv-flow" d="M1093 290 L1093 314" marker-end="url(#pv-arrow)"/>
<path class="pv-flow" d="M192 244 L220 244" marker-end="url(#pv-arrow)"/>
<path class="pv-flow" d="M458 244 L486 244" marker-end="url(#pv-arrow)"/>
<path class="pv-flow" d="M710 244 L738 244" marker-end="url(#pv-arrow)"/>
<path class="pv-flow" d="M976 159 L998 159" marker-end="url(#pv-arrow)"/>
<text class="t-f" x="600" y="522" text-anchor="middle"><tspan x="600" dy="0">Sandbox and testnet runs, test money.</tspan></text>
</svg>
