<svg xmlns="http://www.w3.org/2000/svg" width="760" height="214" viewBox="0 0 760 214" role="img" aria-label="The emergency stop: one Face ID sets freeze; every agent payment is refused and every agent card is set INACTIVE at Airwallex, so a charge declines CARD_INACTIVE. Tested against stand-ins; CARD_INACTIVE checked live on a single card; the full stop has not been pulled live end to end.">
<title>The emergency stop: one Face ID sets freeze; every agent payment is refused and every agent card is set INACTIVE at Airwallex, so a charge declines CARD_INACTIVE. Tested against stand-ins; CARD_INACTIVE checked live on a single card; the full stop has not been pulled live end to end.</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.bg{fill:#0d1117}.card{fill:#161b22;stroke:#3d444d}.ink{fill:#e6edf3}.muted{fill:#9198a1}.line{stroke:#3d444d;fill:none}.rose{fill:#fb7185}
.t{font-size:15px;font-weight:600}.l{font-size:13px;font-weight:600}.s{font-size:11.5px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.on{animation:on 7s linear infinite}.off{animation:off 7s linear infinite}
@keyframes on{0%,40%{opacity:1}48%,100%{opacity:0}}@keyframes off{0%,40%{opacity:0}48%,100%{opacity:1}}
.press{transform-box:fill-box;transform-origin:center;animation:press 7s ease-in-out infinite}
@keyframes press{0%,22%{transform:scale(1)}28%{transform:scale(.9)}34%,100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="bg" width="760" height="214" rx="10"/>
<text class="ink t" x="18" y="30">The emergency stop</text>
<g class="press"><circle cx="70" cy="92" r="34" fill="#f43f5e"/><text x="70" y="89" text-anchor="middle" class="l" fill="#111827">STOP</text><text x="70" y="104" text-anchor="middle" class="s" fill="#111827">all agents</text></g>
<text class="ink l" x="118" y="82">freeze set</text><text class="muted s" x="118" y="100">one Face ID approves</text>
<path class="line" d="M240 92h48" stroke-width="2"/>
<rect class="card" x="300" y="52" width="136" height="80" rx="10" stroke-width="1.5"/>
<text class="ink l" x="314" y="78">Agent card</text>
<text class="muted m" x="314" y="96">•••• •••• ••••</text>
<g class="on"><rect x="314" y="106" width="64" height="18" rx="9" fill="#10b981" opacity=".2"/><text class="ink s" x="324" y="119">ACTIVE</text></g>
<g class="off"><rect x="314" y="106" width="76" height="18" rx="9" fill="#f43f5e" opacity=".22"/><text class="s rose" x="322" y="119">INACTIVE</text></g>
<rect class="card" x="450" y="52" width="136" height="80" rx="10" stroke-width="1.5"/>
<text class="ink l" x="464" y="78">Agent card</text>
<text class="muted m" x="464" y="96">•••• •••• ••••</text>
<g class="on"><rect x="464" y="106" width="64" height="18" rx="9" fill="#10b981" opacity=".2"/><text class="ink s" x="474" y="119">ACTIVE</text></g>
<g class="off"><rect x="464" y="106" width="76" height="18" rx="9" fill="#f43f5e" opacity=".22"/><text class="s rose" x="472" y="119">INACTIVE</text></g>
<rect class="card" x="600" y="52" width="136" height="80" rx="10" stroke-width="1.5"/>
<text class="ink l" x="614" y="78">Agent card</text>
<text class="muted m" x="614" y="96">•••• •••• ••••</text>
<g class="on"><rect x="614" y="106" width="64" height="18" rx="9" fill="#10b981" opacity=".2"/><text class="ink s" x="624" y="119">ACTIVE</text></g>
<g class="off"><rect x="614" y="106" width="76" height="18" rx="9" fill="#f43f5e" opacity=".22"/><text class="s rose" x="622" y="119">INACTIVE</text></g>
<g class="off"><text class="l rose" x="300" y="158">Agent payments refused · card charges decline CARD_INACTIVE</text></g>
<text class="muted s" x="18" y="184">Tested against stand-ins (test/freeze.test.ts); CARD_INACTIVE checked live on a single card.</text>
<text class="muted s" x="18" y="201">The full stop has not been pulled live end to end (docs/runbook.md). Test money only.</text>
</svg>
