<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 224" width="1000" height="224" role="img" aria-labelledby="t d">
<title id="t">The money path, past Purser's checks</title>
<desc id="d">A payment moves from the agent through Purser's checks, the CFO's passkey and the executor's re-check to the rail on test money and the audit chain, each check lighting green. Then a payment whose terms changed by one cent after signing reaches the executor, turns red and is refused: nothing is paid.</desc>
