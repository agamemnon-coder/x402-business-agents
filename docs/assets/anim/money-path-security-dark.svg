<text class="c mv" x="20" y="204" fill="#34d399" opacity="0">Terms as signed: every check passes, the rail pays on test money, the chain records it.<animate attributeName="opacity" dur="16.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.025;0.4625;0.4875;1"/></text>
