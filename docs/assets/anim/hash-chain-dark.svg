<svg xmlns="http://www.w3.org/2000/svg" width="760" height="226" viewBox="0 0 760 226" role="img" aria-label="The books as a hash chain: entries 3, 4, 5, 6 of the /try payment, each hash over the previous one; change one entry and every hash after it breaks. Test money only.">
<title>The books as a hash chain: entries 3, 4, 5, 6 of the /try payment, each hash over the previous one; change one entry and every hash after it breaks. Test money only.</title>
<style>
