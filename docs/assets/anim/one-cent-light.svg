<svg xmlns="http://www.w3.org/2000/svg" width="760" height="196" viewBox="0 0 760 196" role="img" aria-label="One changed cent breaks the signature: EUR 1,850.00 to Bergtex Textil GmbH hashes to f168e40f…ec5d, which the CFO's passkey signed, so it is paid; the same signature sent with EUR 1,850.01 hashes to aa4e2b59…0aca, so it is refused. Test money only.">
<title>One changed cent breaks the signature: EUR 1,850.00 to Bergtex Textil GmbH hashes to f168e40f…ec5d, which the CFO's passkey signed, so it is paid; the same signature sent with EUR 1,850.01 hashes to aa4e2b59…0aca, so it is refused. Test money only.</title>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d1d9e0}.ink{fill:#1f2328}.muted{fill:#59636e}.line{stroke:#d1d9e0;fill:none}.rose{fill:#be123c}
.t{font-size:15px;font-weight:600}.l{font-size:13px;font-weight:600}.s{font-size:11.5px}.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.b{animation:b 8s ease-in-out infinite}
@keyframes b{0%,38%{opacity:0;transform:translateY(6px)}48%,90%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.cent{animation:cent 1s steps(2) infinite}@keyframes cent{50%{fill:#f59e0b}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect class="bg" width="760" height="196" rx="10"/>
<text class="ink t" x="18" y="30">One changed cent breaks the signature</text>
<rect class="card" x="18" y="46" width="724" height="50" rx="9" stroke-width="1.5"/>
<rect x="18" y="46" width="6" height="50" rx="3" fill="#10b981"/>
<text class="ink l" x="36" y="67">EUR 1,850.00</text><text class="muted s" x="36" y="85">to Bergtex Textil GmbH</text>
<text class="muted s" x="196" y="67">SHA-256 of the exact terms</text><text class="ink m" x="196" y="85">f168e40f…ec5d</text>
<path class="line" d="M352 71h26" stroke-width="2"/>
<rect x="390" y="57" width="352" height="28" rx="14" fill="#10b981" opacity=".16"/>
<text class="ink l" x="404" y="76">the CFO's passkey signed this hash: paid</text>
<g class="b"><rect class="card" x="18" y="108" width="724" height="50" rx="9" stroke-width="1.5"/>
<rect x="18" y="108" width="6" height="50" rx="3" fill="#f43f5e"/>
<text class="ink l" x="36" y="129">EUR 1,850.0<tspan class="cent rose">1</tspan></text><text class="muted s" x="36" y="147">to Bergtex Textil GmbH</text>
<text class="muted s" x="196" y="129">SHA-256 of the exact terms</text><text class="ink m" x="196" y="147">aa4e2b59…0aca</text>
<path class="line" d="M352 133h26" stroke-width="2"/>
<rect x="390" y="119" width="352" height="28" rx="14" fill="#f43f5e" opacity=".16"/>
<text class="ink l" x="404" y="138">a different hash, not the signed one: refused</text></g>
<text class="muted s" x="18" y="182">The /try samples of 15 Nov 2026 (docs/proof/try-paid.json, try-refused.json). Test money only.</text>
</svg>
