<svg xmlns="http://www.w3.org/2000/svg" class="pv pv-arch-tall" viewBox="0 0 400 1439" width="400" height="1439" role="img" aria-labelledby="pv-arch-tall-t pv-arch-tall-d">
<title id="pv-arch-tall-t">Purser: who can stop a payment</title><desc id="pv-arch-tall-d">AI agents propose payments. Three layers that do not trust each other can each stop one on its own: Purser's checks in code; the CFO's Face ID, a passkey over the exact terms, above the limits and on every change to them; and the rail's own controls (Airwallex, Alta, Visa Intelligent Commerce via Airi). Then the ledger and its hash-chained audit log; the books in sandbox runs; the archive in Purser Cloud, a private preview.</desc>
<style>.pv{--bg:#f7f8fa;--surface:#ffffff;--sunken:#f1f3f7;--border:#e3e6ec;--text:#0b1220;--muted:#586174;--faint:#646d7e;--accent:#4f46e5;--accent-soft:#eef0ff;--ok:#0b7d43;--ok-soft:#e6f6ee;--bad:#c5363c;--bad-soft:#fdecec;--metal:#0b7a70;--metal-soft:#e3f5f2;--awx:#ad4a0c;--awx-soft:#fdf0e7;--claude:#a84d2b;--claude-soft:#fbefe9;--a-sourcing:#2563eb}
.pv { display: block; width: 100%; height: auto; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.pv .pv-bg { fill: var(--bg); }
.pv .pv-box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
.pv .pv-sunk { fill: var(--sunken); stroke: none; }
.pv .pv-layer { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 5; }
.pv .pv-trust { fill: var(--accent-soft); stroke: none; }
.pv .pv-awx { fill: var(--awx-soft); stroke: none; } .pv .pv-metal { fill: var(--metal-soft); stroke: none; } .pv .pv-airi { fill: color-mix(in srgb, var(--a-sourcing) 13%, var(--surface)); stroke: none; }
.pv .pv-claude { fill: var(--claude-soft); stroke: none; } .pv .pv-ok { fill: var(--ok-soft); stroke: none; } .pv .pv-badbg { fill: var(--bad-soft); stroke: none; }
.pv text { fill: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.pv .t-eye { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: var(--faint); }
.pv .t-h { font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.pv .t-h2 { font-size: 16px; font-weight: 700; }
.pv .t-b { font-size: 14.5px; fill: var(--muted); }
.pv .t-s { font-size: 13px; fill: var(--muted); }
.pv .t-f { font-size: 12.5px; fill: var(--faint); }
.pv .t-cap { font-size: 15px; font-weight: 650; fill: var(--accent); }
.pv .t-bad { font-size: 13px; font-weight: 650; fill: var(--bad); }
.pv .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: var(--bad); }
.pv .t-awx { fill: var(--awx); } .pv .t-metal { fill: var(--metal); } .pv .t-airi { fill: var(--a-sourcing); } .pv .t-acc { fill: var(--accent); } .pv .t-rail { fill: var(--text); } .pv .t-claude { fill: var(--claude); } .pv .t-ok { fill: var(--ok); }
.pv .t-link { font-size: 13.5px; font-weight: 650; fill: var(--accent); }
.pv a:hover .t-link, .pv a:focus .t-link { text-decoration: underline; }
.pv a:focus-visible .pv-box { stroke: var(--accent); stroke-width: 3; }
.pv .pv-flow, .pv .pv-still { fill: none; stroke: var(--faint); stroke-width: 2; stroke-dasharray: 5 5; }
.pv .pv-tip { fill: var(--faint); }
.pv .pv-line { fill: none; stroke: var(--border); stroke-width: 3; stroke-linecap: round; }
.pv .pv-prog { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
.pv .pv-dot { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
.pv .pv-num { font-size: 15px; font-weight: 750; fill: var(--text); }
.pv .pv-ring { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.pv .pv-step-hl { fill: var(--accent-soft); opacity: 0; }
.pv-life-wide { --pv-len: 1032; } .pv-life-tall { --pv-len: 462; }
@media (prefers-reduced-motion: no-preference) {
  .pv .pv-flow { animation: pv-dash 1.6s linear infinite; }
  .pv .pv-prog { animation: pv-prog 15.91s linear infinite; }
  .pv .pv-ring, .pv .pv-step-hl { animation: pv-step 15.91s linear infinite; }
  .pv .pv-d0 { animation-delay: 0.00s; }
  .pv .pv-d1 { animation-delay: 1.75s; }
  .pv .pv-d2 { animation-delay: 3.50s; }
  .pv .pv-d3 { animation-delay: 5.25s; }
  .pv .pv-d4 { animation-delay: 7.00s; }
  .pv .pv-d5 { animation-delay: 8.75s; }
  .pv .pv-d6 { animation-delay: 10.50s; }
  .pv .pv-d7 { animation-delay: 12.25s; }
}
@keyframes pv-dash { to { stroke-dashoffset: -20; } }
@keyframes pv-prog { 0% { stroke-dashoffset: var(--pv-len); } 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
@keyframes pv-step { 0% { opacity: 0; } 1.5% { opacity: 1; } 11% { opacity: 1; } 13% { opacity: 0; } 100% { opacity: 0; } }
</style><defs><marker id="pv-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="pv-tip" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="pv-bg" width="400" height="1439"/>
<rect class="pv-claude" x="16" y="16" width="368" height="170" rx="18"/>
<text class="t-eye" x="34" y="46"><tspan x="34" dy="0">AGENTS</tspan></text>
<text class="t-h" x="34" y="72"><tspan x="34" dy="0">AI agents</tspan></text>
<text class="t-b" x="34" y="98"><tspan x="34" dy="0">Claude reads invoices and proposes</tspan><tspan x="34" dy="20">payments</tspan></text>
<rect class="pv-box" x="30" y="136" width="106" height="34" rx="17"/>
<text class="t-s" x="83" y="158" text-anchor="middle"><tspan x="83" dy="0">Sourcing</tspan></text>
<rect class="pv-box" x="144" y="136" width="106" height="34" rx="17"/>
<text class="t-s" x="197" y="158" text-anchor="middle"><tspan x="197" dy="0">Support</tspan></text>
<rect class="pv-box" x="258" y="136" width="106" height="34" rx="17"/>
<text class="t-s" x="311" y="158" text-anchor="middle"><tspan x="311" dy="0">Treasury</tspan></text>
<path class="pv-flow" d="M200 188 L200 212" marker-end="url(#pv-arrow)"/>
<text class="t-cap" x="200" y="232" text-anchor="middle"><tspan x="200" dy="0">Three layers that do not trust each</tspan><tspan x="200" dy="19">other: each can stop a payment on its</tspan><tspan x="200" dy="19">own.</tspan></text>
<rect class="pv-box" x="16" y="315" width="368" height="216" rx="18"/>
<text class="t-eye" x="34" y="343"><tspan x="34" dy="0">LAYER 1 · CODE</tspan></text>
<text class="t-h" x="34" y="369"><tspan x="34" dy="0">Purser's checks</tspan></text>
<text class="t-b" x="34" y="397"><tspan x="34" dy="0">Limits and budgets per agent</tspan><tspan x="34" dy="20">Allowed payees and merchants</tspan><tspan x="34" dy="20">The invoice adds up</tspan><tspan x="34" dy="20">Hashes the exact terms</tspan></text>
<rect class="pv-badbg" x="28" y="485" width="344" height="34" rx="10"/>
<text class="t-bad" x="40" y="507"><tspan x="40" dy="0">Refuses over a limit or an unknown payee</tspan></text>
<path class="pv-flow" d="M200 533 L200 557" marker-end="url(#pv-arrow)"/>
<rect class="pv-box" x="16" y="561" width="368" height="196" rx="18"/>
<text class="t-eye" x="34" y="589"><tspan x="34" dy="0">LAYER 2 · SIGNATURE</tspan></text>
<text class="t-h" x="34" y="615"><tspan x="34" dy="0">CFO's Face ID</tspan></text>
<text class="t-b" x="34" y="643"><tspan x="34" dy="0">Above a limit, a passkey signs the</tspan><tspan x="34" dy="20">hash of the exact terms</tspan><tspan x="34" dy="20">Every change to a limit is signed too</tspan></text>
<rect class="pv-badbg" x="28" y="711" width="344" height="34" rx="10"/>
<text class="t-bad" x="40" y="733"><tspan x="40" dy="0">Refuses terms changed after signing</tspan></text>
<path class="pv-flow" d="M200 759 L200 783" marker-end="url(#pv-arrow)"/>
<rect class="pv-box" x="16" y="787" width="368" height="306" rx="18"/>
<text class="t-eye" x="34" y="815"><tspan x="34" dy="0">LAYER 3 · THE RAIL</tspan></text>
<text class="t-h" x="34" y="841"><tspan x="34" dy="0">The rail's own controls</tspan></text>
<rect class="pv-awx" x="28" y="857" width="344" height="44" rx="10"/>
<text class="t-h2 t-awx" x="42" y="884"><tspan x="42" dy="0">Airwallex</tspan></text>
<text class="t-s" text-anchor="end" x="358" y="884"><tspan x="358" dy="0">Approvals, card limits</tspan></text>
<rect class="pv-metal" x="28" y="909" width="344" height="44" rx="10"/>
<text class="t-h2 t-metal" x="42" y="936"><tspan x="42" dy="0">Alta</tspan></text>
<text class="t-s" text-anchor="end" x="358" y="936"><tspan x="358" dy="0">Mandate cap on chain</tspan></text>
<rect class="pv-airi" x="28" y="961" width="344" height="44" rx="10"/>
<text class="t-h2 t-airi" x="42" y="988"><tspan x="42" dy="0">Visa via Airi</tspan></text>
<text class="t-s" text-anchor="end" x="358" y="988"><tspan x="358" dy="0">Cardholder's passkey</tspan></text>
<rect class="pv-badbg" x="28" y="1017" width="344" height="58" rx="10"/>
<text class="t-bad" x="40" y="1042"><tspan x="40" dy="0">Refuses over its own limits, even</tspan><tspan x="40" dy="18">after Purser's yes</tspan></text>
<rect class="pv-layer" x="10" y="303" width="380" height="796" rx="22"/>
<path class="pv-flow" d="M200 1103 L200 1127" marker-end="url(#pv-arrow)"/>
<rect class="pv-box" x="16" y="1131" width="368" height="114" rx="18"/>
<text class="t-eye" x="34" y="1159"><tspan x="34" dy="0">RECORD</tspan></text>
<text class="t-h" x="34" y="1185"><tspan x="34" dy="0">Ledger</tspan></text>
<text class="t-b" x="34" y="1211"><tspan x="34" dy="0">Hash-chained audit log</tspan><tspan x="34" dy="20">Books: T:0 and Moneybird, sandbox runs</tspan></text>
<path class="pv-flow" d="M200 1247 L200 1271" marker-end="url(#pv-arrow)"/>
<rect class="pv-box" x="16" y="1275" width="368" height="118" rx="18"/>
<text class="t-h" x="34" y="1307"><tspan x="34" dy="0">Archive</tspan></text>
<text class="t-b" x="34" y="1333"><tspan x="34" dy="0">Purser Cloud (private preview):</tspan><tspan x="34" dy="20">invoices, suppliers, payments, every</tspan><tspan x="34" dy="20">version kept</tspan></text>
<text class="t-f" x="200" y="1417" text-anchor="middle"><tspan x="200" dy="0">Sandbox and testnet runs, test money.</tspan></text>
</svg>
