<svg xmlns="http://www.w3.org/2000/svg" class="pv pv-arch-tall" viewBox="0 0 400 1380" width="400" height="1380" role="img" aria-labelledby="pv-arch-tall-t pv-arch-tall-d">
<title id="pv-arch-tall-t">Purser: how a payment is allowed</title><desc id="pv-arch-tall-d">AI agents propose payments. Three layers that do not trust each other must each say yes: Purser's checks in code, the CFO's Face ID over the exact terms, and the rail's own controls (Airwallex, Metal, Visa Intelligent Commerce via Airi). Then the payment is written to the ledger and the books, and archived.</desc>
<style>.pv{--bg:#f7f8fa;--surface:#ffffff;--sunken:#f1f3f7;--border:#e3e6ec;--text:#0b1220;--muted:#586174;--faint:#646d7e;--accent:#4f46e5;--accent-soft:#eef0ff;--ok:#0b7d43;--ok-soft:#e6f6ee;--bad:#c5363c;--bad-soft:#fdecec;--metal:#0b7a70;--metal-soft:#e3f5f2;--awx:#ad4a0c;--awx-soft:#fdf0e7;--claude:#a84d2b;--claude-soft:#fbefe9}
.pv { display: block; width: 100%; height: auto; font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.pv .pv-bg { fill: var(--bg); }
.pv .pv-box { fill: var(--surface); stroke: var(--border); stroke-width: 1.5; }
.pv .pv-sunk { fill: var(--sunken); stroke: none; }
.pv .pv-layer { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 6 5; }
.pv .pv-trust { fill: var(--accent-soft); stroke: none; }
.pv .pv-awx { fill: var(--awx-soft); stroke: none; } .pv .pv-metal { fill: var(--metal-soft); stroke: none; } .pv .pv-airi { fill: var(--accent-soft); stroke: none; }
.pv .pv-claude { fill: var(--claude-soft); stroke: none; } .pv .pv-ok { fill: var(--ok-soft); stroke: none; } .pv .pv-badbg { fill: var(--bad-soft); stroke: none; }
.pv text { fill: var(--text); font-family: Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.pv .t-eye { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; fill: var(--faint); }
.pv .t-h { font-size: 19px; font-weight: 750; letter-spacing: -.01em; }
.pv .t-h2 { font-size: 16px; font-weight: 700; }
.pv .t-b { font-size: 14.5px; fill: var(--muted); }
.pv .t-s { font-size: 13px; fill: var(--muted); }
.pv .t-f { font-size: 12.5px; fill: var(--faint); }
.pv .t-cap { font-size: 15px; font-weight: 650; fill: var(--accent); }
.pv .t-bad { font-size: 13px; font-weight: 650; fill: var(--bad); }
.pv .t-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700; fill: var(--bad); }
.pv .t-awx { fill: var(--awx); } .pv .t-metal { fill: var(--metal); } .pv .t-airi { fill: var(--accent); } .pv .t-claude { fill: var(--claude); } .pv .t-ok { fill: var(--ok); }
.pv .t-link { font-size: 13.5px; font-weight: 650; fill: var(--accent); }
.pv a:hover .t-link, .pv a:focus .t-link { text-decoration: underline; }
.pv a:focus-visible .pv-box { stroke: var(--accent); stroke-width: 3; }
.pv .pv-flow, .pv .pv-still { fill: none; stroke: var(--faint); stroke-width: 2; stroke-dasharray: 5 5; }
.pv .pv-tip { fill: var(--faint); }
.pv .pv-line { fill: none; stroke: var(--border); stroke-width: 3; stroke-linecap: round; }
.pv .pv-prog { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; }
.pv .pv-dot { fill: var(--surface); stroke: var(--border); stroke-width: 2; }
.pv .pv-num { font-size: 15px; font-weight: 750; fill: var(--text); }
.pv .pv-ring { fill: none; stroke: var(--accent); stroke-width: 3; opacity: 0; }
.pv .pv-step-hl { fill: var(--accent-soft); opacity: 0; }
.pv-life-wide { --pv-len: 1080; } .pv-life-tall { --pv-len: 462; }
@media (prefers-reduced-motion: no-preference) {
  .pv .pv-flow { animation: pv-dash 1.6s linear infinite; }
  .pv .pv-prog { animation: pv-prog 15.91s linear infinite; }
  .pv .pv-ring, .pv .pv-step-hl { animation: pv-step 15.91s linear infinite; }
  .pv .pv-d0 { animation-delay: 0.00s; }
  .pv .pv-d1 { animation-delay: 1.75s; }
  .pv .pv-d2 { animation-delay: 3.50s; }
  .pv .pv-d3 { animation-delay: 5.25s; }
  .pv .pv-d4 { animation-delay: 7.00s; }
  .pv .pv-d5 { animation-delay: 8.75s; }
  .pv .pv-d6 { animation-delay: 10.50s; }
  .pv .pv-d7 { animation-delay: 12.25s; }
}
@keyframes pv-dash { to { stroke-dashoffset: -20; } }
@keyframes pv-prog { 0% { stroke-dashoffset: var(--pv-len); } 88% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
@keyframes pv-step { 0% { opacity: 0; } 1.5% { opacity: 1; } 11% { opacity: 1; } 13% { opacity: 0; } 100% { opacity: 0; } }
</style><defs><marker id="pv-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="pv-tip" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect class="pv-bg" width="400" height="1380"/>
<rect class="pv-claude" x="16" y="16" width="368" height="170" rx="18"/>
<text class="t-eye" x="34" y="46"><tspan x="34" dy="0">AGENTS</tspan></text>
<text class="t-h" x="34" y="72"><tspan x="34" dy="0">AI agents</tspan></text>
<text class="t-b" x="34" y="98"><tspan x="34" dy="0">Claude reads invoices and proposes</tspan><tspan x="34" dy="20">payments</tspan></text>
<rect class="pv-box" x="30" y="136" width="106" height="34" rx="17"/>
<text class="t-s" x="83" y="158" text-anchor="middle"><tspan x="83" dy="0">Sourcing</tspan></text>
<rect class="pv-box" x="144" y="136" width="106" height="34" rx="17"/>
<text class="t-s" x="197" y="158" text-anchor="middle"><tspan x="197" dy="0">Support</tspan></text>
<rect class="pv-box" x="258" y="136" width="106" height="34" rx="17"/>
<text class="t-s" x="311" y="158" text-anchor="middle"><tspan x="311" dy="0">Treasury</tspan></text>
<path class="pv-flow" d="M200 188 L200 212" marker-end="url(#pv-arrow)"/>
<text class="t-cap" x="200" y="232" text-anchor="middle"><tspan x="200" dy="0">Three layers that do not trust each other:</tspan><tspan x="200" dy="19">each one checks again, on its own.</tspan></text>
<rect class="pv-box" x="16" y="276" width="368" height="216" rx="18"/>
<text class="t-eye" x="34" y="304"><tspan x="34" dy="0">LAYER 1 · CODE</tspan></text>
<text class="t-h" x="34" y="330"><tspan x="34" dy="0">Purser's checks</tspan></text>
<text class="t-b" x="34" y="358"><tspan x="34" dy="0">Limits and budgets per agent</tspan><tspan x="34" dy="20">Allowed payees and merchants</tspan><tspan x="34" dy="20">The invoice adds up</tspan><tspan x="34" dy="20">Hashes the exact terms</tspan></text>
<rect class="pv-badbg" x="28" y="446" width="344" height="34" rx="10"/>
<text class="t-bad" x="40" y="468"><tspan x="40" dy="0">Refuses over a limit or an unknown payee</tspan></text>
<path class="pv-flow" d="M200 494 L200 518" marker-end="url(#pv-arrow)"/>
<rect class="pv-box" x="16" y="522" width="368" height="216" rx="18"/>
<text class="t-eye" x="34" y="550"><tspan x="34" dy="0">LAYER 2 · SIGNATURE</tspan></text>
<text class="t-h" x="34" y="576"><tspan x="34" dy="0">The CFO's Face ID</tspan></text>
<text class="t-b" x="34" y="604"><tspan x="34" dy="0">A passkey signs the hash of the exact</tspan><tspan x="34" dy="20">terms</tspan><tspan x="34" dy="20">Before paying, Purser hashes the terms</tspan><tspan x="34" dy="20">again</tspan></text>
<rect class="pv-badbg" x="28" y="692" width="344" height="34" rx="10"/>
<text class="t-bad" x="40" y="714"><tspan x="40" dy="0">Refuses terms changed after signing</tspan></text>
<path class="pv-flow" d="M200 740 L200 764" marker-end="url(#pv-arrow)"/>
<rect class="pv-box" x="16" y="768" width="368" height="294" rx="18"/>
<text class="t-eye" x="34" y="796"><tspan x="34" dy="0">LAYER 3 · THE RAIL</tspan></text>
<text class="t-h" x="34" y="822"><tspan x="34" dy="0">The rail's own controls</tspan></text>
<rect class="pv-awx" x="28" y="838" width="344" height="44" rx="10"/>
<text class="t-h2 t-awx" x="42" y="865"><tspan x="42" dy="0">Airwallex</tspan></text>
<text class="t-s" text-anchor="end" x="358" y="865"><tspan x="358" dy="0">Transfer approvals, card limits</tspan></text>
<rect class="pv-metal" x="28" y="890" width="344" height="44" rx="10"/>
<text class="t-h2 t-metal" x="42" y="917"><tspan x="42" dy="0">Metal</tspan></text>
<text class="t-s" text-anchor="end" x="358" y="917"><tspan x="358" dy="0">Mandate cap, on chain</tspan></text>
<rect class="pv-airi" x="28" y="942" width="344" height="44" rx="10"/>
<text class="t-h2 t-airi" x="42" y="969"><tspan x="42" dy="0">Visa via Airi</tspan></text>
<text class="t-s" text-anchor="end" x="358" y="969"><tspan x="358" dy="0">Cardholder's passkey</tspan></text>
<rect class="pv-badbg" x="28" y="996" width="344" height="54" rx="10"/>
<text class="t-bad" x="40" y="1018"><tspan x="40" dy="0">Refuses on its own limits,</tspan><tspan x="40" dy="18">even after Purser's yes</tspan></text>
<rect class="pv-layer" x="10" y="264" width="380" height="804" rx="22"/>
<path class="pv-flow" d="M200 1072 L200 1096" marker-end="url(#pv-arrow)"/>
<rect class="pv-box" x="16" y="1100" width="368" height="112" rx="18"/>
<text class="t-eye" x="34" y="1128"><tspan x="34" dy="0">RECORD</tspan></text>
<text class="t-h" x="34" y="1154"><tspan x="34" dy="0">Ledger and books</tspan></text>
<text class="t-b" x="34" y="1180"><tspan x="34" dy="0">Hash-chained audit log</tspan><tspan x="34" dy="20">Books posted to the accounting</tspan></text>
<path class="pv-flow" d="M200 1214 L200 1238" marker-end="url(#pv-arrow)"/>
<rect class="pv-box" x="16" y="1242" width="368" height="92" rx="18"/>
<text class="t-h" x="34" y="1274"><tspan x="34" dy="0">Archive</tspan></text>
<text class="t-b" x="34" y="1300"><tspan x="34" dy="0">Invoice, terms, signature and receipt,</tspan><tspan x="34" dy="20">every version kept</tspan></text>
<text class="t-f" x="200" y="1358" text-anchor="middle"><tspan x="200" dy="0">A payment moves only when all three layers say</tspan><tspan x="200" dy="16">yes. Sandbox and testnet runs, test money.</tspan></text>
</svg>
