<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">Purser's flow, in six seconds</title>
<desc id="d">An agent asks to pay an invoice of EUR 240.00. Three locks hold in turn: Airwallex's card controls, Alta's mandate and the CFO's passkey, which signs the SHA-256 of the exact terms. The amount changes to EUR 240.01: the signature no longer matches, and the payment is refused. An illustration; test money.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.t{fill:#eef1f6}.m{fill:#a4adbd}.f{fill:#858fa1}
.lit,.sig,.bad,.amt2,.arr{opacity:0;animation:6s linear infinite}
.amt1{animation:amt1 6s linear infinite}
.l0{animation-name:l0}.l1{animation-name:l1}.l2{animation-name:l2}.sig{animation-name:sig}.bad{animation-name:bad}.amt2{animation-name:amt2}.arr{animation-name:arr}
@keyframes l0{0%,14%{opacity:0}18%,92%{opacity:1}97%,100%{opacity:0}}
@keyframes l1{0%,24%{opacity:0}28%,92%{opacity:1}97%,100%{opacity:0}}
@keyframes l2{0%,34%{opacity:0}38%,92%{opacity:1}97%,100%{opacity:0}}
@keyframes arr{0%,8%{opacity:0}12%,92%{opacity:1}97%,100%{opacity:0}}
@keyframes sig{0%,42%{opacity:0}46%,60%{opacity:1}63%,100%{opacity:0}}
@keyframes amt1{0%,60%{opacity:1}63%,94%{opacity:0}97%,100%{opacity:1}}
@keyframes amt2{0%,60%{opacity:0}63%,92%{opacity:1}97%,100%{opacity:0}}
@keyframes bad{0%,63%{opacity:0}67%,92%{opacity:1}97%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.lit,.sig,.arr,.amt1{animation:none;opacity:1}.amt2,.bad{animation:none;opacity:0}}
</style>
<rect width="1200" height="340" rx="20" fill="#0a0c11"/>
<g transform="translate(40 64)">
  <rect width="330" height="218" rx="16" fill="#12151d" stroke="#262b37"/>
  <text x="24" y="38" class="m" font-size="13" font-weight="600" letter-spacing=".06em">AGENT · SOURCING</text>
  <text x="24" y="70" class="t" font-size="18" font-weight="650">Pay the supplier's invoice</text>
  <text x="24" y="132" class="t amt1" font-size="40" font-weight="760" letter-spacing="-.02em">EUR 240.00</text>
  <text x="24" y="132" class="amt2" fill="#ff6b70" font-size="40" font-weight="760" letter-spacing="-.02em">EUR 240.01</text>
  <text x="24" y="168" class="m" font-size="14">payee, account, amount, due date</text>
  <text x="24" y="192" class="f" font-size="13">the exact terms, hashed with SHA-256</text>
</g>
<g class="arr" fill="none" stroke="#858fa1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M384 173h40M416 165l8 8-8 8"/><path d="M784 173h40M816 165l8 8-8 8"/></g>
<g transform="translate(440 64)">
  <rect width="330" height="62" rx="14" fill="#12151d" stroke="#262b37"/>
  <rect class="lit l0" width="330" height="62" rx="14" fill="#33200f" stroke="#ff8a4c" stroke-width="2"/>
  <g transform="translate(18 15)"><rect width="32" height="32" rx="9" fill="#0a0c11" stroke="#262b37"/><g class="lit l0"><rect width="32" height="32" rx="9" fill="#ff8a4c"/><path d="M10 16.5l4 4 8-9" fill="none" stroke="#12151d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="64" y="28" class="t" font-size="16" font-weight="650">Airwallex card controls</text>
  <text x="64" y="47" class="m" font-size="13">the card's own limit</text>
</g>
<g transform="translate(440 142)">
  <rect width="330" height="62" rx="14" fill="#12151d" stroke="#262b37"/>
  <rect class="lit l1" width="330" height="62" rx="14" fill="#0f2a28" stroke="#2dd4bf" stroke-width="2"/>
  <g transform="translate(18 15)"><rect width="32" height="32" rx="9" fill="#0a0c11" stroke="#262b37"/><g class="lit l1"><rect width="32" height="32" rx="9" fill="#2dd4bf"/><path d="M10 16.5l4 4 8-9" fill="none" stroke="#12151d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="64" y="28" class="t" font-size="16" font-weight="650">Alta mandate</text>
  <text x="64" y="47" class="m" font-size="13">the agent's on-chain budget</text>
</g>
<g transform="translate(440 220)">
  <rect width="330" height="62" rx="14" fill="#12151d" stroke="#262b37"/>
  <rect class="lit l2" width="330" height="62" rx="14" fill="#23224a" stroke="#8b85ff" stroke-width="2"/>
  <g transform="translate(18 15)"><rect width="32" height="32" rx="9" fill="#0a0c11" stroke="#262b37"/><g class="lit l2"><rect width="32" height="32" rx="9" fill="#8b85ff"/><path d="M10 16.5l4 4 8-9" fill="none" stroke="#12151d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  <text x="64" y="28" class="t" font-size="16" font-weight="650">CFO passkey</text>
  <text x="64" y="47" class="m" font-size="13">Face ID on the exact terms</text>
</g>
<g transform="translate(840 64)">
  <rect width="320" height="218" rx="16" fill="#12151d" stroke="#262b37"/>
  <text x="24" y="38" class="m" font-size="13" font-weight="600" letter-spacing=".06em">THE CFO'S SIGNATURE</text>
  <g class="sig"><rect x="20" y="62" width="280" height="132" rx="14" fill="#12291e" stroke="#3ccf82" stroke-width="2"/>
    <text x="40" y="104" fill="#3ccf82" font-size="20" font-weight="720">✓ Signed</text>
    <text x="40" y="134" class="t" font-size="15">SHA-256 of the exact terms,</text>
    <text x="40" y="156" class="t" font-size="15">with the CFO's passkey</text>
    <text x="40" y="180" class="m" font-size="13">Face ID on iPhone</text></g>
  <g class="bad"><rect x="20" y="62" width="280" height="132" rx="14" fill="#341a1c" stroke="#ff6b70" stroke-width="2"/>
    <text x="40" y="104" fill="#ff6b70" font-size="20" font-weight="720">✕ Refused</text>
    <text x="40" y="134" class="t" font-size="15">One cent changed: the</text>
    <text x="40" y="156" class="t" font-size="15">signature no longer matches</text>
    <text x="40" y="180" class="m" font-size="13">nothing is paid</text></g>
</g>
<text x="40" y="34" class="t" font-size="15" font-weight="700">Purser</text>
<text x="98" y="34" class="m" font-size="14">· how a payment is held, signed, and refused when one cent changes</text>
<text x="1160" y="320" class="f" font-size="12" text-anchor="end">An illustration of the flow · test money</text>
</svg>
