<text x="250" y="732" font-size="12" font-weight="600" fill="#0b1220">Deploys are by hand with wrangler: npm run relay:deploy (kit11) and wrangler deploy -c cloud/wrangler.try.jsonc (purser-try).</text>
<text x="250" y="749" font-size="11.5" font-weight="500" fill="#586174">Six jobs in .github/workflows/ci.yml; CodeQL is GitHub's code scanning.</text>
