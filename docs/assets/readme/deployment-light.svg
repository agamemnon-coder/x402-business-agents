<text x="926" y="163" font-size="12" font-weight="650" fill="#0e7490">npm run up</text>
<text x="926" y="184" font-size="12.5" font-weight="500" fill="#586174">the live runs: ledger, executors,</text>
<text x="926" y="201" font-size="12.5" font-weight="500" fill="#586174">the rails' keys, on one machine;</text>
<text x="926" y="218" font-size="12.5" font-weight="500" fill="#586174">calls the rails, Claude and T:0</text>
