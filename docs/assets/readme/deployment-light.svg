<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Purser deployment</title>
<desc id="d">The visitor's browser holds the passkey; only its public key and signatures reach Purser. Two Cloudflare Workers: kit11 (the site, /verify, the relay Durable Object RelayObject and the Airwallex entrypoints, which hands /try to purser-try) and purser-try (Purser Cloud's console and API, /try's engine as the Durable Object CompanyEngine, one per company, the D1 database purser-try, the MCP server). They call each other through service bindings. Keys are Worker secrets, none in git or the browser. A Node runner does the live runs and syncs through the relay. Outside: the Airwallex sandbox API, Alta testnet, the Anthropic Claude API and the T:0 sandbox. GitHub Actions runs checks on every push and deploys nothing; deploys are by hand with wrangler.</desc>
