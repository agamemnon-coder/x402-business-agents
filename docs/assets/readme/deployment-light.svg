<text x="938" y="326" font-size="12.5" font-weight="500" fill="#586174">cards, transfers, FX;</text>
<text x="938" y="343" font-size="12.5" font-weight="500" fill="#586174">Visa (VIC) via Airwallex Airi</text>
<rect class="box" x="922" y="363" width="238" height="77" rx="12" fill="#ffffff" stroke="#d5dbe6" stroke-width="1.2"/>
