<text x="938" y="409" font-size="12.5" font-weight="500" fill="#586174">the RPC, and the explorer at</text>
<text x="938" y="426" font-size="12.5" font-weight="500" fill="#586174">testnet.metalntwx.com</text>
<rect class="box" x="922" y="446" width="238" height="77" rx="12" fill="#ffffff" stroke="#d5dbe6" stroke-width="1.2"/>
