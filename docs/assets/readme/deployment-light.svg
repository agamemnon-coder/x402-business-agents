<rect width="1200" height="770" fill="#f7f8fa"/><rect width="1200" height="770" fill="url(#glow)"/>
<text x="32" y="38" font-size="21" font-weight="750" fill="#0b1220" letter-spacing="-0.01em">Purser: where it runs</text>
<text x="32" y="59" font-size="13" font-weight="500" fill="#586174">Two Cloudflare Workers, deployed by hand with wrangler. The test rails and the models are outside. Test money only.</text>
<text x="32" y="108" font-size="11.5" font-weight="750" fill="#646d7e" letter-spacing="0.08em">ON THE VISITOR'S DEVICE</text>
<rect class="box" x="32" y="120" width="232" height="238" rx="12" fill="#ffffff" stroke="#d5dbe6" stroke-width="1.2"/>
<rect x="32" y="132" width="4" height="214" rx="2" fill="#475569"/>
<text x="48" y="145" font-size="15" font-weight="750" fill="#0b1220">Browser</text>
<text x="48" y="166" font-size="12.5" font-weight="500" fill="#586174">kit11's site: /try, /proof, /verify</text>
<text x="48" y="183" font-size="12.5" font-weight="500" fill="#586174">purser-try's console</text>
<text x="48" y="200" font-size="12.5" font-weight="500" fill="#586174">/verify checks a proof here,</text>
<text x="48" y="217" font-size="12.5" font-weight="500" fill="#586174">in WebCrypto, with no server</text>
<rect x="46" y="248" width="204" height="96" rx="10" fill="#eaeff8" stroke="#4382e8" stroke-width="1.5"/>
<circle cx="64" cy="270" r="6.5" fill="none" stroke="#4382e8" stroke-width="2.2"/><path d="M70.5 270 L85 270 M80 270 L80 275 M84.5 270 L84.5 274" stroke="#4382e8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<text x="93" y="275" font-size="13.5" font-weight="750" fill="#0b1220">Passkey, on the device</text>
<text x="58" y="296" font-size="12" font-weight="500" fill="#586174">Face ID, Touch ID or a key.</text>
<text x="58" y="312" font-size="12" font-weight="500" fill="#586174">Signs the SHA-256 of the</text>
<text x="58" y="328" font-size="12" font-weight="500" fill="#586174">exact terms.</text>
<text x="32" y="458" font-size="11.5" font-weight="750" fill="#646d7e" letter-spacing="0.08em">ANY MCP CLIENT</text>
<rect class="box" x="32" y="470" width="232" height="84" rx="12" fill="#ffffff" stroke="#d5dbe6" stroke-width="1.2"/>
<rect x="32" y="482" width="4" height="60" rx="2" fill="#a84d2b"/>
<text x="48" y="495" font-size="15" font-weight="750" fill="#0b1220">Your AI</text>
<text x="48" y="516" font-size="12.5" font-weight="500" fill="#586174">purser-try/mcp: reads the</text>
<text x="48" y="533" font-size="12.5" font-weight="500" fill="#586174">books, may propose, never pays</text>
<rect x="300" y="84" width="574" height="532" rx="18" fill="#ebecf9" stroke="#4382e8" stroke-width="1.6" stroke-dasharray="8 6"/>
<text x="318" y="114" font-size="16.5" font-weight="800" fill="#4382e8">Cloudflare Workers</text>
<text x="856" y="114" font-size="12" font-weight="600" fill="#646d7e" text-anchor="end">workers.dev · test money</text>
<rect class="box" x="318" y="132" width="538" height="204" rx="12" fill="#ffffff" stroke="#d5dbe6" stroke-width="1.2"/>
<rect x="318" y="144" width="4" height="180" rx="2" fill="#475569"/>
<text x="334" y="157" font-size="15" font-weight="750" fill="#0b1220">Worker kit11</text>
<text x="334" y="175" font-size="12" font-weight="650" fill="#475569">worker/ · npm run relay:deploy</text>
<text x="334" y="196" font-size="12.5" font-weight="500" fill="#586174">The site: Home, Try, Proof, /verify</text>
<text x="334" y="213" font-size="12.5" font-weight="500" fill="#586174">Hands /try to purser-try</text>
<text x="334" y="230" font-size="12.5" font-weight="500" fill="#586174">Airwallex entrypoints for purser-try:</text>
<text x="334" y="247" font-size="12.5" font-weight="500" fill="#586174">AwxFx, AwxRead, AwxCards, AwxGateway</text>
<text x="334" y="271" font-size="11.5" font-weight="600" fill="#0b7d43">secrets: RELAY_TOKEN, AIRWALLEX_*,</text>
<text x="334" y="287" font-size="11.5" font-weight="600" fill="#0b7d43">ANTHROPIC_API_KEY, METAL_RPC_URL</text>
<rect x="600" y="188" width="238" height="132" rx="9" fill="#e7eff3" stroke="#0e7490" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="612" y="209" font-size="12.5" font-weight="750" fill="#0b1220">Durable Object RelayObject</text>
<text x="612" y="227" font-size="12" font-weight="500" fill="#586174">SQLite: the relay between the</text>
<text x="612" y="243" font-size="12" font-weight="500" fill="#586174">runner and the CFO's phone.</text>
<text x="612" y="259" font-size="12" font-weight="500" fill="#586174">Checks the phone's passkey</text>
<text x="612" y="275" font-size="12" font-weight="500" fill="#586174">(WebCrypto). It can refuse;</text>
<text x="612" y="291" font-size="12" font-weight="500" fill="#586174">it never approves or pays.</text>
<path d="M420,339 L420,390" fill="none" stroke="#4382e8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahk)"/>
