<text x="938" y="471" font-size="15" font-weight="750" fill="#0b1220">Anthropic Claude API</text>
<text x="938" y="492" font-size="12.5" font-weight="500" fill="#586174">Haiku, Sonnet, Opus; no key</text>
<text x="938" y="509" font-size="12.5" font-weight="500" fill="#586174">or credential in a prompt</text>
<rect class="box" x="922" y="529" width="238" height="77" rx="12" fill="#ffffff" stroke="#d5dbe6" stroke-width="1.2"/>
<rect x="922" y="541" width="4" height="53" rx="2" fill="#475569"/>
