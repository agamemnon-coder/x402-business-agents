<text x="480" y="362" font-size="11" font-weight="750" fill="#0b1220">AWX_FX, AWX_READ, AWX_CARDS, AWX_GATEWAY</text>
<text x="480" y="378" font-size="11" font-weight="500" fill="#586174">service bindings: the Airwallex calls go through kit11</text>
