<rect x="318" y="406" width="4" height="142" rx="2" fill="#4382e8"/>
<text x="334" y="419" font-size="15" font-weight="750" fill="#0b1220">Worker purser-try</text>
<text x="334" y="437" font-size="12" font-weight="650" fill="#4382e8">cloud/ · wrangler deploy -c cloud/wrangler.try.jsonc</text>
<text x="334" y="458" font-size="12.5" font-weight="500" fill="#586174">Purser Cloud: console and API</text>
<text x="334" y="475" font-size="12.5" font-weight="500" fill="#586174">/try's engine and its passkey check</text>
<text x="334" y="492" font-size="12.5" font-weight="500" fill="#586174">/mcp (read, propose); hourly cron</text>
<text x="334" y="516" font-size="11.5" font-weight="600" fill="#0b7d43">secrets: SESSION_SECRET,</text>
<text x="334" y="532" font-size="11.5" font-weight="600" fill="#0b7d43">ADMIN_TOKEN_SHA256,</text>
<text x="334" y="548" font-size="11.5" font-weight="600" fill="#0b7d43">KIT11_ANTHROPIC_API_KEY</text>
<rect x="600" y="442" width="238" height="50" rx="9" fill="#e7eff3" stroke="#0e7490" stroke-width="1.2" stroke-dasharray="4 3"/>
