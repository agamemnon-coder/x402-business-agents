<rect x="32" y="482" width="4" height="60" rx="2" fill="#ef9a76"/>
<text x="48" y="495" font-size="15" font-weight="750" fill="#eef1f6">Your AI</text>
<text x="48" y="516" font-size="12.5" font-weight="500" fill="#a4adbd">purser-try/mcp: reads the</text>
<text x="48" y="533" font-size="12.5" font-weight="500" fill="#a4adbd">books, may propose, never pays</text>
