<text x="938" y="492" font-size="12.5" font-weight="500" fill="#a4adbd">Haiku, Sonnet, Opus; no key</text>
<text x="938" y="509" font-size="12.5" font-weight="500" fill="#a4adbd">or credential in a prompt</text>
