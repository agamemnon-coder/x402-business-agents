<text x="926" y="163" font-size="12" font-weight="650" fill="#22d3ee">npm run up</text>
<text x="926" y="184" font-size="12.5" font-weight="500" fill="#a4adbd">the live runs: ledger, executors,</text>
<text x="926" y="201" font-size="12.5" font-weight="500" fill="#a4adbd">the rails' keys, on one machine;</text>
<text x="926" y="218" font-size="12.5" font-weight="500" fill="#a4adbd">calls the rails, Claude and T:0</text>
