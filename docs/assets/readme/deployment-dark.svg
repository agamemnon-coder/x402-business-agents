<text x="938" y="326" font-size="12.5" font-weight="500" fill="#a4adbd">cards, transfers, FX;</text>
<text x="938" y="343" font-size="12.5" font-weight="500" fill="#a4adbd">Visa (VIC) via Airwallex Airi</text>
