<rect width="1200" height="770" fill="#0b1222"/><rect width="1200" height="770" fill="url(#glow)"/>
<text x="32" y="38" font-size="21" font-weight="750" fill="#eef1f6" letter-spacing="-0.01em">Purser: where it runs</text>
<text x="32" y="59" font-size="13" font-weight="500" fill="#a4adbd">Two Cloudflare Workers, deployed by hand with wrangler. The test rails and the models are outside. Test money only.</text>
<text x="32" y="108" font-size="11.5" font-weight="750" fill="#7d879a" letter-spacing="0.08em">ON THE VISITOR'S DEVICE</text>
<rect class="box" x="32" y="120" width="232" height="238" rx="12" fill="#121a2c" stroke="#2b3654" stroke-width="1.2"/>
<rect x="32" y="132" width="4" height="214" rx="2" fill="#93a4c3"/>
<text x="48" y="145" font-size="15" font-weight="750" fill="#eef1f6">Browser</text>
<text x="48" y="166" font-size="12.5" font-weight="500" fill="#a4adbd">kit11's site: /try, /proof, /verify</text>
<text x="48" y="183" font-size="12.5" font-weight="500" fill="#a4adbd">purser-try's console</text>
<text x="48" y="200" font-size="12.5" font-weight="500" fill="#a4adbd">/verify checks a proof here,</text>
<text x="48" y="217" font-size="12.5" font-weight="500" fill="#a4adbd">in WebCrypto, with no server</text>
<rect x="46" y="248" width="204" height="96" rx="10" fill="#22274a" stroke="#85b4ff" stroke-width="1.5"/>
<circle cx="64" cy="270" r="6.5" fill="none" stroke="#85b4ff" stroke-width="2.2"/><path d="M70.5 270 L85 270 M80 270 L80 275 M84.5 270 L84.5 274" stroke="#85b4ff" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<text x="93" y="275" font-size="13.5" font-weight="750" fill="#eef1f6">Passkey, on the device</text>
<text x="58" y="296" font-size="12" font-weight="500" fill="#a4adbd">Face ID, Touch ID or a key.</text>
<text x="58" y="312" font-size="12" font-weight="500" fill="#a4adbd">Signs the SHA-256 of the</text>
<text x="58" y="328" font-size="12" font-weight="500" fill="#a4adbd">exact terms.</text>
<text x="32" y="458" font-size="11.5" font-weight="750" fill="#7d879a" letter-spacing="0.08em">ANY MCP CLIENT</text>
