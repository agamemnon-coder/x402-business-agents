<text x="318" y="114" font-size="16.5" font-weight="800" fill="#85b4ff">Cloudflare Workers</text>
<text x="856" y="114" font-size="12" font-weight="600" fill="#7d879a" text-anchor="end">workers.dev · test money</text>
<rect class="box" x="318" y="132" width="538" height="204" rx="12" fill="#121a2c" stroke="#2b3654" stroke-width="1.2"/>
<rect x="318" y="144" width="4" height="180" rx="2" fill="#93a4c3"/>
<text x="334" y="157" font-size="15" font-weight="750" fill="#eef1f6">Worker kit11</text>
<text x="334" y="175" font-size="12" font-weight="650" fill="#93a4c3">worker/ · npm run relay:deploy</text>
<text x="334" y="196" font-size="12.5" font-weight="500" fill="#a4adbd">The site: Home, Try, Proof, /verify</text>
<text x="334" y="213" font-size="12.5" font-weight="500" fill="#a4adbd">Hands /try to purser-try</text>
<text x="334" y="230" font-size="12.5" font-weight="500" fill="#a4adbd">Airwallex entrypoints for purser-try:</text>
<text x="334" y="247" font-size="12.5" font-weight="500" fill="#a4adbd">AwxFx, AwxRead, AwxCards, AwxGateway</text>
<text x="334" y="271" font-size="11.5" font-weight="600" fill="#3ccf82">secrets: RELAY_TOKEN, AIRWALLEX_*,</text>
<text x="334" y="287" font-size="11.5" font-weight="600" fill="#3ccf82">ANTHROPIC_API_KEY, METAL_RPC_URL</text>
<rect x="600" y="188" width="238" height="132" rx="9" fill="#0e293a" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="612" y="209" font-size="12.5" font-weight="750" fill="#eef1f6">Durable Object RelayObject</text>
<text x="612" y="227" font-size="12" font-weight="500" fill="#a4adbd">SQLite: the relay between the</text>
<text x="612" y="243" font-size="12" font-weight="500" fill="#a4adbd">runner and the CFO's phone.</text>
<text x="612" y="259" font-size="12" font-weight="500" fill="#a4adbd">Checks the phone's passkey</text>
<text x="612" y="275" font-size="12" font-weight="500" fill="#a4adbd">(WebCrypto). It can refuse;</text>
<text x="612" y="291" font-size="12" font-weight="500" fill="#a4adbd">it never approves or pays.</text>
