<text x="938" y="409" font-size="12.5" font-weight="500" fill="#a4adbd">the RPC, and the explorer at</text>
<text x="938" y="426" font-size="12.5" font-weight="500" fill="#a4adbd">testnet.metalntwx.com</text>
