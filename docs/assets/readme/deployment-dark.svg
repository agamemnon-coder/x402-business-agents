<text x="334" y="437" font-size="12" font-weight="650" fill="#85b4ff">cloud/ · wrangler deploy -c cloud/wrangler.try.jsonc</text>
<text x="334" y="458" font-size="12.5" font-weight="500" fill="#a4adbd">Purser Cloud: console and API</text>
<text x="334" y="475" font-size="12.5" font-weight="500" fill="#a4adbd">/try's engine and its passkey check</text>
<text x="334" y="492" font-size="12.5" font-weight="500" fill="#a4adbd">/mcp (read, propose); hourly cron</text>
<text x="334" y="516" font-size="11.5" font-weight="600" fill="#3ccf82">secrets: SESSION_SECRET,</text>
<text x="334" y="532" font-size="11.5" font-weight="600" fill="#3ccf82">ADMIN_TOKEN_SHA256,</text>
<text x="334" y="548" font-size="11.5" font-weight="600" fill="#3ccf82">KIT11_ANTHROPIC_API_KEY</text>
