<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 338" width="960" height="338" role="img" aria-labelledby="t d">
<title id="t">Purser: one payment on /try, signed and paid; one cent changed, refused</title>
<desc id="d">Animated, one recorded walk through /try (21 Nov, test money): invoice BTX-2026-21 from Bergtex Textil GmbH, EUR 1,850.00, comes in; Claude (claude-haiku-5-5) reads “Total due EUR 1,850.00”; Purser's checks pass (not paid before, bank on file, known supplier) and flag the amount as over 2× the usual EUR 870.00; above the agent's EUR 500.00 limit the CFO signs the SHA-256 of the exact terms with a passkey; paid, the Airwallex sandbox transfer PAID (settlement simulated). Then the same approval with one cent changed (EUR 1,850.01): refused, nothing paid. Over all the /try walks of 19 to 21 Nov: 66 of 67 one-cent changes refused. Drawn from docs/runs/2026-11-21-phone-try/run-1.json and docs/evidence/evidence-wall.json by scripts/readme-demo-svg.ts.</desc>
