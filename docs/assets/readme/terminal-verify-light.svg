<text x="600" y="23" text-anchor="middle" style="font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:600;fill:#57606a">x402-business-agents: npm run verify-approval, then one cent changed</text>
<g class="s1"><text x="26" y="76"><tspan fill="#4382e8" font-weight="700">$</tspan></text><text x="41.6" y="76" textLength="202.8" lengthAdjust="spacingAndGlyphs">npm run -s verify-approval</text><g class="cv c0"><rect x="41.6" y="62" width="218.4" height="19" fill="#ffffff"/><rect class="caret" x="41.6" y="63" width="7.8" height="16" fill="#1f2328"/></g><text class="ln o1" x="26" y="95" textLength="397.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    format             purser.try-sign-receipt/v1</text><text class="ln o2" x="26" y="114" textLength="468" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    algorithm          ES256 (ECDSA on P-256 with SHA-256)</text><text class="ln o3" x="26" y="133" textLength="959.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    terms hash         SHA-256 of the canonical terms is b0f075d94da077084d7fc6745f99e2c2253548d967e9c0413bffa9748dbbf7bb</text><text class="ln o4" x="26" y="152" textLength="460.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    ceremony           a passkey assertion (webauthn.get)</text><text class="ln o5" x="26" y="171" textLength="616.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    challenge          the passkey signed a challenge equal to the terms hash</text><text class="ln o6" x="26" y="190" textLength="514.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    origin             made on https://kit11.max-31b.workers.dev</text><text class="ln o7" x="26" y="209" textLength="257.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    authenticator data 37 bytes</text><text class="ln o8" x="26" y="228" textLength="421.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    RP id              for kit11.max-31b.workers.dev</text><text class="ln o9" x="26" y="247" textLength="522.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    user present       the authenticator reports a person present</text><text class="ln o10" x="26" y="266" textLength="1068.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    user verified      the authenticator reports user verification (Face ID, a fingerprint or a PIN; which one is not in the signature)</text><text class="ln o11" x="26" y="285" textLength="647.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    signature          the ES256 signature verifies with the receipt's public key</text><text class="ln o13" x="26" y="323" textLength="413.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37" font-weight="700">VALID:</tspan> docs/runs/2026-11-07-awx-1/receipt-P-0002.json</text><text class="ln o14" x="26" y="342" textLength="1021.8" lengthAdjust="spacingAndGlyphs">Proves: the holder of this public key signed exactly these terms, with the authenticator reporting user verification, on this site.</text><text class="ln o15" x="26" y="361" textLength="670.8" lengthAdjust="spacingAndGlyphs">Does not prove: who holds the key, or that it was Face ID (no attestation is checked).</text><text class="ln o16" x="26" y="380" textLength="374.4" lengthAdjust="spacingAndGlyphs">Airwallex sandbox approval of 7 Nov, test money.</text></g>
<g class="s2"><text x="26" y="76"><tspan fill="#4382e8" font-weight="700">$</tspan></text><text x="41.6" y="76" textLength="850.2" lengthAdjust="spacingAndGlyphs">sed 's/"amount": "240.00"/"amount": "240.01"/' docs/runs/2026-11-07-awx-1/receipt-P-0002.json &gt; tampered.json</text><g class="cv c17"><rect x="41.6" y="62" width="865.8" height="19" fill="#ffffff"/><rect class="caret" x="41.6" y="63" width="7.8" height="16" fill="#1f2328"/></g><text x="26" y="95"><tspan fill="#4382e8" font-weight="700">$</tspan></text><text x="41.6" y="95" textLength="327.6" lengthAdjust="spacingAndGlyphs">npm run -s verify-receipt -- tampered.json</text><g class="cv c18"><rect x="41.6" y="81" width="343.2" height="19" fill="#ffffff"/><rect class="caret" x="41.6" y="82" width="7.8" height="16" fill="#1f2328"/></g><text class="ln o19" x="26" y="114" textLength="397.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    format             purser.try-sign-receipt/v1</text><text class="ln o20" x="26" y="133" textLength="468" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    algorithm          ES256 (ECDSA on P-256 with SHA-256)</text><text class="ln o21" x="26" y="152" textLength="1076.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#cf222e" font-weight="700">FAIL</tspan>  terms hash         the terms hash to c9b9404bdfbbf700dcf9962249e0b15529ec1ce775cc18f87cd1c931a09098db, not to the receipt's b0f075d9</text><text class="ln o22" x="26" y="171" textLength="624" lengthAdjust="spacingAndGlyphs">4da077084d7fc6745f99e2c2253548d967e9c0413bffa9748dbbf7bb: the terms were changed</text><text class="ln o23" x="26" y="190" textLength="460.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    ceremony           a passkey assertion (webauthn.get)</text><text class="ln o24" x="26" y="209" textLength="616.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    challenge          the passkey signed a challenge equal to the terms hash</text><text class="ln o25" x="26" y="228" textLength="514.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    origin             made on https://kit11.max-31b.workers.dev</text><text class="ln o26" x="26" y="247" textLength="257.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    authenticator data 37 bytes</text><text class="ln o27" x="26" y="266" textLength="421.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    RP id              for kit11.max-31b.workers.dev</text><text class="ln o28" x="26" y="285" textLength="522.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    user present       the authenticator reports a person present</text><text class="ln o29" x="26" y="304" textLength="1068.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    user verified      the authenticator reports user verification (Face ID, a fingerprint or a PIN; which one is not in the signature)</text><text class="ln o30" x="26" y="323" textLength="647.4" lengthAdjust="spacingAndGlyphs"><tspan fill="#1a7f37">ok</tspan>    signature          the ES256 signature verifies with the receipt's public key</text><text class="ln o32" x="26" y="361" textLength="288.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#cf222e" font-weight="700">NOT VALID:</tspan> tampered.json (terms hash)</text></g>
