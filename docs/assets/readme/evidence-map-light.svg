<svg class="em-wide" viewBox="-12 -12 1270 742" width="1270" height="742" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d"><title id="t">Purser: the money path and its evidence</title><desc id="d">Animated money path: Invoice in (24 of 25 /try walks passed); Claude reads (24 decisions · 0 fallbacks); Purser's rules (0 vs 35 wrong payments); Passkey signs (All 894 forgeries refused); Alta (#24 refused on chain); Airwallex (All 50 PAID · 71 endpoints live); Visa via Airi (EUR 45.00 after Face ID); Proof bundle (All 48 proofs VALID); Anyone verifies (189 checks passed). Refused: All 25 one-cent changes refused. Held: 24 of 25 held at the cash floor. Attacked and checked on purpose: Red team (All 128 attacks held); Chaos (0 invariants broken); Fuzzing (All 17 properties held); Held-out eval (11 vs 74 wrong payments); The public site (100 accessibility · Both WebKit walks passed). Test money.</desc><style>
svg.em-wide { --surface: #ffffff; --border: #d5d9e1; --text: #0b1220; --muted: #586174; --accent: #4f46e5; --accent-soft: #eef0ff; --ok: #0b7d43; --ok-soft: #e6f6ee; --bad: #c5363c; --held: #b45309; --awx: #ad4a0c; --awx-soft: #fdf0e7; --metal: #0b7a70; --metal-soft: #e3f5f2; --claude: #a84d2b; --claude-soft: #fbefe9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.em-line { fill: none; stroke: var(--border); stroke-width: 2; }
.em-br { fill: none; stroke-width: 2; stroke-dasharray: 5 4; }
.em-br.held { stroke: var(--held); } .em-br.bad { stroke: var(--bad); }
.em-n { --pc: var(--accent); --ps: var(--accent-soft); }
.em-n.awx { --pc: var(--awx); --ps: var(--awx-soft); } .em-n.metal { --pc: var(--metal); --ps: var(--metal-soft); }
.em-n.claude { --pc: var(--claude); --ps: var(--claude-soft); } .em-n.ok { --pc: var(--ok); --ps: var(--ok-soft); }
.em-box { fill: var(--surface); stroke: var(--border); stroke-width: 1.2; }
.em-t { fill: var(--text); font-size: 22px; font-weight: 740; }
.em-s { fill: var(--muted); font-size: 20px; }
.em-k { fill: var(--muted); font-size: 20px; font-weight: 700; letter-spacing: .02em; }
.em-bg { fill: var(--ps); }
.em-v { fill: var(--pc); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.em-p.held { --pc: var(--held); } .em-p.refused { --pc: var(--bad); }
.em-pb { fill: var(--surface); stroke: var(--pc); stroke-width: 1.5; stroke-dasharray: 5 4; }
/* The dots: a zero-length dash with a round cap, moved along the path by its offset. Hidden when still. */
.em-dot { fill: none; stroke-width: 14; stroke-linecap: round; stroke-dasharray: 0 1000; opacity: 0; pointer-events: none; }
.em-dot.ok { stroke: var(--ok); } .em-dot.bad { stroke: var(--bad); } .em-dot.hold { stroke: var(--held); }
.em-dot.halo { stroke: var(--surface); stroke-width: 22; }
@media (prefers-reduced-motion: no-preference) {
  .em-dot { animation: em-move 6s linear infinite; }
  .em-dot.bad { animation-delay: 2s; } .em-dot.hold { animation-delay: 4s; }
  svg.em-wide .em-h-invoice .em-box { animation: em-glow 6s linear -0.35s infinite; }
  svg.em-wide .em-h-claude .em-box { animation: em-glow 6s linear 0.47s infinite; }
  svg.em-wide .em-h-rules .em-box { animation: em-glow 6s linear 1.29s infinite; }
  svg.em-wide .em-h-passkey .em-box { animation: em-glow 6s linear 2.11s infinite; }
  svg.em-wide .em-h-bundle .em-box { animation: em-glow 6s linear 3.98s infinite; }
  svg.em-wide .em-h-verify .em-box { animation: em-glow 6s linear 4.80s infinite; }
  svg.em-wide .em-h-airwallex .em-box { animation: em-glow 6s linear 2.93s infinite; }
  svg.em-wide .em-h-c-redteam .em-box { animation: em-glow 6s linear 0.48s infinite; }
  svg.em-wide .em-h-c-chaos .em-box { animation: em-glow 6s linear 1.44s infinite; }
  svg.em-wide .em-h-c-fuzz .em-box { animation: em-glow 6s linear 2.40s infinite; }
  svg.em-wide .em-h-c-eval .em-box { animation: em-glow 6s linear 3.36s infinite; }
  svg.em-wide .em-h-c-site .em-box { animation: em-glow 6s linear 4.32s infinite; }
  svg.em-wide .em-h-held .em-pb { animation: em-glow-held 6s linear 8.80s infinite; }
  svg.em-wide .em-h-refused .em-pb { animation: em-glow-bad 6s linear 6.80s infinite; }
}
@media (prefers-reduced-motion: reduce) { .em-dot, .em-box, .em-pb { animation: none; } }
@keyframes em-move { 0% { stroke-dashoffset: 0; opacity: 0; } 3% { opacity: 1; } 80% { stroke-dashoffset: -100; opacity: 1; } 86%, 100% { stroke-dashoffset: -100; opacity: 0; } }
@keyframes em-glow { 0% { stroke: var(--pc); stroke-width: 3; } 12%, 100% { stroke: var(--border); stroke-width: 1.2; } }
@keyframes em-glow-held { 0% { stroke-width: 3.5; stroke-dasharray: none; } 15%, 100% { stroke-width: 1.5; stroke-dasharray: 5 4; } }
@keyframes em-glow-bad { 0% { stroke-width: 3.5; stroke-dasharray: none; } 15%, 100% { stroke-width: 1.5; stroke-dasharray: 5 4; } }
</style>
