<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 506" width="960" height="506" role="img" aria-labelledby="t d">
<title id="t">Purser for the finance team, at a glance</title>
<desc id="d">Six figures from Purser's records, test money in sandboxes. Wrong payments in the worst-case test: 0, against 35 for a payer with no rules, over 50 test cases. Claude's cost per invoice: about USD 0.05, a month of 20 test PDFs costing USD 1.02 in all. Month-end: 95 journal entries read back from T:0's sandbox ledger, 9 accounts, 0 differences. From the CFO's passkey (Face ID) to PAID: 6.3 s and 6.4 s in the Airwallex sandbox, settlement simulated. One cent changed after the CFO signs: refused on the signed hash. SWIFT fee in the Airwallex sandbox: EUR 13.42 on 3 November, EUR 13.50 twice on 7 November; known only after sending, so EUR 20.00 is reserved.</desc>
