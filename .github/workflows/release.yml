# Signed releases (19 November). For a version tag (v…), this builds the source tarball (git archive of the tag), the
# runtime bill of materials (CycloneDX, npm sbom as in ci.yml's security job) and SHA256SUMS, attests them with
# GitHub's artifact attestations (SLSA build provenance and an SBOM attestation, signed through Sigstore with this
# workflow's OIDC identity), and publishes all of it, with the attestation bundles as *.intoto.jsonl, on the tag's
# GitHub release. Then the SLSA project's generic generator (job slsa-provenance) adds SLSA Build Level 3 provenance for
# the tarball and the bill of materials, x402-business-agents-<tag>.slsa3.intoto.jsonl, to the same release; it was added
# after v1.2.0, so v1.2.0 has none. How anyone verifies a download: docs/security/README.md, "Verify a release".
#
# It never creates, moves or deletes a tag: it reads the tag that was pushed (or named), and `gh release create
# --verify-tag` refuses to make a release for a tag that does not exist. The submission tags (v1.0-submission and
# v1.1-submission) are kept as they were submitted, so a push of one of them never starts this workflow (filter and
# guard below); a release for an existing tag, those included, can be made deliberately with workflow_dispatch.
name: release
on:
  push:
    tags:
      - "v*"
      - "!v1.0-submission"
      - "!v1.1-submission"
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build and attest a release for (for example v1.2.0)"
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    # The same exclusion as the tag filter above, written out again: the submission tags are never released on push.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' && github.ref_name != 'v1.0-submission' && github.ref_name != 'v1.1-submission')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # create the release and upload its files
      id-token: write # sign the attestations (Sigstore, through this workflow's OIDC token)
      attestations: write # store the attestations on this repository
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    outputs:
      tag: ${{ env.TAG }}
      hashes: ${{ steps.sums.outputs.hashes }}
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Check the tag's name
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9A-Za-z._-]+$'; then echo "not a version tag: $TAG"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
      - name: Source tarball (git archive of the tag)
        run: |
          commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$commit"
          mkdir dist
          git archive --format=tar.gz --prefix="x402-business-agents-$TAG/" -o "dist/x402-business-agents-$TAG.tar.gz" "$commit"
          echo "TAG_COMMIT=$commit" >> "$GITHUB_ENV"
      # The same command as ci.yml's security job, on a clean npm ci of the tag's lockfile (no install scripts: the
      # bill of materials reads the installed packages' metadata, nothing is built or run).
      - name: Bill of materials (CycloneDX, runtime dependencies)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm sbom --sbom-format cyclonedx --omit dev > "dist/x402-business-agents-$TAG.sbom.cdx.json"
          node -e 'const d=require(process.argv[1]); if (d.bomFormat !== "CycloneDX" || !d.components.length) process.exit(1); console.log(d.components.length, "components")' "$PWD/dist/x402-business-agents-$TAG.sbom.cdx.json" | tee -a "$GITHUB_STEP_SUMMARY"
      # SHA256SUMS is sha256sum's output for the tarball and the bill of materials, so its base64 is exactly the subject
      # list the SLSA generator takes (base64-subjects, job slsa-provenance).
      - name: SHA256SUMS
        id: sums
        working-directory: dist
        run: |
          sha256sum "x402-business-agents-$TAG.tar.gz" "x402-business-agents-$TAG.sbom.cdx.json" > SHA256SUMS
          cat SHA256SUMS | tee -a "$GITHUB_STEP_SUMMARY"
          echo "hashes=$(base64 -w0 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      # actions/attest is GitHub's attestation action; attest-build-provenance (v4) and attest-sbom (v4, deprecated)
      # are wrappers around it, and their READMEs point new workflows here.
      - name: Attest build provenance (SLSA) for the tarball, the bill of materials and SHA256SUMS
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/x402-business-agents-${{ env.TAG }}.tar.gz
            dist/x402-business-agents-${{ env.TAG }}.sbom.cdx.json
            dist/SHA256SUMS
      - name: Attest the bill of materials for the tarball
        id: sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/x402-business-agents-${{ env.TAG }}.tar.gz
          sbom-path: dist/x402-business-agents-${{ env.TAG }}.sbom.cdx.json
      - name: Keep the attestation bundles with the release
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "dist/x402-business-agents-$TAG.provenance.intoto.jsonl"
          cp "$SBOM_BUNDLE" "dist/x402-business-agents-$TAG.sbom.intoto.jsonl"
          ls -l dist | tee -a "$GITHUB_STEP_SUMMARY"
      # Creates the tag's release, or replaces these files on it if it exists; never creates or moves the tag.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # With immutable releases on, a published release can take no more files, so the release is made as a draft
          # here and published by the last job, after the SLSA provenance is on it (v1.3.0 and v1.3.1 lost files to
          # this on 20 Nov). A release published by hand first cannot be completed: say so instead of failing later.
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $TAG is already published and may be immutable; push a tag without publishing it by hand (docs/releasing.md)."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            # The release notes are docs/releases/<tag>.md when the release pull request wrote them (docs/releasing.md).
            if [ -f "docs/releases/$TAG.md" ]; then notes=(--notes-file "docs/releases/$TAG.md"); else notes=(--generate-notes); fi
            gh release create "$TAG" dist/* --draft --verify-tag --title "Purser $TAG" "${notes[@]}"
          fi
          {
            echo "Release $TAG (commit $TAG_COMMIT). Verify a download:"
            echo "  gh attestation verify x402-business-agents-$TAG.tar.gz -R $GITHUB_REPOSITORY"
            echo "  sha256sum -c SHA256SUMS"
            echo "  slsa-verifier verify-artifact x402-business-agents-$TAG.tar.gz --provenance-path x402-business-agents-$TAG.slsa3.intoto.jsonl --source-uri github.com/$GITHUB_REPOSITORY --source-tag $TAG"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # SLSA Build Level 3 provenance from the SLSA project's generic generator, a reusable workflow that runs in its own
  # jobs, isolated from the build above: it signs (Sigstore, its own OIDC identity) provenance for the release job's
  # tarball and bill of materials and keeps it as a workflow artifact for the publish job below. It
  # needs no checkout and no steps of ours, so there is nothing here for Harden-Runner to wrap.
  #
  # The one `uses:` in .github/workflows/ that is not pinned to a full commit SHA, on purpose (the owner's decision,
  # 19 November 2026). The generator's README ("Referencing the SLSA generator") says it MUST be referenced by a tag of
  # the form @vX.Y.Z: the build fails with a shorter tag or a commit SHA, because the builder is identified by its
  # release tag, which slsa-verifier checks. v2.1.0 is the latest release (24 February 2025; tag commit f7dd8c5).
  # test/security-page.test.ts allows exactly this path by tag; every other action stays pinned by SHA.
  slsa-provenance:
    needs: release
    permissions:
      actions: read # the generator reads this workflow run to detect the GitHub Actions environment
      id-token: write # it signs the provenance through its own OIDC identity (Sigstore)
      contents: write # the generator's upload job asks for it when the workflow starts (a run without it fails to start, v1.3.2 on 20 Nov); with upload-assets false it uploads nothing, and the publish job attaches the provenance
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: false
      provenance-name: x402-business-agents-${{ needs.release.outputs.tag }}.slsa3.intoto.jsonl

  # Attaches the SLSA provenance to the draft release and only then publishes it, so the immutable release holds every
  # file from the start.
  publish:
    needs: [release, slsa-provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # it uploads the provenance and publishes the draft release
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Download the SLSA provenance
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.slsa-provenance.outputs.provenance-name }}
          path: provenance
      - name: Attach it and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          gh release upload "$TAG" provenance/* --clobber
          gh release edit "$TAG" --draft=false --latest
