# OpenSSF Scorecard (19 November): scores this repository's supply-chain practices (pinned dependencies, token
# permissions, branch protection, code review, dangerous workflow patterns, …), publishes the result to
# api.scorecard.dev (signed with this workflow's OIDC token) and uploads the findings to GitHub code scanning.
# Based on ossf/scorecard-action's examples/scorecard.yml from main, which pins the same three SHAs as below (read
# 19 November 2026). Separate from ci.yml: it changes nothing in the checks that run there.
name: scorecard
on:
  push:
    branches: [main]
  # Weekly, so the Maintained and Vulnerabilities checks stay current between pushes.
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:
# No token permissions at the top: the one job below asks for what it needs.
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# No cache reads or writes (the key GitHub Actions added in September 2026; Scorecard's example sets it too).
cache-mode: none
jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Scorecard only supports the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the results published to api.scorecard.dev
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing needs this job to follow Scorecard's workflow restrictions (no run steps, no env, only the four
          # actions here, a GitHub-hosted Ubuntu runner); a refusal is a warning on the run, not a failure.
          publish_results: true
      - name: Keep the SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
