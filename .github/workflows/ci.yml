# Runs on every push and pull request: type checks, the full test suite (including the adversarial suite in
# test/adversarial.test.ts), the relay Worker's type check, npm audit (root and worker/), a juror's first run
# (npm run judge on a fresh clone, then the guest pages in Chromium, /try/sign in WebKit, and both in Firefox), the SBOM and Semgrep (blocking), and gitleaks on the pushed commits and on the whole history of the commit under check (accepted false positives are listed by fingerprint in .gitleaksignore).
# No secrets and no network beyond npm and GitHub: the tests use fakes for Metal, Airwallex and Claude.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The ISO 20022 export is validated against the official XSD with xmllint (test/iso20022.test.ts).
      - name: xmllint
        run: command -v xmllint || (sudo apt-get update && sudo apt-get install -y libxml2-utils)
      # The hosted-page checkout test (test/airi-hosted-checkout.test.ts) drives headless Chromium against a local stub
      # page; the same lockfile-keyed cache as the judge job below.
      - name: Playwright browsers (cache)
        id: pw-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Playwright browsers (download on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Tests with coverage, per area
        run: npm run test:coverage
      # The engine's own tests again, with every ledger handle swapped for the Durable Object handle over a stand-in for
      # a Durable Object's storage (vitest.shim.config.ts): plain Node, no browser, no wrangler.
      - name: Engine tests through the Durable Object handle
        run: npm run test:shim
      # Jury panel, 12 Nov: a script in Claude's place makes the worst tool call it can on every turn; no network, no key.
      - name: Hostile-model eval of the payables agents (the line /claude shows)
        run: npm run -s ap-hostile-eval
      - run: npm run relay:pages
      - name: Relay Worker type check
        working-directory: worker
        run: npm ci && npx tsc --noEmit && npm audit --audit-level=low
      # The cloud's tests again, on local D1 (workerd's D1, through the wrangler pinned in worker/) instead of
      # better-sqlite3: the concurrency guards rely on D1's batch semantics (test/support/d1.ts).
      - name: Cloud tests on local D1
        run: npm run test:d1
      - run: npm audit --audit-level=low
  # A juror's first run: a fresh clone, no keys, no network beyond npm. `npm run judge` must serve the recorded demo
  # and the month, and the guest pages must render cleanly in Chromium at phone and laptop width, light and dark.
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: npm run judge (no keys, no ledger)
        run: npm run judge -- --check
      # Chromium comes from a cache keyed on the lockfile (Playwright's version is pinned there). The browser checks below
      # are never skipped.
      - name: Playwright browsers (cache)
        id: pw-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Playwright browsers (download on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      # No apt step for Chromium: the ubuntu-24.04 runner already has every library Chromium needs; install-deps only
      # added nine font packages (CJK, unifont; 21 MB) that no check uses, from a mirror that was slow several times on
      # 6 November. WebKit runs in its own job (webkit, below), and every browser check still runs.
      - name: Guest pages in Chromium (/, /demo, /month at 390 and 1440 px)
        run: npx tsx test/browser/pages.check.ts test-results/pages
      - name: Agent trace in Chromium (390 and 1440 px, light and dark)
        run: npx tsx test/browser/trace.check.ts test-results/trace
      - name: /try/sign in Chromium (360, 390 and 1440 px, light and dark; layout after signing and after the tamper)
        run: npx tsx test/browser/trysign.check.ts test-results/trysign
      - name: Purser Cloud's console in Chromium (first run and sign-in with a virtual passkey, every page at 1440 and 390 px)
        run: npx tsx test/browser/console.check.ts test-results/console
  # Safari's engine, in Playwright's own image (browsers and system libraries preinstalled, version = our lockfile's
  # playwright 1.63.0, pinned by digest, read 6 November 2026): no apt step, so no slow mirror. Playwright's Linux WebKit
  # has no WebAuthn at all (no PublicKeyCredential, no virtual authenticator), so nothing is faked: the check sees the
  # page's "no passkeys" answer and its layout. The passkey and the signature are the Chromium step in judge.
  # npm ci runs on the runner (better-sqlite3 builds there; the image has no compiler); only the check runs in the image,
  # with the same checkout and node_modules mounted (both Ubuntu 24.04 and Node 22).
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: /try/sign in WebKit (390 px light, 1440 px dark; up to the passkey step where WebKit has WebAuthn)
        run: >
          docker run --rm --ipc=host -v "$PWD:/repo" -w /repo
          mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          npx tsx test/browser/trysign-webkit.check.ts test-results/trysign-webkit
  # Firefox (master list 408): the guest pages and /try/sign, the same checks as Chromium's in judge, with BROWSER=firefox
  # (test/browser/support/browser.ts). Firefox has no virtual authenticator, so /try/sign signs with the software passkey
  # (test/browser/support/softPasskey.ts) and the server verifies every signature for real. Only Firefox is installed
  # here, with its system libraries. About 9 minutes on a laptop on 12 November.
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Playwright Firefox, with its system libraries
        timeout-minutes: 10
        run: npx playwright install --with-deps firefox
      - name: Guest pages in Firefox (360, 390, 768 and 1440 px, light and dark)
        run: BROWSER=firefox npx tsx test/browser/pages.check.ts test-results/pages-firefox
      - name: /try/sign in Firefox (360, 390 and 1440 px, light and dark; signed with the software passkey)
        run: BROWSER=firefox npx tsx test/browser/trysign.check.ts test-results/trysign-firefox
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The gitleaks action lists a pull request's commits to scan them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The action scans the pushed commits; this scans the whole history of the commit under check on every run: for a
      # push, everything the pushed commit descends from; for a pull request, the merge of the branch with its base, so
      # main's whole history is in every such scan. Since 12 November it reads that history only (--log-opts=HEAD) and no
      # longer every branch on the remote (the owner's change, commit 0cf01d4): one test fixture on one branch failed
      # this job on every other pull request. Each branch is still scanned by its own runs, and no commit reaches main
      # unscanned. The image is pinned by digest (the v8.24.3 index on ghcr.io, read 6 November 2026), as the actions
      # are by commit SHA.
      - name: gitleaks, whole history of this commit
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --redact --verbose --no-banner --gitleaks-ignore-path /repo/.gitleaksignore --log-opts=HEAD
  # Static analysis (Semgrep, pinned) and the SBOM (Max, 2 November). Semgrep blocks on any finding or if no rules loaded
  # (it started non-blocking; its first run found 0 in 110 rules). The rules are Semgrep's public (TypeScript, Node.js, secrets, OWASP Top Ten)
  # TypeScript, Node.js and secrets sets; no code or results leave the runner (metrics off).
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: SBOM (CycloneDX, runtime dependencies)
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
          node -e 'const d=require("./sbom.cdx.json"); if (d.bomFormat !== "CycloneDX" || !d.components.length) process.exit(1); console.log(d.components.length, "components")' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Semgrep (blocking; public sets plus .semgrep/purser.yml)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          python3 -m venv /tmp/sg && /tmp/sg/bin/pip install --quiet semgrep==1.180.0
          /tmp/sg/bin/semgrep scan --metrics=off --config p/typescript --config p/nodejs --config p/secrets --config p/owasp-top-ten --config .semgrep/purser.yml --time --json --output semgrep.json src worker/src
          node -e 'const d=require("./semgrep.json"); const rules=d.time?.rules?.length ?? 0; console.log(`Semgrep: ${d.results.length} findings, ${rules} rules, ${d.paths.scanned.length} files`); for (const r of d.results) console.log(`${r.extra.severity} ${r.check_id.split(".").pop()} ${r.path}:${r.start.line}`); if (!rules || d.results.length) process.exit(1)' | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
