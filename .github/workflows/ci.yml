# Runs on pushes to main and on every pull request: type checks, the full test suite (including the adversarial suite in
# test/adversarial.test.ts), the relay Worker's type check, npm audit (root and worker/), a juror's first run
# (npm run judge on a fresh clone, then the guest pages in Chromium, /try/sign in WebKit, and both in Firefox), the SBOM and Semgrep (blocking), and gitleaks on the pushed commits and on the whole history of the commit under check (accepted false positives are listed by fingerprint in .gitleaksignore).
# No secrets and no network beyond npm and GitHub: the tests use fakes for Metal, Airwallex and Claude.
name: ci
on:
  # Pushes to main and every pull request; a pushed PR branch runs once (as the pull request), not twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Every job starts with StepSecurity Harden-Runner (pinned by SHA) in audit mode: it records each outbound connection
# of the runner and blocks none, so CI behaves as before. Blocking (egress-policy: block) needs an allowlist built from
# these audit logs first.
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The ISO 20022 export is validated against the official XSD with xmllint (test/iso20022.test.ts).
      - name: xmllint
        # Retries and a timeout: a slow apt mirror (19 Nov: exit 100 after 3 min) should not turn CI red.
        run: command -v xmllint || (sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y libxml2-utils)
      # The hosted-page checkout test (test/airi-hosted-checkout.test.ts) drives headless Chromium against a local stub
      # page; the same lockfile-keyed cache as the judge job below.
      - name: Playwright browsers (cache)
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Playwright browsers (download on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: Tests with coverage, per area
        run: npm run test:coverage
      # The engine's own tests again, with every ledger handle swapped for the Durable Object handle over a stand-in for
      # a Durable Object's storage (vitest.shim.config.ts): plain Node, no browser, no wrangler.
      - name: Engine tests through the Durable Object handle
        run: npm run test:shim
      # Jury panel, 12 Nov: a script in Claude's place makes the worst tool call it can on every turn; no network, no key.
      - name: Hostile-model eval of the payables agents (the line /claude shows)
        run: npm run -s ap-hostile-eval
      - run: npm run relay:pages
      - name: Relay Worker type check
        working-directory: worker
        run: npm ci && npx tsc --noEmit && npm audit --audit-level=low
      # The cloud's tests again, on local D1 (workerd's D1, through the wrangler pinned in worker/) instead of
      # better-sqlite3: the concurrency guards rely on D1's batch semantics (test/support/d1.ts).
      - name: Cloud tests on local D1
        run: npm run test:d1
      # Root audit: any advisory fails unless listed in .audit-allow.json (development tools only, no patch, with expiry).
      - run: npx tsx scripts/audit-check.ts
  # A juror's first run: a fresh clone, no keys, no network beyond npm. `npm run judge` must serve the recorded demo
  # and the month, and the guest pages must render cleanly in Chromium at phone and laptop width, light and dark.
  judge:
    runs-on: ubuntu-24.04
    # The pages, console and connector checks together take ~15 min when runners are busy.
    timeout-minutes: 30
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: npm run judge (no keys, no ledger)
        run: npm run judge -- --check
      # Chromium comes from a cache keyed on the lockfile (Playwright's version is pinned there). The browser checks below
      # are never skipped.
      - name: Playwright browsers (cache)
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium
      - name: Playwright browsers (download on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium
      # No apt step for Chromium: the ubuntu-24.04 runner already has every library Chromium needs; install-deps only
      # added nine font packages (CJK, unifont; 21 MB) that no check uses, from a mirror that was slow several times on
      # 6 November. WebKit runs in its own job (webkit, below), and every browser check still runs.
      - name: Guest pages in Chromium (/, /demo, /month at 390 and 1440 px)
        run: npx tsx test/browser/pages.check.ts test-results/pages
      - name: Agent trace in Chromium (390 and 1440 px, light and dark)
        run: npx tsx test/browser/trace.check.ts test-results/trace
      - name: /try/sign in Chromium (360, 390 and 1440 px, light and dark; layout after signing and after the tamper)
        run: npx tsx test/browser/trysign.check.ts test-results/trysign
      - name: The CFO's phone pages in Chromium (enrol, approve in every state, policy; 390 and 1440 px, light and dark)
        run: npx tsx test/browser/approve-design.check.ts test-results/approve-design
      - name: Purser Cloud's console in Chromium (first run and sign-in with a virtual passkey, every page at 1440 and 390 px)
        run: npx tsx test/browser/console.check.ts test-results/console
      - name: Live with Airwallex in Chromium (/proof's badge and events, Home's badge, the Cloud tab's events card; 1440 and 390 px)
        run: npx tsx test/browser/awx-proof.check.ts test-results/awx-proof && npx tsx test/browser/awx-live.check.ts test-results/awx-live
      - name: /try when the passkey fails (no WebAuthn, refused, cancelled, a silent prompt) in Chromium at phone size
        run: npx tsx test/browser/try-passkey.check.ts test-results/try-passkey
      - name: /try after Back, Forward and a reload (the agent's background payment, Send to CFO again) in Chromium
        run: npx tsx test/browser/try-nav.check.ts test-results/try-nav
      - name: /try's Live engine rail beside the steps at 1280 px (also ?present=1&phone=0) and a drawer on a phone, in Chromium
        run: npx tsx test/browser/try-rail.check.ts test-results/try-rail
      - name: npm run judge's hands-on /try, offline, in Chromium (EUR 120 by the agent, EUR 1,850 with a virtual passkey, one cent refused, the proof downloaded and VALID)
        run: npx tsx test/browser/judge-try.check.ts test-results/judge-try
      - name: Connect Claude end to end (registration, a cross-site redirect into the consent page, PKCE, MCP with the token; the MCP SDK's own client)
        run: npx tsx test/browser/connector.check.ts test-results/connector
      - name: /visa's live credential check and /t0's close check in Chromium (390 and 1440 px)
        run: npx tsx test/browser/partner-live.check.ts test-results/partner-live
  # Safari's engine, in Playwright's own image (browsers and system libraries preinstalled, version = our lockfile's
  # playwright 1.63.0, pinned by digest, read 6 November 2026): no apt step, so no slow mirror. Playwright's Linux WebKit
  # has no WebAuthn at all (no PublicKeyCredential, no virtual authenticator), so nothing is faked: the check sees the
  # page's "no passkeys" answer and its layout. The passkey and the signature are the Chromium step in judge.
  # npm ci runs on the runner (better-sqlite3 builds there; the image has no compiler); only the check runs in the image,
  # with the same checkout and node_modules mounted (both Ubuntu 24.04 and Node 22).
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: /try/sign in WebKit (390 px light, 1440 px dark; up to the passkey step where WebKit has WebAuthn)
        run: >
          docker run --rm --ipc=host -v "$PWD:/repo" -w /repo
          mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          npx tsx test/browser/trysign-webkit.check.ts test-results/trysign-webkit
  # Firefox (master list 408): the guest pages and /try/sign, the same checks as Chromium's in judge, with BROWSER=firefox
  # (test/browser/support/browser.ts). Firefox has no virtual authenticator, so /try/sign signs with the software passkey
  # (test/browser/support/softPasskey.ts) and the server verifies every signature for real. Firefox runs in the
  # same pinned Playwright image as WebKit, so no system libraries come from an apt mirror (a slow mirror timed the
  # install out on main on 18 November, before any check ran). About 9 minutes on a laptop on 12 November.
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Guest pages in Firefox (360, 390, 768 and 1440 px, light and dark)
        run: >
          docker run --rm --ipc=host -e BROWSER=firefox -v "$PWD:/repo" -w /repo
          mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          npx tsx test/browser/pages.check.ts test-results/pages-firefox
      - name: /try/sign in Firefox (360, 390 and 1440 px, light and dark; signed with the software passkey)
        run: >
          docker run --rm --ipc=host -e BROWSER=firefox -v "$PWD:/repo" -w /repo
          mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
          npx tsx test/browser/trysign.check.ts test-results/trysign-firefox
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The gitleaks action lists a pull request's commits to scan them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The action scans the pushed commits; this scans the whole history of the commit under check on every run: for a
      # push, everything the pushed commit descends from; for a pull request, the merge of the branch with its base, so
      # main's whole history is in every such scan. Since 12 November it reads that history only (--log-opts=HEAD) and no
      # longer every branch on the remote (the owner's change, commit 0cf01d4): one test fixture on one branch failed
      # this job on every other pull request. Each branch is still scanned by its own runs, and no commit reaches main
      # unscanned. The image is pinned by digest (the v8.24.3 index on ghcr.io, read 6 November 2026), as the actions
      # are by commit SHA.
      - name: gitleaks, whole history of this commit
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --redact --verbose --no-banner --gitleaks-ignore-path /repo/.gitleaksignore --log-opts=HEAD
  # Formal model (19 November): TLC model-checks formal/PurserPayment.tla, a model of the invoice payment state machine,
  # for the bound in formal/PurserPayment.cfg (no invariant or property may break), and must catch each planted bug in
  # formal/Bug_*.cfg. tla2tools.jar is the official tlaplus release, pinned by version and SHA-256 in scripts/formal.sh,
  # cached on that checksum, never committed. About 4 minutes. Record: docs/evidence/formal-model.md.
  formal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: The jar's pinned checksum
        id: pin
        run: echo "sha=$(sed -n 's/^TLA_SHA256="\([0-9a-f]*\)"$/\1/p' scripts/formal.sh)" >> "$GITHUB_OUTPUT"
      - name: tla2tools.jar (cache, keyed on its checksum)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/purser-tla
          key: tla2tools-${{ steps.pin.outputs.sha }}
      - name: TLC on the bound and on the planted bugs
        run: bash scripts/formal.sh
  # Formal proofs (19 November): Dafny verifies formal/dafny/*.dfy, machine-checked lemmas about the code that guards
  # money (the canonical terms encoding is injective, amount parsing is exact, the pay-alone limit and the agent cap
  # compare integer cents), with no assume or axiom; and the committed JavaScript translation of the verified functions
  # (formal/dafny/out/reference.js) must be exactly what Dafny produces from them, because the test job's differential
  # test (test/formal-dafny-differential.test.ts) runs it against the TypeScript; and the committed record and badge
  # (docs/evidence/formal-proofs.json, docs/badges/dafny.json) must state the verifier's own line. Dafny is the official dafny-lang
  # release (with its own .NET runtime and Z3), pinned by version and SHA-256 in scripts/formal-dafny.sh, the zip cached
  # on that checksum and checked again on every run, never committed. About a minute. Record: docs/evidence/formal-proofs.md.
  formal-dafny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dafny's pinned checksum
        id: pin
        run: echo "sha=$(sed -n 's/^DAFNY_SHA256="\([0-9a-f]*\)"$/\1/p' scripts/formal-dafny.sh)" >> "$GITHUB_OUTPUT"
      - name: Dafny zip (cache, keyed on its checksum)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/purser-dafny
          key: dafny-${{ steps.pin.outputs.sha }}
      - name: Dafny verifies the proofs; the committed translation, record and badge are theirs
        run: bash scripts/formal-dafny.sh
  # REUSE (19 November): every file has a licence and copyright on record (REUSE.toml, LICENSES/), checked with the
  # FSFE's reuse tool (REUSE specification 3.3). The action is pinned by commit, but it builds from the image
  # fsfe/reuse:6, a moving tag the action names; a local run with reuse 6.3.0 (pip) was clean on 19 November.
  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: reuse lint
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
  # Static analysis (Semgrep 1.180.0 and every package it imports, pinned by hash in .semgrep/requirements.txt since
  # 19 November, wheels only) and the SBOM (Max, 2 November). Semgrep blocks on any finding or if no rules loaded
  # (it started non-blocking; its first run found 0 in 110 rules). The rules are Semgrep's public (TypeScript, Node.js, secrets, OWASP Top Ten)
  # TypeScript, Node.js and secrets sets; no code or results leave the runner (metrics off).
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: SBOM (CycloneDX, runtime dependencies)
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
          node -e 'const d=require("./sbom.cdx.json"); if (d.bomFormat !== "CycloneDX" || !d.components.length) process.exit(1); console.log(d.components.length, "components")' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Semgrep (blocking; public sets plus .semgrep/purser.yml)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          python3 -m venv /tmp/sg && /tmp/sg/bin/pip install --quiet --no-deps --require-hashes --only-binary :all: -r .semgrep/requirements.txt
          /tmp/sg/bin/semgrep scan --metrics=off --config p/typescript --config p/nodejs --config p/secrets --config p/owasp-top-ten --config .semgrep/purser.yml --time --json --output semgrep.json src worker/src
          node -e 'const d=require("./semgrep.json"); const rules=d.time?.rules?.length ?? 0; console.log(`Semgrep: ${d.results.length} findings, ${rules} rules, ${d.paths.scanned.length} files`); for (const r of d.results) console.log(`${r.extra.severity} ${r.check_id.split(".").pop()} ${r.path}:${r.start.line}`); if (!rules || d.results.length) process.exit(1)' | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
