# Runs on every push and pull request: type checks, the full test suite (including the adversarial suite in
# test/adversarial.test.ts), the relay Worker's type check, a secret scan of the whole history, and npm audit.
# No secrets and no network beyond npm and GitHub: the tests use fakes for Metal, Airwallex and Claude.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Relay Worker type check
        working-directory: worker
        run: npm ci && npx tsc --noEmit
      # Known and accepted until the fixed x402 release is old enough to pin: a high zod advisory nested in
      # @x402/* and @metalntwx/* (docs/security.md). Anything critical fails the build.
      - run: npm audit --omit=dev --audit-level=critical
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
