# Runs on every push and pull request: type checks, the full test suite (including the adversarial suite in
# test/adversarial.test.ts), the relay Worker's type check, npm audit (root and worker/), a juror's first run
# (npm run judge on a fresh clone, then the guest pages in Chromium, and /try/sign in WebKit), the SBOM and Semgrep (blocking), and gitleaks on the pushed commits and on the whole history (accepted false positives are listed by fingerprint in .gitleaksignore).
# No secrets and no network beyond npm and GitHub: the tests use fakes for Metal, Airwallex and Claude.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # The ISO 20022 export is validated against the official XSD with xmllint (test/iso20022.test.ts).
      - name: xmllint
        run: command -v xmllint || (sudo apt-get update && sudo apt-get install -y libxml2-utils)
      - name: Tests with coverage, per area
        run: npm run test:coverage
      - run: npm run relay:pages
      - name: Relay Worker type check
        working-directory: worker
        run: npm ci && npx tsc --noEmit && npm audit --audit-level=low
      - run: npm audit --audit-level=low
  # A juror's first run: a fresh clone, no keys, no network beyond npm. `npm run judge` must serve the recorded demo
  # and the month, and the guest pages must render cleanly in Chromium at phone and laptop width, light and dark.
  judge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: npm run judge (no keys, no ledger)
        run: npm run judge -- --check
      # The browsers come from a cache keyed on the lockfile (Playwright's version is pinned there); the system libraries
      # they need come from apt, whose mirror was once slow enough (a few kB/s) to run the job into its 15-minute limit.
      # So each install step has its own time limit and one retry, and fails the job if it still cannot install: the
      # browser checks below are never skipped. apt runs as root under sudo, out of timeout's reach: before the retry
      # its leftover process is stopped, or it keeps dpkg's lock and the retry fails at once.
      - name: Playwright browsers (cache)
        id: pw-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-chromium-webkit
      - name: Playwright browsers (download on a cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium webkit
      - name: System libraries for Chromium (apt; own time limit, one retry)
        timeout-minutes: 7
        run: timeout 200 npx playwright install-deps chromium || { sudo pkill -x apt-get || true; sleep 3; sudo dpkg --configure -a; timeout 200 npx playwright install-deps chromium; }
      - name: Guest pages in Chromium (/, /demo, /month at 390 and 1440 px)
        run: npx tsx test/browser/pages.check.ts test-results/pages
      - name: Agent trace in Chromium (390 and 1440 px, light and dark)
        run: npx tsx test/browser/trace.check.ts test-results/trace
      - name: /try/sign in Chromium (360, 390 and 1440 px, light and dark; layout after signing and after the tamper)
        run: npx tsx test/browser/trysign.check.ts test-results/trysign
      # Safari's engine. Playwright's Linux WebKit has no WebAuthn at all (no PublicKeyCredential, no virtual
      # authenticator), so nothing is faked: the check sees the page's "no passkeys" answer and its layout; on a WebKit
      # with WebAuthn it would go up to the passkey step. The passkey and the signature are the Chromium step above.
      - name: System libraries for WebKit (apt; own time limit, one retry)
        timeout-minutes: 7
        run: timeout 200 npx playwright install-deps webkit || { sudo pkill -x apt-get || true; sleep 3; sudo dpkg --configure -a; timeout 200 npx playwright install-deps webkit; }
      - name: /try/sign in WebKit (390 px light, 1440 px dark; up to the passkey step where WebKit has WebAuthn)
        run: npx tsx test/browser/trysign-webkit.check.ts test-results/trysign-webkit
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The gitleaks action lists a pull request's commits to scan them.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The action scans the pushed commits; this scans the whole history on every run. The image is pinned by digest
      # (the v8.24.3 index on ghcr.io, read 6 November 2026), as the actions are by commit SHA.
      - name: gitleaks, whole history
        run: >
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo --redact --verbose --no-banner --gitleaks-ignore-path /repo/.gitleaksignore
  # Static analysis (Semgrep, pinned) and the SBOM (Max, 2 November). Semgrep blocks on any finding or if no rules loaded
  # (it started non-blocking; its first run found 0 in 110 rules). The rules are Semgrep's public (TypeScript, Node.js, secrets, OWASP Top Ten)
  # TypeScript, Node.js and secrets sets; no code or results leave the runner (metrics off).
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: SBOM (CycloneDX, runtime dependencies)
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
          node -e 'const d=require("./sbom.cdx.json"); if (d.bomFormat !== "CycloneDX" || !d.components.length) process.exit(1); console.log(d.components.length, "components")' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Semgrep (blocking; public sets plus .semgrep/purser.yml)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          python3 -m venv /tmp/sg && /tmp/sg/bin/pip install --quiet semgrep==1.180.0
          /tmp/sg/bin/semgrep scan --metrics=off --config p/typescript --config p/nodejs --config p/secrets --config p/owasp-top-ten --config .semgrep/purser.yml --time --json --output semgrep.json src worker/src
          node -e 'const d=require("./semgrep.json"); const rules=d.time?.rules?.length ?? 0; console.log(`Semgrep: ${d.results.length} findings, ${rules} rules, ${d.paths.scanned.length} files`); for (const r of d.results) console.log(`${r.extra.severity} ${r.check_id.split(".").pop()} ${r.path}:${r.start.line}`); if (!rules || d.results.length) process.exit(1)' | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
