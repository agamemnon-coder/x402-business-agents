# Dependency review (19 November): on every pull request, GitHub's dependency-review-action compares the dependency
# graph of the base and the head and fails the check when the pull request adds a dependency version with a known
# vulnerability of high or critical severity (GitHub Advisory Database). Moderate and low ones are listed in the job
# summary, not blocking: the daily OSV-Scanner run (osv-scanner.yml) and npm audit in ci.yml cover what is already in
# the lockfiles. Only runtime dependencies block (the action's default scope); development-only ones are listed.
# Read-only: no pull request comment (that would need pull-requests: write), no licence policy here (REUSE.toml and
# LICENSES/ cover ours). The action is pinned by commit (v5.0.1, read 19 November 2026 with git ls-remote).
name: dependency-review
on:
  pull_request:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # read the dependency graph of the base and head commits
    steps:
      - name: Harden the runner (audit outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review the dependencies this pull request changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
