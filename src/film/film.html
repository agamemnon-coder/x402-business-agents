<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purser: the film</title>
<style>
@font-face { font-family: Inter; src: url("assets/inter.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root { --bg: #07080d; --panel: #11141d; --panel2: #171b27; --line: #252a3a; --text: #f3f4f8; --muted: #9aa2b6; --accent: #7c6cff; --accent2: #a99fff; --ok: #34d17e; --bad: #ff5d52; --wait: #f5a524; --metal: #38bdf8; --awx: #ff5b2e; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: Inter, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: radial-gradient(1200px 700px at 70% 20%, #1a1640 0%, rgba(7,8,13,0) 60%), radial-gradient(900px 600px at 10% 90%, #0b2a33 0%, rgba(7,8,13,0) 60%), var(--bg); overflow: hidden; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; }
.layer { position: absolute; inset: 0; opacity: 0; will-change: opacity, transform; }
.a { position: absolute; will-change: opacity, transform; }
.kicker { font-size: 26px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent2); }
.h1 { font-size: 92px; font-weight: 800; letter-spacing: -.035em; line-height: 1.02; }
.h2 { font-size: 64px; font-weight: 800; letter-spacing: -.03em; line-height: 1.05; }
.h3 { font-size: 38px; font-weight: 700; letter-spacing: -.02em; }
.muted { color: var(--muted); }
.ok { color: var(--ok); } .bad { color: var(--bad); } .wait { color: var(--wait); }
.card { width: 520px; height: 320px; border-radius: 28px; padding: 34px 38px; color: #fff; background: linear-gradient(135deg, #2a2f45 0%, #11131c 100%); box-shadow: 0 40px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08); }
.card.v { background: linear-gradient(135deg, #7c6cff 0%, #3b2fb8 100%); }
.card .t { font-size: 22px; font-weight: 600; opacity: .85; display: flex; justify-content: space-between; }
.card .n { font-size: 38px; font-weight: 700; margin-top: 70px; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.card .b { display: flex; justify-content: space-between; align-items: end; margin-top: 18px; font-size: 22px; opacity: .9; }
.card .visa { font-weight: 900; font-style: italic; font-size: 34px; letter-spacing: -.02em; }
.mini { width: 300px; height: 186px; border-radius: 18px; padding: 20px 22px; background: linear-gradient(135deg, #2a2f45 0%, #11131c 100%); box-shadow: 0 20px 50px rgba(0,0,0,.45); }
.mini .t { font-size: 17px; font-weight: 600; opacity: .8; }
.mini .n { font-size: 22px; font-weight: 700; margin-top: 44px; font-variant-numeric: tabular-nums; }
.mini .l { font-size: 18px; margin-top: 8px; color: var(--accent2); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 999px; font-size: 26px; font-weight: 700; background: var(--panel2); border: 1px solid var(--line); white-space: nowrap; }
.pill.ok { background: rgba(52,209,126,.14); border-color: rgba(52,209,126,.45); }
.pill.bad { background: rgba(255,93,82,.14); border-color: rgba(255,93,82,.5); }
.pill.ai { background: rgba(124,108,255,.16); border-color: rgba(124,108,255,.5); color: var(--accent2); font-size: 22px; padding: 9px 18px; }
.toast { width: 640px; padding: 24px 28px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); display: flex; align-items: center; gap: 20px; font-size: 28px; box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.toast .ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 900; flex: none; }
.toast.ok .ic { background: rgba(52,209,126,.18); color: var(--ok); } .toast.bad .ic { background: rgba(255,93,82,.18); color: var(--bad); }
.toast .amt { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
.toast small { display: block; font-size: 20px; color: var(--muted); margin-top: 4px; }
.phone { width: 400px; height: 820px; border-radius: 60px; background: #050608; border: 10px solid #1f2330; box-shadow: 0 50px 100px rgba(0,0,0,.6); padding: 70px 26px 30px; }
.phone .sheet { background: var(--panel); border-radius: 28px; padding: 26px; height: 100%; display: flex; flex-direction: column; gap: 18px; }
.phone .pid { font-size: 20px; color: var(--muted); font-weight: 700; letter-spacing: .06em; }
.phone .what { font-size: 30px; font-weight: 800; line-height: 1.15; }
.phone .row { display: flex; justify-content: space-between; font-size: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
.face { width: 150px; height: 150px; margin: 18px auto 0; position: relative; }
.face i { position: absolute; width: 44px; height: 44px; border-color: var(--accent2); border-style: solid; border-width: 0; }
.face i:nth-child(1) { left: 0; top: 0; border-left-width: 6px; border-top-width: 6px; border-top-left-radius: 18px; }
.face i:nth-child(2) { right: 0; top: 0; border-right-width: 6px; border-top-width: 6px; border-top-right-radius: 18px; }
.face i:nth-child(3) { left: 0; bottom: 0; border-left-width: 6px; border-bottom-width: 6px; border-bottom-left-radius: 18px; }
.face i:nth-child(4) { right: 0; bottom: 0; border-right-width: 6px; border-bottom-width: 6px; border-bottom-right-radius: 18px; }
.face b { position: absolute; left: 50%; top: 50%; width: 92px; height: 92px; margin: -46px 0 0 -46px; border-radius: 50%; display: grid; place-items: center; font-size: 56px; color: #fff; background: var(--ok); }
.btn { text-align: center; padding: 20px; border-radius: 18px; font-size: 26px; font-weight: 800; background: var(--accent); color: #fff; margin-top: auto; }
.bar { width: 520px; height: 18px; border-radius: 9px; background: var(--panel2); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0; }
.node { width: 300px; padding: 26px; border-radius: 24px; background: var(--panel); border: 1px solid var(--line); text-align: center; }
.node b { display: block; font-size: 30px; } .node span { font-size: 21px; color: var(--muted); }
.coin { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #9ee7ff, var(--metal)); box-shadow: 0 0 24px rgba(56,189,248,.7); }
.wall { width: 22px; height: 300px; border-radius: 11px; background: linear-gradient(180deg, #ffd166, var(--wait)); box-shadow: 0 0 40px rgba(245,165,36,.7); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 32px 36px; }
.doc { width: 520px; background: #f7f7fa; color: #10131c; border-radius: 16px; padding: 36px 40px; box-shadow: 0 40px 80px rgba(0,0,0,.5); font-size: 22px; }
.doc .hd { font-size: 30px; font-weight: 800; margin-bottom: 18px; } .doc .ln { display: flex; justify-content: space-between; border-top: 1px solid #dfe2ea; padding: 12px 0; }
.stamp { font-size: 120px; font-weight: 900; letter-spacing: .04em; color: var(--ok); border: 12px solid var(--ok); border-radius: 26px; padding: 4px 40px; transform: rotate(-8deg); }
.stamp.bad { color: var(--bad); border-color: var(--bad); font-size: 84px; }
.rowv { display: grid; grid-template-columns: 80px 90px 220px 360px 200px; gap: 14px; align-items: center; font-size: 23px; padding: 9px 18px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); width: 1040px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rowv .k { color: var(--ok); font-weight: 700; opacity: 0; }
.big { font-size: 190px; font-weight: 900; letter-spacing: -.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.chat { max-width: 900px; padding: 26px 34px; border-radius: 30px 30px 30px 8px; background: var(--panel2); border: 1px solid var(--line); font-size: 36px; font-weight: 600; }
.chat.me { border-radius: 30px 30px 8px 30px; background: var(--accent); border-color: var(--accent); }
.stop { width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff8a80, #d42a1f); display: grid; place-items: center; font-size: 34px; font-weight: 900; color: #fff; box-shadow: 0 0 0 14px rgba(255,93,82,.18), 0 30px 60px rgba(0,0,0,.5); text-align: center; line-height: 1.05; }
.logos { display: flex; align-items: center; gap: 34px; padding: 26px 44px; border-radius: 26px; background: #f5f6fa; }
.logos img { display: block; } .logos .cl { background: #141413; border-radius: 999px; padding: 10px 22px; } .logos .sep { width: 2px; height: 44px; background: #d8dbe5; } .logos .w { font-size: 22px; color: #5b6172; font-weight: 600; }
.foot { position: absolute; left: 60px; right: 60px; bottom: 26px; font-size: 18px; color: #6b7286; display: flex; justify-content: space-between; }
.ticker { font-family: ui-monospace, Menlo, monospace; font-size: 22px; color: var(--metal); }
.feat { display: flex; gap: 16px; flex-wrap: wrap; width: 1500px; }
.feat .pill { font-size: 24px; opacity: .25; }
</style>
</head>
<body>
<script type="application/json" id="film-data">__FILM_JSON__</script>
<h1 class="sr">Purser: the film</h1>
<div id="stage"><div class="foot"><span id="foot-l"></span><span id="foot-r"></span></div></div>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("film-data").textContent);
  var stage = document.getElementById("stage");
  var q = new URLSearchParams(location.search);
  document.getElementById("foot-l").textContent = "Recorded runs · test money · Airwallex sandbox and Metal testnet";
  document.getElementById("foot-r").textContent = D.data.company + " · " + D.data.run + "; Ask Purser, the receive policy, the red team and the Lab from their own runs";

  // Fit the 1920x1080 stage to the window.
  function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = "translate(" + (innerWidth - 1920 * s) / 2 + "px," + (innerHeight - 1080 * s) / 2 + "px) scale(" + s + ")"; }
  addEventListener("resize", fit); fit();

  // ---- a small, pure animation kit: every frame is a function of the time t, so any moment can be shown again. ----
  function E(tag, cls, text, kids) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; (kids || []).forEach(function (k) { n.appendChild(k); }); return n; }
  function put(parent, node, x, y) { node.classList.add("a"); node.style.left = x + "px"; node.style.top = y + "px"; parent.appendChild(node); return node; }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function prog(t, a, b) { return clamp((t - a) / (b - a)); }
  function out3(p) { return 1 - Math.pow(1 - p, 3); }
  function inOut(p) { return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; }
  function back(p) { var c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); }
  function mix(a, b, p) { return a + (b - a) * p; }
  // Appear: fade in and rise into place at t0; optionally leave at t1.
  function rise(n, t, t0, t1, dy) { var p = out3(prog(t, t0, t0 + .55)), o = p; if (t1 != null) o *= 1 - prog(t, t1, t1 + .4); n.style.opacity = o; n.style.transform = "translateY(" + (1 - p) * (dy == null ? 40 : dy) + "px)"; }
  function pop(n, t, t0, t1) { var p = prog(t, t0, t0 + .45), o = clamp(p * 2); if (t1 != null) o *= 1 - prog(t, t1, t1 + .35); n.style.opacity = o; n.style.transform = "scale(" + mix(.6, 1, back(p)) + ")"; }
  function slide(n, t, t0, dx, t1) { var p = out3(prog(t, t0, t0 + .7)), o = p; if (t1 != null) o *= 1 - prog(t, t1, t1 + .4); n.style.opacity = o; n.style.transform = "translateX(" + (1 - p) * dx + "px)"; }
  function shake(t, t0) { var p = prog(t, t0, t0 + .6); return p <= 0 || p >= 1 ? 0 : Math.sin(p * Math.PI * 9) * 22 * (1 - p); }
  function count(t, t0, t1, from, to) { return Math.round(mix(from, to, out3(prog(t, t0, t1)))); }
  function typed(s, t, t0, cps) { return s.slice(0, Math.max(0, Math.floor((t - t0) * cps))); }
  function face(t, t0) { // a Face ID scan: corners pulse, then a green tick
    var f = E("div", "face"); for (var i = 0; i < 4; i++) f.appendChild(E("i")); var b = E("b", null, "✓"); f.appendChild(b);
    return { n: f, at: function (t) { var p = prog(t, t0, t0 + 1.1); f.style.transform = "scale(" + (1 + Math.sin(p * Math.PI * 3) * .06) + ")"; b.style.opacity = prog(t, t0 + 1.1, t0 + 1.3); b.style.transform = "scale(" + mix(.4, 1, back(prog(t, t0 + 1.1, t0 + 1.5))) + ")"; } };
  }
  function phone(pid, what, rows, t0) {
    var sh = E("div", "sheet", null, [E("div", "pid", pid + " · waits for your Face ID"), E("div", "what", what)]);
    rows.forEach(function (r) { sh.appendChild(E("div", "row", null, [E("span", "muted", r[0]), E("b", null, r[1])])); });
    var fc = face(0, t0 + 1); sh.appendChild(fc.n); var ok = E("div", "btn", "Approve with Face ID"); sh.appendChild(ok);
    var ph = E("div", "phone", null, [sh]);
    return { n: ph, at: function (t) { fc.at(t); var done = prog(t, t0 + 2.2, t0 + 2.4); ok.textContent = done > 0 ? "Approved ✓" : "Approve with Face ID"; ok.style.background = done > 0 ? "var(--ok)" : "var(--accent)"; } };
  }
  function toast(kind, title, sub, amt) { var n = E("div", "toast " + kind, null, [E("div", "ic", kind === "ok" ? "✓" : "✕"), E("div", null, title, [E("small", null, sub)]), E("div", "amt", amt)]); return n; }
  function logo(name, h) { var i = document.createElement("img"); i.src = "assets/" + name; i.style.height = h + "px"; i.alt = ""; return i; }
  var d = D.data;

  // ---- the scenes; their lengths and words come from the film's script (src/film/script.ts). ----
  var build = {
    open: function (L) {
      var flying = [["Packwise", "€" + d.card.small], ["Stockline", d.metal.oldPrice + " test USD"], ["Bergtex invoice", "€" + d.bill.invoice], ["Skyline Air", "€120.00"], ["Summit Outfitters", "0.05 test USD"], ["Packwise Pro", "€" + d.card.big]];
      var chips = flying.map(function (f, i) { return put(L, E("div", "pill", f[0] + "  " + f[1]), 0, [40, 120, 200, 820, 900, 980][i]); }); // above and below the words, never through them
      var k = put(L, E("div", "kicker", "Agentic spending"), 140, 330), h = put(L, E("div", "h1", "AI agents are starting to spend company money."), 140, 390);
      h.style.width = "1300px";
      var q2 = put(L, E("div", "h1", "Who is holding the pen?"), 140, 650); q2.style.color = "var(--accent2)";
      return function (t) {
        chips.forEach(function (c, i) { var p = (t * .16 + i * .17) % 1; c.style.opacity = .55 * Math.sin(p * Math.PI); c.style.transform = "translateX(" + mix(1950, -700, p) + "px)"; });
        rise(k, t, .3); rise(h, t, .6); rise(q2, t, 6.2, null, 60);
      };
    },
    problem: function (L) {
      var t1 = put(L, E("div", "h2", "Two bad options"), 140, 110);
      var c = put(L, E("div", "card", null, [E("div", "t", null, [E("span", null, "Agent's card"), E("span", null, "no limit")]), E("div", "n", "•••• ••••"), E("div", "b", null, [E("span", null, "Hope it behaves"), E("span", "visa", "VISA")])]), 160, 300);
      var risk = put(L, E("div", "bar"), 160, 680); var ri = E("i"); risk.appendChild(ri); risk.querySelector("i").style.background = "linear-gradient(90deg,#f5a524,#ff5d52)";
      var rl = put(L, E("div", "h3 bad", "Risk no auditor signs off"), 160, 720);
      var ph = put(L, E("div", "phone", null, [E("div", "sheet", null, [E("div", "pid", "Approve?"), E("div", "big", "0")])]), 1220, 180);
      var num = ph.querySelector(".big"); num.style.fontSize = "150px"; num.style.textAlign = "center"; num.style.marginTop = "140px";
      var pl = put(L, E("div", "h3 muted", "Or approve every cent: no time saved"), 160, 820);
      return function (t) {
        rise(t1, t, .1); slide(c, t, .6, -300); ri.style.width = 100 * out3(prog(t, 1.5, 5)) + "%"; risk.style.opacity = prog(t, 1.2, 1.6); rise(rl, t, 3.5);
        slide(ph, t, 5.5, 300); num.textContent = count(t, 6, 10, 1, 99) + (t > 10 ? "+" : ""); rise(pl, t, 7.5);
      };
    },
    reveal: function (L) {
      var k = put(L, E("div", "kicker", "Meet Purser"), 140, 110), h = put(L, E("div", "h2", "Every AI agent gets its own company card, with limits the CFO sets."), 140, 160); h.style.width = "1600px";
      var cards = d.cards.map(function (c, i) { return put(L, E("div", "mini", null, [E("div", "t", c.name), E("div", "n", "•••• " + c.last4), E("div", "l", "€" + c.perTx + " a purchase · " + c.only)]), 140 + i * 340, 400); });
      var awx = put(L, E("div", "pill", "Airwallex Issuing · Visa"), 140, 620);
      var mand = d.mandates.map(function (m, i) { return put(L, E("div", "pill", m.name.replace(" agent", "") + ": at most " + m.cap + " test USD a payment, " + m.payee + " only"), 140, 720 + i * 78); });
      var metal = put(L, E("div", "pill", "Mandates on chain · Metal"), 1300, 620); metal.style.color = "var(--metal)";
      var fid = put(L, E("div", "pill ok", "Above the limits: Face ID"), 1300, 400);
      return function (t) {
        rise(k, t, .1); rise(h, t, .3);
        cards.forEach(function (c, i) { var p = out3(prog(t, 1.4 + i * .25, 2.2 + i * .25)); c.style.opacity = p; c.style.transform = "translateY(" + (1 - p) * 120 + "px) rotate(" + (1 - p) * (i - 1) * 8 + "deg)"; });
        rise(awx, t, 2.6); mand.forEach(function (m, i) { slide(m, t, 4 + i * .35, -200); }); rise(metal, t, 4.2); pop(fid, t, 7.5);
      };
    },
    card: function (L) {
      var c = put(L, E("div", "card", null, [E("div", "t", null, [E("span", null, "Sourcing agent"), E("span", null, "Virtual")]), E("div", "n", "•••• " + d.card.last4), E("div", "b", null, [E("span", null, "Warehouse software"), E("span", "visa", "VISA")])]), 140, 170);
      var lim = put(L, E("div", "h3", ""), 140, 520), bar = put(L, E("div", "bar"), 140, 580), bi = E("i"); bar.appendChild(bi);
      var t1 = put(L, toast("ok", d.card.merchant + " Starter", "approved by Airwallex", "€" + d.card.small), 760, 170);
      var t2 = put(L, toast("bad", d.card.merchant + " Pro", "declined by Airwallex: over the €" + d.card.from + " limit", "€" + d.card.big), 760, 300);
      var ask = put(L, E("div", "chat", "Can I have €" + d.card.to + " a purchase for the Pro plan?"), 760, 450); ask.style.fontSize = "30px"; ask.style.maxWidth = "620px";
      var ph = phone(d.card.proposal, "Sourcing agent's card: most per purchase", [["now", "€" + d.card.from], ["after", "€" + d.card.to]], 8.6); put(L, ph.n, 1440, 130);
      var t3 = put(L, toast("ok", d.card.merchant + " Pro, again", "approved by Airwallex, after Face ID", "€" + d.card.big), 140, 680);
      var log = put(L, E("div", "pill", "Every step in the audit log"), 140, 840);
      return function (t) {
        var limit = t < 13.5 ? Number(d.card.from) : mix(Number(d.card.from), Number(d.card.to), out3(prog(t, 13.5, 14.6)));
        lim.textContent = "Limit per purchase: €" + limit.toFixed(2); bi.style.width = limit / 60 * 100 + "%";
        slide(c, t, .2, -300); rise(lim, t, .8); bar.style.opacity = prog(t, .8, 1.2);
        slide(t1, t, 2, 300); slide(t2, t, 4.4, 300); t2.style.transform += " translateX(" + shake(t, 4.9) + "px)";
        c.style.transform += " translateX(" + shake(t, 4.9) * .5 + "px)";
        rise(ask, t, 7); slide(ph.n, t, 8.2, 500); ph.at(t);
        rise(t3, t, 16); rise(log, t, 19.5);
      };
    },
    bill: function (L) {
      var doc = put(L, E("div", "doc", null, [E("div", "hd", "Invoice · manufacturer"), E("div", "ln", null, [E("span", null, "Amount"), E("b", null, "EUR " + d.bill.invoice)]), E("div", "ln", null, [E("span", null, "Pay to"), E("b", null, "allowlisted payee")]), E("div", "ln", null, [E("span", null, "Pay by"), E("b", null, "SWIFT")])]), 140, 170);
      var ai = put(L, E("div", "pill ai", "read by Haiku · Sonnet · code checks the fields"), 140, 560);
      var usd = put(L, E("div", "panel", null, [E("div", "kicker", "Convert only what is missing"), E("div", "h2", "")]), 760, 170); usd.style.width = "620px";
      var conv = usd.querySelector(".h2");
      var floor = put(L, E("div", "pill", "Reserve floors checked · live quote, locked"), 760, 420);
      var ph = phone(d.bill.proposal, "Pay EUR " + d.bill.invoice + " by SWIFT", [["buy", "EUR " + d.bill.eur], ["for", "USD " + d.bill.usd], ["fee at most", "EUR " + d.bill.ceiling]], 9.4); put(L, ph.n, 1440, 130);
      var stamp = put(L, E("div", "stamp", "PAID"), 820, 600);
      var fee = put(L, E("div", "pill ok", "Fee EUR " + d.bill.fee + " ≤ EUR " + d.bill.ceiling), 140, 700);
      var hash = put(L, E("div", "pill", "Approval hash " + d.bill.hash + " in the payment"), 140, 800);
