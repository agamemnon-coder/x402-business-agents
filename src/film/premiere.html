<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purser: the premiere</title>
<style>
@font-face { font-family: Inter; src: url("assets/inter.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
:root { --pic: #0a1020; --surface: #121a2a; --sunken: #18213a; --line: #27314a; --text: #eef1f6; --muted: #a4adbd; --faint: #98a2b4; --accent: #9b96ff; --ok: #3ccf82; --bad: #ff6b70; --wait: #f5b14a; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { font-family: Inter, system-ui, sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
.tn { font-variant-numeric: tabular-nums; }
#stage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; background: #000; overflow: hidden; }
/* The picture: 2.39:1 inside 1920x1080, black bars above and below. */
#pic { position: absolute; left: 0; top: 138px; width: 1920px; height: 804px; overflow: hidden; background: var(--pic); }
/* The background (Max, premiere v3: calm, enterprise): the deep navy of the picture, a very faint static dot grid
   (one dot every 36 px, white at 7%), a soft vignette, and a drift so slow it is hardly seen; in the picture only,
   never the letterbox bars. It fades in after the opening line. Text stays at WCAG AA or better over it. */
#bg { position: absolute; inset: 0; overflow: hidden; }
#dots { position: absolute; left: -72px; top: -72px; width: 2064px; height: 948px; opacity: 0; background-image: radial-gradient(circle, rgba(255,255,255,.07) 1.3px, transparent 1.8px); background-size: 36px 36px; }
#vig { position: absolute; inset: 0; opacity: 0; background: radial-gradient(ellipse 75% 85% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); }
html.overlay #bg { display: none; }
/* The corner credits, in the top bar: never near the subtitles in the lower bar. Text only, quiet: grey (white at 46%,
   4.6:1 on the black bar, still WCAG AA), 20 px. */
.credit { position: absolute; top: 0; height: 138px; display: flex; align-items: center; font-size: 20px; font-weight: 500; color: rgba(255,255,255,.46); z-index: 6; opacity: 0; white-space: nowrap; }
#cl { left: 64px; } #cr { right: 64px; }
/* Max's own portrait recording goes inside this frame (npm run video -- --slot …): the page draws the frame only. */
.ring { border: 10px solid #1e2331; border-radius: 54px; box-shadow: 0 40px 90px rgba(0,0,0,.65); }
.bar { position: absolute; left: 0; width: 1920px; height: 138px; background: #000; z-index: 5; }
.bar.top { top: 0; } .bar.bot { top: 942px; }
html.overlay, html.overlay body, html.overlay #stage, html.overlay #pic { background: transparent; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: 0; }
.layer { position: absolute; inset: 0; opacity: 0; visibility: hidden; will-change: opacity, transform; }
.layer.black { background: #000; }
.full { width: 1920px; height: 804px; }
.a { position: absolute; will-change: opacity, transform; }
.c { left: 0; width: 1920px; text-align: center; }
.kick { font-size: 26px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--faint); }
.mega { font-size: 300px; font-weight: 800; letter-spacing: -.05em; line-height: .86; }
.giant { font-size: 200px; font-weight: 800; letter-spacing: -.045em; line-height: .95; }
.huge { font-size: 132px; font-weight: 800; letter-spacing: -.04em; line-height: 1; }
.hl { font-size: 84px; font-weight: 800; letter-spacing: -.03em; line-height: 1.06; }
.hm { font-size: 58px; font-weight: 750; letter-spacing: -.025em; line-height: 1.14; }
.hs { font-size: 42px; font-weight: 650; letter-spacing: -.015em; line-height: 1.22; }
.body { font-size: 34px; font-weight: 500; line-height: 1.36; }
.small { font-size: 27px; font-weight: 500; line-height: 1.4; color: var(--muted); }
.tiny { font-size: 22px; font-weight: 500; line-height: 1.45; color: var(--faint); }
.mono { font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-weight: 600; letter-spacing: -.01em; }
.brk { word-break: break-all; }
.idl { font-size: 35px; line-height: 1.25; }
.muted { color: var(--muted); } .acc { color: var(--accent); } .okc { color: var(--ok); } .badc { color: var(--bad); } .waitc { color: var(--wait); }
.pill { display: inline-flex; align-items: center; gap: 12px; padding: 14px 28px; border-radius: 999px; font-size: 30px; font-weight: 650; background: var(--surface); border: 1px solid var(--line); white-space: nowrap; }
.pill.wait { background: rgba(245,177,74,.12); border-color: rgba(245,177,74,.55); color: #ffd79c; }
.pill.bad { background: rgba(255,107,112,.12); border-color: rgba(255,107,112,.55); color: #ffb7b9; }
.ovl { display: inline-block; padding: 10px 18px; border-radius: 10px; background: rgba(0,0,0,.62); border: 1px solid rgba(255,255,255,.28); color: #fff; font-size: 26px; font-weight: 650; white-space: nowrap; }
.ovl.sub { font-size: 21px; font-weight: 500; color: #d5d9e2; }
.lower { padding: 18px 28px 20px; border-radius: 14px; background: rgba(0,0,0,.62); border-left: 6px solid var(--accent); }
.lower b { display: block; font-size: 40px; font-weight: 750; letter-spacing: -.015em; }
.lower span { display: block; font-size: 24px; color: #d5d9e2; margin-top: 4px; }
/* The three agents. */
.agent { width: 500px; height: 300px; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); padding: 32px 34px; display: flex; flex-direction: column; gap: 16px; }
.agent b { font-size: 42px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
.agent .model { align-self: flex-start; padding: 8px 18px; border-radius: 999px; font-size: 25px; font-weight: 650; color: var(--accent); background: rgba(155,150,255,.1); border: 1px solid rgba(155,150,255,.4); }
.agent span { font-size: 32px; font-weight: 550; line-height: 1.3; }
.agent.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 70px rgba(139,133,255,.22); }
.face.mini { width: 76px; height: 76px; }
.face.mini i { border-width: 0; } .face.mini i:nth-child(1) { border-left-width: 5px; border-top-width: 5px; border-top-left-radius: 12px; } .face.mini i:nth-child(2) { border-right-width: 5px; border-top-width: 5px; border-top-right-radius: 12px; } .face.mini i:nth-child(3) { border-left-width: 5px; border-bottom-width: 5px; border-bottom-left-radius: 12px; } .face.mini i:nth-child(4) { border-right-width: 5px; border-bottom-width: 5px; border-bottom-right-radius: 12px; }
.face.mini b { font-size: 28px; }
/* The diagram. */
.node { width: 280px; height: 236px; border-radius: 28px; background: var(--surface); border: 1px solid var(--line); padding: 26px 24px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
.node b { font-size: 38px; font-weight: 800; letter-spacing: -.02em; line-height: 1.08; }
.node span { font-size: 23px; color: var(--muted); line-height: 1.3; }
.node.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 70px rgba(139,133,255,.22); }
.node .face { width: 64px; height: 64px; margin-bottom: auto; }
.node .face b { font-size: 22px; }
.arrow { height: 4px; background: var(--accent); border-radius: 2px; transform-origin: 0 50%; }
.arrow::after { content: ""; position: absolute; right: -4px; top: -9px; border-top: 11px solid transparent; border-bottom: 11px solid transparent; border-left: 16px solid var(--accent); }
/* The price gauge. */
.track { width: 820px; height: 8px; border-radius: 4px; background: var(--sunken); }
.capmark { width: 6px; height: 86px; border-radius: 3px; background: var(--wait); }
.dot { width: 34px; height: 34px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 30px rgba(60,207,130,.6); }
.dot.over { background: var(--bad); box-shadow: 0 0 34px rgba(255,107,112,.75); }
/* The dispute. */
.chip { width: 150px; height: 98px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.chip b { font-size: 36px; font-weight: 800; letter-spacing: -.02em; }
.chip i { font-style: normal; font-size: 19px; font-weight: 600; color: var(--faint); min-height: 24px; }
.chip.signed { border-color: rgba(60,207,130,.55); } .chip.signed i { color: var(--ok); }
.chip.refund { border-color: var(--wait); background: rgba(245,177,74,.12); } .chip.refund i { color: var(--wait); }
.stamp { font-size: 50px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; color: var(--bad); border: 8px solid var(--bad); border-radius: 20px; padding: 6px 28px; white-space: nowrap; }
/* Phones. */
.phone { width: 420px; height: 772px; border-radius: 64px; background: #050608; border: 10px solid #1e2331; box-shadow: 0 40px 90px rgba(0,0,0,.65); overflow: hidden; }
.phone .scr { position: absolute; inset: 0; overflow: hidden; border-radius: 54px; background: #0a0c11; }
.phone .notch { position: absolute; top: 12px; left: 50%; width: 118px; height: 32px; margin-left: -59px; border-radius: 16px; background: #000; z-index: 3; }
.sheet { position: absolute; left: 22px; right: 22px; top: 64px; bottom: 26px; display: flex; flex-direction: column; gap: 14px; }
.sheet .pid { font-size: 17px; font-weight: 700; letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
.sheet .what { font-size: 29px; font-weight: 800; line-height: 1.16; letter-spacing: -.015em; }
.sheet .row { display: flex; justify-content: space-between; gap: 12px; font-size: 19px; border-top: 1px solid var(--line); padding-top: 11px; }
.sheet .row span { color: var(--muted); } .sheet .row b { text-align: right; font-weight: 650; }
.sheet .hash { font-size: 17px; padding: 10px 12px; border-radius: 12px; background: var(--sunken); word-break: break-all; }
.sheet .hash.lit { box-shadow: 0 0 0 2px var(--accent); }
.btnp { text-align: center; padding: 18px; border-radius: 16px; font-size: 23px; font-weight: 800; background: var(--text); color: #0a0c11; margin-top: auto; }
.btnp.lit { box-shadow: 0 0 0 4px rgba(139,133,255,.6); }
.btnp.done { background: var(--ok); color: #04130b; }
.face { width: 150px; height: 150px; position: relative; }
.face i { position: absolute; width: 30%; height: 30%; border-color: var(--accent); border-style: solid; border-width: 0; }
.face i:nth-child(1) { left: 0; top: 0; border-left-width: 6px; border-top-width: 6px; border-top-left-radius: 18px; }
.face i:nth-child(2) { right: 0; top: 0; border-right-width: 6px; border-top-width: 6px; border-top-right-radius: 18px; }
.face i:nth-child(3) { left: 0; bottom: 0; border-left-width: 6px; border-bottom-width: 6px; border-bottom-left-radius: 18px; }
.face i:nth-child(4) { right: 0; bottom: 0; border-right-width: 6px; border-bottom-width: 6px; border-bottom-right-radius: 18px; }
.face b { position: absolute; left: 20%; top: 20%; width: 60%; height: 60%; border-radius: 50%; display: grid; place-items: center; font-size: 56px; color: #fff; background: var(--ok); opacity: 0; }
.node .face i { border-width: 0; } .node .face i:nth-child(1) { border-left-width: 4px; border-top-width: 4px; border-top-left-radius: 10px; } .node .face i:nth-child(2) { border-right-width: 4px; border-top-width: 4px; border-top-right-radius: 10px; } .node .face i:nth-child(3) { border-left-width: 4px; border-bottom-width: 4px; border-bottom-left-radius: 10px; } .node .face i:nth-child(4) { border-right-width: 4px; border-bottom-width: 4px; border-bottom-right-radius: 10px; }
.scan { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: grid; place-items: center; background: rgba(5,6,8,.72); opacity: 0; z-index: 4; }
/* The /try/sign mock: the live page's dark theme, at phone width. */
.pg { position: absolute; left: 0; top: 0; width: 400px; }
.pg .tb { background: var(--text); color: #0a0c11; text-align: center; font-size: 14.5px; font-weight: 700; padding: 46px 12px 9px; }
.pg .hdr { display: flex; align-items: center; gap: 9px; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 18px; font-weight: 800; }
.pg .hdr svg { display: block; }
.pg .in { padding: 18px 16px 0; display: flex; flex-direction: column; gap: 12px; }
.pg .eb { font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.pg .ph { font-size: 29px; font-weight: 800; letter-spacing: -.02em; line-height: 1.12; }
.pg .card { background: #12151d; border: 1px solid var(--line); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
.pg .who { display: flex; align-items: center; gap: 8px; font-size: 15.5px; font-weight: 700; flex-wrap: wrap; }
.pg .who i { width: 30px; height: 30px; border-radius: 50%; background: #6d5bd0; }
.pg .tag { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--sunken); color: var(--muted); }
.pg .says { font-size: 15.5px; line-height: 1.45; }
.pg dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 0; font-size: 14.5px; }
.pg dt { color: var(--muted); } .pg dd { margin: 0; font-weight: 650; }
.pg .chk { border-radius: 12px; padding: 10px 12px; background: var(--sunken); font-size: 14px; line-height: 1.4; }
.pg .chk b { display: block; color: var(--accent); }
.pg .note { font-size: 13.5px; color: var(--muted); }
.pg .hash { font-size: 12.5px; background: var(--sunken); border-radius: 10px; padding: 8px 10px; word-break: break-all; }
.pg .btn { text-align: center; padding: 13px; border-radius: 12px; font-size: 16px; font-weight: 750; background: var(--text); color: #0a0c11; }
.pg .btn.alt { background: transparent; color: var(--text); border: 1px solid var(--line); }
.pg .btn.lit { box-shadow: 0 0 0 4px rgba(139,133,255,.65); }
.pg .done { font-size: 15px; font-weight: 600; color: var(--ok); }
.pg .res { margin: 14px 16px 0; background: #12151d; border: 1px solid var(--line); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
.pg .res .rh { font-size: 22px; font-weight: 800; }
.pg .ln { display: flex; gap: 10px; font-size: 16px; font-weight: 700; align-items: center; }
.pg .ln i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; background: rgba(60,207,130,.18); color: var(--ok); display: grid; place-items: center; font-size: 15px; }
.pg .ln.lit { color: var(--ok); }
/* The six seconds. */
.sixrow { display: flex; align-items: baseline; gap: 28px; }
.steps { width: 760px; }
.step { display: flex; align-items: baseline; gap: 26px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 34px; font-weight: 600; }
.step .mono { font-size: 30px; color: var(--muted); width: 190px; flex: none; }
.step.paid { color: var(--ok); font-weight: 800; }
.simline { font-size: 36px; font-weight: 650; letter-spacing: -.01em; color: var(--wait); }
/* The spec cards. */
.spec { position: absolute; left: 0; top: 0; width: 1920px; height: 804px; display: flex; align-items: center; justify-content: center; gap: 52px; padding-bottom: 30px; }
.spec .col { display: flex; flex-direction: column; gap: 16px; max-width: 960px; }
.spec .lab { font-size: 72px; font-weight: 800; letter-spacing: -.03em; line-height: 1.06; }
.bul { display: flex; gap: 22px; align-items: baseline; }
.bul i { font-style: normal; flex: none; width: 22px; height: 22px; border-radius: 50%; transform: translateY(-4px); }
.bul i.real { background: var(--ok); } .bul i.ours { border: 3px solid var(--muted); }
</style>
</head>
<body>
<script type="application/json" id="premiere-data">__PREMIERE_JSON__</script>
<h1 class="sr">Purser: the premiere</h1>
<template id="mark-tpl"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0b1220"/><g transform="translate(4 4)" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/></g></svg></template>
<div id="stage"><div id="pic"><div id="bg"><div id="dots"></div><div id="vig"></div></div></div><div class="bar top"></div><div class="bar bot"></div><div class="credit" id="cl"></div><div class="credit" id="cr"></div></div>
<script>
(function () {
  "use strict";
  // Every string on screen comes from the data block (src/film/premiere.ts builds it from the main run's record); this
  // script only places it and moves it. It types in no figure (test/premiere.test.ts reads this script to check).
  var D = JSON.parse(document.getElementById("premiere-data").textContent);
  var stage = document.getElementById("stage"), pic = document.getElementById("pic");
  var q = new URLSearchParams(location.search);
  var overlay = q.get("overlay");
  var credits = q.get("credits") === "ai" ? "ai" : "max";

  var BAR = 138;
  // ?rec=x,y,w,h&recfor=<scene>&speed=n: that scene frames Max's recording (laid in afterwards by ffmpeg).
  var rec = null;
  if (q.get("rec")) { var rv = q.get("rec").split(",").map(Number); rec = { x: rv[0], y: rv[1], w: rv[2], h: rv[3], id: q.get("recfor"), speed: Number(q.get("speed") || 1) }; }
  var dots = document.getElementById("dots"), vig = document.getElementById("vig"), B = D.background;
  // The background at film time t: the dot grid drifts a fraction of a pixel a frame (by whole grid steps it is the
  // same picture, so it wraps without a jump); grid and vignette fade in from B.start.
  function background(t) {
    var on = prog(t, B.start, B.start + B.fadeIn);
    dots.style.opacity = vig.style.opacity = on;
    dots.style.transform = "translate(" + (-(t * B.drift[0]) % B.grid) + "px," + (-(t * B.drift[1]) % B.grid) + "px)";
  }
  // The corner credits at film time t: on every scene that has them, fading only where they start or stop.
  var cl = document.getElementById("cl"), cr = document.getElementById("cr");
  cl.textContent = D.credits.left; cr.textContent = D.credits.right;
  function corner(t) {
    var o = 0;
    D.scenes.forEach(function (sc, i) {
      var lt = t - sc.start;
      if (lt < 0 || lt >= sc.seconds || !sc.credits) return;
      var prev = D.scenes[i - 1], next = D.scenes[i + 1];
      o = Math.min(prev && prev.credits ? 1 : prog(lt, 0, .3), next && next.credits ? 1 : 1 - prog(lt, sc.seconds - .3, sc.seconds - .02));
    });
    cl.style.opacity = cr.style.opacity = o;
  }
  function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = "translate(" + (innerWidth - 1920 * s) / 2 + "px," + (innerHeight - 1080 * s) / 2 + "px) scale(" + s + ")"; }
  addEventListener("resize", fit); fit();

  // ---- a small, pure animation kit: every frame is a function of the time t, so any moment can be drawn again ----
  function E(tag, cls, text, kids) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; (kids || []).forEach(function (k) { n.appendChild(k); }); return n; }
  function put(parent, node, x, y) { node.classList.add("a"); node.style.left = x + "px"; node.style.top = y + "px"; parent.appendChild(node); return node; }
  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function prog(t, a, b) { return clamp((t - a) / (b - a)); }
  function out3(p) { return 1 - Math.pow(1 - p, 3); }
  function mix(a, b, p) { return a + (b - a) * p; }
  // Appear: fade in and rise into place at t0 (slowly); optionally leave at t1.
  function rise(n, t, t0, t1, dy) { var p = out3(prog(t, t0, t0 + .9)), o = p; if (t1 != null) o *= 1 - prog(t, t1, t1 + .5); n.style.opacity = o; n.style.transform = "translateY(" + (1 - p) * (dy == null ? 26 : dy) + "px)"; }
  function fade(n, t, t0, t1) { var o = prog(t, t0, t0 + .7); if (t1 != null) o *= 1 - prog(t, t1, t1 + .5); n.style.opacity = o; }
  function mark(size) { var s = document.getElementById("mark-tpl").content.firstElementChild.cloneNode(true); s.setAttribute("width", size); s.setAttribute("height", size); var w = E("div"); w.appendChild(s); return w; }
  function faceGlyph(cls) { var f = E("div", "face" + (cls ? " " + cls : "")); for (var i = 0; i < 4; i++) f.appendChild(E("i")); f.appendChild(E("b", null, "✓")); return f; }
  // A Face ID scan: the corners pulse, then a green tick.
  function scan(f, t, t0) { var p = prog(t, t0, t0 + 1.1); f.style.transform = "scale(" + (1 + Math.sin(p * Math.PI * 3) * .06) + ")"; var b = f.querySelector("b"); b.style.opacity = prog(t, t0 + 1.1, t0 + 1.3); b.style.transform = "scale(" + mix(.5, 1, out3(prog(t, t0 + 1.1, t0 + 1.5))) + ")"; }
  var TILT = -6;
  function width(n, w) { n.style.width = w + "px"; return n; }
  // The frame around a recording's box (stage pixels; the picture starts below the top bar).
  function ring(L, rec) { L.classList.add("still"); var r = put(L, E("div", "ring"), rec.x - 10, rec.y - BAR - 10); r.style.width = rec.w + 20 + "px"; r.style.height = rec.h + 20 + "px"; return r; }

  // ---- the scenes, by id; their lengths and the voice-over are in src/film/premiereScript.ts ----
  // Each builder gets the scene's layer, its strings and whether only the overlay is wanted (a recording slot's label
  // over Max's own footage), and returns the function that draws the scene at a time t from its start.
  var build = {
    "01-line": function (L, S) {
      L.classList.add("black");
      var h = put(L, E("div", "hl c", S.line), 0, 352);
      return function (t) { h.style.opacity = Math.min(prog(t, .15, 1.0), 1 - prog(t, 2.25, 2.9)); };
    },

      roll.push(put(L, E("div", "small c", S.credits[credits]), 0, y - 26)); y += 50;
      roll.push(put(L, E("div", "kick c waitc", S.last), 0, y)); y += 70;
      roll.push(put(L, E("div", "small c acc", S.short), 0, y));
      var A = [mk, ct, url, ft, mt], out = 3.6, at = 4.3;
      return function (t) {
        fade(mk, t, .2, out); rise(ct, t, .4, out); rise(url, t, 1.1, out); fade(ft, t, 1.9, out); fade(mt, t, 2.3, out);
        A.forEach(function (n) { n.style.visibility = t < out + .6 ? "visible" : "hidden"; });
        roll.forEach(function (n, i) { rise(n, t, at + i * .3, null, 14); });
      };
    },
  };

  // Each scene fades in from the background and out to it (its fades are in the script, premiereScript.ts).
  var scenes = D.scenes.map(function (sc) {
    var L = E("div", "layer"); pic.appendChild(L);
    var only = overlay === sc.id;
    return { id: sc.id, start: sc.start, seconds: sc.seconds, L: L, f: sc.fade, update: overlay && !only ? function () {} : build[sc.id](L, D.screen[sc.id], only, sc.seconds, rec && rec.id === sc.id ? rec : null) };
  });
  var total = scenes.reduce(function (s, x) { return Math.max(s, x.start + x.seconds); }, 0);

  function render(t) {
    background(t); corner(t);
    scenes.forEach(function (sc) {
      var lt = t - sc.start, on = lt >= 0 && lt < sc.seconds;
      if (!on) { sc.L.style.opacity = 0; sc.L.style.visibility = "hidden"; return; }
      sc.L.style.visibility = "visible";
      sc.L.style.opacity = Math.min(sc.f[0] ? prog(lt, 0, sc.f[0]) : 1, sc.f[1] ? 1 - prog(lt, sc.seconds - sc.f[1], sc.seconds - .02) : 1);

      sc.L.style.transform = sc.L.classList.contains("still") ? "" : "scale(" + mix(1, 1.02, clamp(lt / sc.seconds)) + ")";
      sc.update(lt);

  }
  // ?overlay=<scene>: that recording slot's label and the letterbox bars only, on a transparent page (a PNG over
  // Max's footage). ?t=seconds: one moment. ?manual: the caller sets the time for every frame (npm run video), so the
  // film cannot drift from the recording. Otherwise it plays from ?from= (or the start).
  if (overlay) {
    document.documentElement.classList.add("overlay");
    scenes.forEach(function (sc) { if (sc.id === overlay) { sc.L.style.opacity = 1; sc.L.style.visibility = "visible"; } });
    // The corner credits too: the overlay's bars cover the clip's.
    var os = D.scenes.filter(function (sc) { return sc.id === overlay; })[0];
    cl.style.opacity = cr.style.opacity = os && os.credits ? 1 : 0;
    return;
  }
  window.__film = function (t) { render(Math.min(Math.max(0, t), total - .001)); };
  if (q.has("t")) { render(Number(q.get("t"))); return; }
  if (q.has("manual")) { render(Number(q.get("from") || 0)); return; }
  var from = Number(q.get("from") || 0), t0 = null;
  function frame(now) { if (t0 === null) t0 = now; render(Math.min(from + (now - t0) / 1000, total - .001)); requestAnimationFrame(frame); }
  render(from);
  requestAnimationFrame(frame);
})();
