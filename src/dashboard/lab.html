<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Purser · Scenario Lab</title>
<style>
@font-face { font-family: "Inter"; src: url("assets/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --text: #0b1220; --muted: #4b5563; --faint: #6b7280;
  --border: #e5e8ec; --accent: #4f46e5; --accent-soft: #eef0ff; --grid: #e9ecf1;
  --ok: #0f8a4f; --ok-soft: #e7f6ee; --warn: #b45309; --warn-soft: #fdf1e3; --bad: #c8261b; --bad-soft: #fdecea;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05); color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0c11; --surface: #12151c; --surface-2: #0e1117; --text: #e9ebf1; --muted: #b0b7c3; --faint: #9ca3af;
    --border: #222734; --accent: #8b87ff; --accent-soft: #1b1d3a; --grid: #222734;
    --ok: #3ccf7e; --ok-soft: #0f2419; --warn: #f2a34a; --warn-soft: #2a1e0e; --bad: #ff6b5f; --bad-soft: #2c1312;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0c11; --surface: #12151c; --surface-2: #0e1117; --text: #e9ebf1; --muted: #b0b7c3; --faint: #9ca3af;
  --border: #222734; --accent: #8b87ff; --accent-soft: #1b1d3a; --grid: #222734;
  --ok: #3ccf7e; --ok-soft: #0f2419; --warn: #f2a34a; --warn-soft: #2a1e0e; --bad: #ff6b5f; --bad-soft: #2c1312;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
.num { font-variant-numeric: tabular-nums; }
/* The same top bar as the dashboard (src/dashboard/page.html). */
.top { display: flex; align-items: center; gap: 28px; min-height: 64px; padding: 0 32px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; text-decoration: none; color: var(--text); white-space: nowrap; }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.top .nav { display: flex; gap: 4px; overflow-x: auto; }
.top .nav a { text-decoration: none; color: var(--muted); font-weight: 500; font-size: 14px; padding: 8px 12px; border-radius: 8px; white-space: nowrap; }
.top .nav a.on { color: var(--text); background: color-mix(in srgb, var(--muted) 14%, transparent); }
@media (max-width: 640px) { .top { padding: 8px 16px; gap: 8px 16px; } .top .nav a { padding: 6px 8px; font-size: 13px; } }
header:not(.top) { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; gap: 8px 16px; flex-wrap: wrap; align-items: baseline; }
header h1 { font-size: 18px; margin: 0; }
.honest { flex-basis: 100%; margin: 6px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 14px; background: color-mix(in srgb, var(--accent) 12%, transparent); max-width: 90ch; }
main { padding: 14px 20px 24px; display: grid; gap: 12px; max-width: 1100px; }
.bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bar .count { font-weight: 700; font-size: 16px; }
.bar .count.ok { color: var(--ok); } .bar .count.bad { color: var(--bad); }
a.btn { font-weight: 600; text-decoration: none; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 7px; padding: 6px 12px; }
:root[data-theme="dark"] a.btn { color: #0a0c11; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) a.btn { color: #0a0c11; } }
article { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 16px 14px; }
article h2 { font-size: 15px; margin: 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pill { font-size: 12px; font-weight: 650; border-radius: 999px; padding: 1px 9px; }
.pill.ok { background: var(--ok-soft); color: var(--ok); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
article h2 a { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none; }
dl { display: grid; grid-template-columns: 9ch minmax(0, 1fr); gap: 4px 12px; margin: 10px 0 0; font-size: 13.5px; }
dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
.ev { color: var(--faint); font-size: 12.5px; }
@media (max-width: 640px) { main { padding: 12px 16px 24px; } dl { grid-template-columns: minmax(0, 1fr); } dt { margin-top: 6px; } }
</style>
</head>
<body>
<header class="top"><a class="brand" href="./"><span class="mark"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.67 19a2 2 0 0 0 1.416-.588l6.154-6.172a6 6 0 0 0-8.49-8.49L5.586 9.914A2 2 0 0 0 5 11.328V18a1 1 0 0 0 1 1z"/><path d="M16 8 2 22"/><path d="M17.5 15H9"/></svg></span>Purser</a><nav class="nav" aria-label="Main"><a href="./">Overview</a><a href="demo">Demo</a><a href="month">A month in 90 seconds</a><a href="lab" class="on" aria-current="page">Lab</a></nav></header>
<header>
  <h1>Scenario Lab</h1>
  <p class="honest" id="honest"></p>
</header>
<main>
  <div class="bar"><span class="count" id="count"></span><span class="ev" id="at"></span><a class="btn" id="all" href="lab?run=all" hidden>Run all again</a></div>
  <div id="list"></div>
</main>
<script type="application/json" id="lab-data">__LAB_JSON__</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("lab-data").textContent);
  var live = data.mode === "live";
  function el(tag, cls, kids) { var e = document.createElement(tag); if (cls) e.className = cls; (kids || []).forEach(function (k) { if (k !== null && k !== undefined) e.append(k); }); return e; }
  function txt(tag, cls, t) { var e = el(tag, cls); e.textContent = t; return e; }
  document.getElementById("honest").textContent = "Each scenario runs in a fresh throwaway world with stand-ins for Airwallex and Metal: no money moves and nothing reaches a phone. The live versions of the same stories are the run logs. " +
    (live ? "Running again starts from a new world (the reset)." : "These results were recorded on the runner, where the Lab runs them again on click.");
  var passed = data.results.filter(function (r) { return r.passed; }).length;
  var count = document.getElementById("count");
  count.textContent = passed + " of " + data.results.length + " as expected";
  count.className = "count " + (passed === data.results.length ? "ok" : "bad");
  document.getElementById("at").textContent = (live ? "ran " : "recorded ") + new Date(data.at).toISOString().slice(0, 16).replace("T", " ") + " UTC";
  document.getElementById("all").hidden = !live;
  document.getElementById("list").replaceChildren.apply(document.getElementById("list"), data.results.map(function (r) {
    var again = null;
    if (live) { again = txt("a", "", "Run again"); again.href = "lab?run=" + encodeURIComponent(r.id); }
    return el("article", "", [
      el("h2", "", [txt("span", "pill " + (r.passed ? "ok" : "bad"), r.passed ? "as expected" : "NOT as expected"), r.title, again]),
      el("dl", "", [txt("dt", "", "Expected"), txt("dd", "", r.expected), txt("dt", "", "Happened"), txt("dd", "", r.happened),
        txt("dt", "", "Evidence"), txt("dd", "ev", r.evidence.join(" · ") || "none"), txt("dt", "", "Stand-in"), txt("dd", "ev", r.offline)]),
    ]);
  }));
})();
</script>
</body>
</html>
