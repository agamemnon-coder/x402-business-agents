<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purser live</title>
<style>
@font-face { font-family: Inter; src: url("assets/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root { --bg: #f6f7fb; --surface: #ffffff; --text: #0d1220; --muted: #5d6578; --border: #e4e7ef; --accent: #5b4cf0; --accent-soft: #ecebfe; --ok: #0f8a4f; --ok-soft: #e7f6ee; --bad: #c8261b; --bad-soft: #fdecea; --wait: #b45309; --sunken: #f1f3f8; --metal: #0e7490; --awx: #ff4f1f; }
@media (prefers-color-scheme: dark) { :root { --bg: #0a0c11; --surface: #12151d; --text: #eef0f6; --muted: #98a0b3; --border: #232838; --accent: #8f85ff; --accent-soft: #1d1a3d; --ok: #3ccf7e; --ok-soft: #0f2419; --bad: #ff6b5f; --bad-soft: #2c1312; --wait: #f2a34a; --sunken: #181c26; --metal: #38bdf8; --awx: #ff7a52; } }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.top { display: flex; align-items: center; gap: 14px; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: inline-block; }
.chip { font-size: 12.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; }
.top .count { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px; max-width: 1280px; margin: 0 auto; padding: 28px; }
.cast { display: flex; flex-direction: column; gap: 10px; }
.who { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 14px; font-weight: 600; transition: all .35s ease; }
.who b { width: 10px; height: 10px; border-radius: 50%; background: var(--border); transition: background .35s; }
.who.on { color: var(--text); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.who.on b { background: var(--accent); }
.scene { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px 36px; min-height: 560px; display: flex; flex-direction: column; }
.scene h1 { font-size: 40px; line-height: 1.12; letter-spacing: -.02em; margin: 0 0 10px; }
.scene .line { font-size: 20px; line-height: 1.45; color: var(--muted); margin: 0 0 18px; max-width: 900px; }
.vis { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 230px; }
.vis svg { width: 100%; max-width: 760px; height: auto; overflow: visible; }
.models { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 12px; }
.model { font-size: 13.5px; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); opacity: 0; animation: up .5s ease forwards; }
.model:nth-child(2) { animation-delay: .5s; } .model:nth-child(3) { animation-delay: 1s; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.fact { background: var(--sunken); border-radius: 12px; padding: 12px 14px; opacity: 0; animation: up .5s ease forwards; overflow-wrap: anywhere; }
.fact:nth-child(1) { animation-delay: 1.2s; } .fact:nth-child(2) { animation-delay: 1.6s; } .fact:nth-child(3) { animation-delay: 2s; }
.fact .k { font-size: 12.5px; color: var(--muted); } .fact .v { font-size: 15.5px; font-weight: 650; margin-top: 3px; }
.fact a { color: var(--accent); text-decoration: none; }
.src { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
.bar { max-width: 1280px; margin: 0 auto; padding: 0 28px 28px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ticks { flex: 1; display: flex; gap: 4px; min-width: 200px; }
.tick { flex: 1; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; cursor: pointer; border: 0; padding: 0; }
.tick i { display: block; height: 100%; width: 0; background: var(--accent); }
.tick.done i { width: 100%; }
button.ctl, select.ctl { font: inherit; font-size: 14px; font-weight: 600; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.honest { max-width: 1280px; margin: 0 auto; padding: 0 28px 28px; font-size: 12.5px; color: var(--muted); }
.logos { display: flex; gap: 28px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.logos span { font-size: 13px; color: var(--muted); }
.logos img { height: 26px; width: auto; display: block; }
.logos .dark { background: #191919; border-radius: 999px; padding: 8px 14px; }
.list { max-width: 900px; margin: 0 auto; padding: 28px; }
.list section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 12px; }
.list h2 { margin: 0 0 6px; font-size: 20px; }
/* Animation parts. */
@keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes flow { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateX(var(--dx)); opacity: 0; } }
@keyframes bounce { 0% { transform: translateX(0); } 55% { transform: translateX(var(--dx)); } 75% { transform: translateX(calc(var(--dx) - 40px)); } 100% { transform: translateX(calc(var(--dx) - 30px)); } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
@keyframes slide { from { transform: translateX(-180px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes grey { to { filter: grayscale(1); opacity: .45; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
.coin { fill: var(--metal); animation: flow 2.4s linear infinite; }
.coin.b { fill: var(--accent); }
.pop { transform-box: fill-box; transform-origin: center; opacity: 0; animation: pop .6s ease forwards; }
.fade { opacity: 0; animation: up .6s ease forwards; }
.slidein { animation: slide .9s cubic-bezier(.2,.8,.2,1) both; }
.greyout { animation: grey .8s ease forwards; }
.drawn { stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.2s ease forwards; }
.bouncer { animation: bounce 1.8s cubic-bezier(.3,.7,.3,1) forwards; }
svg text { font-family: Inter, system-ui, sans-serif; fill: var(--text); }
svg .muted { fill: var(--muted); } svg .okt { fill: var(--ok); } svg .badt { fill: var(--bad); }
svg .box { fill: var(--sunken); stroke: var(--border); }
@media (max-width: 760px) {
  .top { padding: 12px 16px; }
  .stage { grid-template-columns: 1fr; padding: 16px; gap: 12px; }
  .cast { flex-direction: row; overflow-x: auto; gap: 6px; }
  .who { padding: 7px 10px; font-size: 12.5px; white-space: nowrap; }
  .scene { padding: 20px 18px; min-height: 0; }
  .scene h1 { font-size: 26px; }
  .scene .line { font-size: 16px; }
  .vis { display: none; }
  .scene.end .vis { display: flex; }
  .bar, .honest { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .model, .fact, .fade, .pop { opacity: 1; } .coin { display: none; } }
</style>

    return;
  }

  var cast = el("aside", "cast", ACTORS.map(function (a) { var n = el("div", "who", [el("b", "", []), a[1]]); n.dataset.actor = a[0]; return n; }));
  var scene = el("section", "scene", []);
  scene.setAttribute("aria-live", "polite");
  main.appendChild(el("div", "stage", [cast, scene]));
  var ticks = scenes.map(function (s, i) { var b = el("button", "tick", [el("i", "", [])]); b.type = "button"; b.setAttribute("aria-label", "Go to " + s.title); b.addEventListener("click", function () { go(i); }); return b; });
  var play = txt("button", "ctl", "Pause"); play.type = "button";
  var speed = txt("button", "ctl", "1×"); speed.type = "button";
  var pick = el("select", "ctl", scenes.map(function (s, i) { var o = txt("option", "", (i + 1) + ". " + s.title); o.value = String(i); return o; }));
  pick.setAttribute("aria-label", "Skip to a scene");
  main.appendChild(el("div", "bar", [play, speed, el("div", "ticks", ticks), pick]));
  footer();

  var i = Math.max(0, scenes.findIndex(function (s) { return s.id === q.get("scene"); }));
  var rate = 1, paused = q.get("autoplay") === "0", timer = null, started = 0, left = 0;
  function render() {
    var s = scenes[i];
    document.getElementById("count").textContent = "Scene " + (i + 1) + " of " + scenes.length;
    Array.prototype.forEach.call(cast.children, function (n) { n.classList.toggle("on", n.dataset.actor === s.actor); });
    ticks.forEach(function (t, k) { t.classList.toggle("done", k < i); var bar = t.firstChild; bar.style.transition = "none"; bar.style.width = k < i ? "100%" : "0"; });
    pick.value = String(i);
    var vis = DRAW[s.kind] ? DRAW[s.kind](s) : null;
    var kids = [txt("h1", "fade", s.title), txt("p", "line fade", s.line)];
    if (s.kind === "end") {
      kids.push(el("div", "vis", [el("div", "", [
        el("div", "logos", [txt("span", "", "Built on"), logo("assets/logo-airwallex.png", "Airwallex", ""), logo("assets/logo-metal.svg", "Metal", ""), txt("span", "", "Powered by"), logo("assets/logo-claude.png", "Claude", "dark")]),
        txt("p", "src", "\"Built on\" and \"Powered by\" name the services Purser uses. They are not an endorsement."),
      ])]));
    } else kids.push(el("div", "vis", vis ? [vis] : []));
    if (s.models.length) kids.push(el("div", "models", s.models.map(function (m) { return txt("span", "model", m.model + ": " + m.did); })));
    kids.push(el("div", "facts", s.facts.map(function (x) {
      var v = x.href ? el("a", "", [x.value]) : document.createTextNode(x.value);
      if (x.href) { v.href = x.href; v.target = "_blank"; v.rel = "noopener"; }
      return el("div", "fact", [txt("div", "k", x.label), el("div", "v", [v])]);
    })));
    kids.push(txt("p", "src", "Source: " + s.source));
    scene.className = "scene " + s.kind;
    scene.replaceChildren.apply(scene, kids);
    applyRate();
    // A scene opened while paused shows its finished picture, not the empty first frame.
    if (paused) (document.getAnimations ? document.getAnimations() : []).forEach(function (a) { if (isFinite(a.effect.getTiming().iterations)) a.finish(); });
    left = s.seconds * 1000;
    schedule();
  }
  function logo(src, alt, cls) { var im = document.createElement("img"); im.src = src; im.alt = alt; im.height = 26; var w = el("span", cls, [im]); return w; }
  function applyRate() { (document.getAnimations ? document.getAnimations() : []).forEach(function (a) { a.playbackRate = rate; if (paused) a.pause(); else a.play(); }); }
  function schedule() {
    clearTimeout(timer);
    var bar = ticks[i].firstChild;
    if (paused) { var done = 1 - left / (scenes[i].seconds * 1000); bar.style.transition = "none"; bar.style.width = (done * 100) + "%"; return; }
    started = Date.now();
    bar.style.transition = "none"; bar.style.width = ((1 - left / (scenes[i].seconds * 1000)) * 100) + "%";
    requestAnimationFrame(function () { bar.style.transition = "width " + (left / rate) + "ms linear"; bar.style.width = "100%"; });
    timer = setTimeout(function () { if (i < scenes.length - 1) go(i + 1); else { paused = true; play.textContent = "Replay"; } }, left / rate);
  }
  function go(k) { i = k; render(); }
  play.addEventListener("click", function () {
    if (play.textContent === "Replay") { paused = false; play.textContent = "Pause"; go(0); return; }
    if (paused) { paused = false; play.textContent = "Pause"; applyRate(); schedule(); }
    else { left -= (Date.now() - started) * rate; paused = true; play.textContent = "Play"; clearTimeout(timer); applyRate(); schedule(); }
  });
  speed.addEventListener("click", function () { if (!paused) left -= (Date.now() - started) * rate; rate = rate === 1 ? 2 : 1; speed.textContent = rate + "×"; applyRate(); schedule(); });
  pick.addEventListener("change", function () { go(Number(pick.value)); });
  if (paused) play.textContent = "Play";
  render();

  function footer() {
    document.body.appendChild(txt("p", "honest", "Recorded runs with test money: Airwallex sandbox and Metal testnet. Card charges, the airline and the customer are sandbox simulations; every number is from a recorded run (" + T.run + "), and each scene names its source."));
  }
})();
</script>
</body>
</html>
