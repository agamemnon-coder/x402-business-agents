# Purser Cloud API, OpenAPI 3.1. Generated by `npm run openapi` from the route table (cloud/src/app.ts) and its zod
# schemas; do not edit by hand (test/openapi-spec.test.ts fails when it and the code disagree). Test money only.
openapi: "3.1.0"
info:
  title: Purser Cloud API
  version: "1.0.0"
  description: "Everything a company's finance runs on, in one place: invoices, documents, suppliers, payments, the ledger and its reports. Test money only until a company goes live."
servers:
  - url: "https://{host}"
    description: Your Purser Cloud
    variables:
      host:
        default: cloud.example.invalid
        description: The host your Purser Cloud runs on
tags:
  - name: Company
    description: "The company's books, read-only for read keys: invoices, documents, suppliers, payments, the transactions register, the ledger and its reports; and the owner's settings."
  - name: Engine (payments)
    description: "The company's engine (test money): propose an invoice's payment (read + propose); approving is a signed-in person's passkey only, never a key."
  - name: Access
    description: "Who may do what: passkey sign-in, sessions, API keys (read, sync, admin, propose) and people."
  - name: "AI agents (MCP, OAuth)"
    description: "Purser as a remote MCP server for AI clients, its connector tokens and its OAuth sign-in."
  - name: Discovery
    description: "Machine-readable descriptions: this document, the A2A Agent Card and the API reference page."
  - name: Platform
    description: "The platform operator's routes (the platform admin token)."
  - name: Hands-on demo
    description: "The hands-on demo's own routes (/try): a visitor's test company, for a day, test money."
  - name: Site
    description: Icons and pages.
x-purser-safety: "A key reads (read) and files an invoice's payment for the CFO's approval (propose). No key approves: approving needs the approve scope, a signed-in CFO's (an owner's only in a company with no CFO), and their passkey over the exact terms (POST /v1/engine/proposals/{id}/approve refuses every key)."
components:
  responses:
    BadRequest:
      description: A request that does not fit
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Not allowed
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: "Not found (also: another company's object)"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Rate limited
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Invoice:
      type: object
      required:
        - id
        - version
      additionalProperties: true
      description: "A supplier invoice as the company's records hold it (the runner's or the engine's copy, versioned)."
      properties:
        id:
          type: string
          description: Like AP-0004
        version:
          type: integer
        vendor:
          type: string
        invoice_no:
          type: string
        due_date:
          type: string
          description: YYYY-MM-DD
        currency:
          type: string
        total:
          type: string
          description: "A decimal amount, like 1309.00"
        status:
          type: string
    InvoiceDetail:
      allOf:
        - $ref: "#/components/schemas/Invoice"
        - type: object
          properties:
            earlier_versions:
              type: array
              items:
                type: object
                properties:
                  version:
                    type: integer
                  replaced_at:
                    type: string
    InvoicePage:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
        next_cursor:
          anyOf:
            - type: string
            - type: "null"
          description: "Send as cursor for the next page; null on the last page"
    Proposal:
      type: object
      required:
        - id
        - kind
        - status
        - terms_sha256
      additionalProperties: true
      description: "A payment proposal: the exact terms the CFO's passkey signs. PENDING_APPROVAL waits for the CFO; only their passkey moves it on."
      properties:
        id:
          type: string
          description: Like P-0009
        kind:
          type: string
        status:
          type: string
          description: "PENDING_APPROVAL, APPROVED, EXECUTED, FAILED, REJECTED or EXPIRED"
        terms_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        challenge:
          type: string
          description: "What the CFO's passkey signs over the terms"
        facts:
          type: array
          items:
            type: array
            prefixItems:
              - type: string
              - type: string
            minItems: 2
            maxItems: 2
          description: "[label, value] pairs a person reads"
        warnings:
          type: array
          items:
            type: string
    ProposalAnswer:
      type: object
      required:
        - proposal
      properties:
        proposal:
          $ref: "#/components/schemas/Proposal"
    ProposeAnswer:
      type: object
      required:
        - proposal
      additionalProperties: true
      description: "The filed proposal. Nothing is paid until the CFO approves these exact terms with their passkey, except within a pay-alone limit the CFO set (off unless set), which `alone` then names."
      properties:
        proposal:
          $ref: "#/components/schemas/Proposal"
        alone:
          type: object
        settled:
          anyOf:
            - type: object
            - type: "null"
    EngineInvoice:
      type: object
      required:
        - id
        - status
        - payable
        - vendor
        - currency
        - total
      additionalProperties: true
      properties:
        id:
          type: string
        status:
          type: string
        status_words:
          type: string
        payable:
          type: boolean
          description: Whether a payment can be proposed now
        vendor:
          type: string
        invoice_no:
          type: string
        currency:
          type: string
        total:
          type: string
        due_date:
          type: string
        findings:
          type: array
          items:
            type: object
            properties:
              level:
                type: string
              code:
                type: string
              message:
                type: string
        proposal:
          anyOf:
            - $ref: "#/components/schemas/Proposal"
            - type: "null"
    EngineInvoices:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EngineInvoice"
    Me:
      type: object
      required:
        - tenant
        - kind
        - scopes
      additionalProperties: true
      properties:
        tenant:
          type: object
          properties:
            id:
              type: string
            slug:
              type: string
            name:
              type: string
            language:
              type: string
        kind:
          type: string
          enum:
            - key
            - session
        scopes:
          type: array
          items:
            type: string
            enum:
              - read
              - sync
              - admin
              - propose
        role:
          anyOf:
            - type: string
            - type: "null"
    Error:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: "What went wrong, for a person"
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - method_not_allowed
            - conflict
            - too_large
            - unsupported_media_type
            - unprocessable
            - rate_limited
            - internal
            - upstream
            - step_up_required
          description: "Stable, for a program"
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: "An API key (pck_...; scopes read, sync, admin, propose; never approve) or a passkey session (pcs....; its role's scopes: a CFO's carry approve, docs/security/roles.md)"
    platformAdmin:
      type: http
      scheme: bearer
paths:
  "/v1/health":
    get:
      operationId: getV1Health
      tags:
        - Company
      summary: "For an uptime monitor: whether the database and the document store answer, the version, the mail waiting in all, and the security alarms raised in the last 24 hours per rule (security.alarms_24h; no company's data); 503 when something is down."
      security: []
      x-purser-needs: public
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/status":
    get:
      operationId: getV1Status
      tags:
        - Company
      summary: "Where the company stands, for its owners: the last push from the runner, the mail queue, today's mail quota, the runner's alert codes and the webhook (never its secret)."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/health/report":
    post:
      operationId: postV1HealthReport
      tags:
        - Company
      summary: "The runner reports its health: alert codes and severities (their words are dropped). Alerts raised or cleared since the last report go to the company's webhook."
      security:
        - bearer:
            - sync
      x-purser-needs: sync
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/integrations":
    get:
      operationId: getV1Integrations
      tags:
        - Company
      summary: "Where the company's accounting links stand (Moneybird): not_connected, connected or attention, the last sync, what was sent, what failed and what waits for a person; from the runner's ERP sync results in the audit log, never a credential."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/webhook":
    get:
      operationId: getV1Webhook
      tags:
        - Company
      summary: "The company's alert webhook (its URL and delivery state; never its secret)."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: postV1Webhook
      tags:
        - Company
      summary: "Set the alert webhook (https, a public host name); returns the signing secret once. Events are signed: x-purser-signature t=<seconds>,v1=<HMAC-SHA256 hex of t.body>."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      x-purser-step-up: "when the company asks again before sensitive changes: a session's passkey checked in the last five minutes"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteV1Webhook
      tags:
        - Company
      summary: Remove the alert webhook.
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      x-purser-step-up: "when the company asks again before sensitive changes: a session's passkey checked in the last five minutes"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/security/settings":
    get:
      operationId: getV1SecuritySettings
      tags:
        - Access
      summary: "The company's security settings: step_up, whether sensitive settings ask for the passkey again after five minutes (\"Ask again before sensitive changes\"; off by default)."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: postV1SecuritySettings
      tags:
        - Access
      summary: "Switch \"Ask again before sensitive changes\" on or off: { step_up: boolean }. A signed-in owner, after a fresh passkey check, whatever the setting; never a key. Recorded in the security events."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      x-purser-step-up: "always: a signed-in owner, passkey checked in the last five minutes"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/alerts":
    get:
      operationId: getV1Alerts
      tags:
        - Company
      summary: "Approval alerts (Settings, Alerts): who hears that a payment waits for the CFO's Face ID and on which channel (e-mail, Slack, Teams, the signed webhook), targets masked, and the latest deliveries with their status. An alert only tells; nothing in it approves."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/alerts/targets":
    post:
      operationId: postV1AlertsTargets
      tags:
        - Company
      summary: "Add an alert target: { channel: email | slack | teams, target } (an address, or a Slack or Teams webhook URL). A signed-in owner after a fresh passkey check (step-up); never a key. Answers the target masked."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      x-purser-step-up: "a signed-in owner; when the company asks again before sensitive changes, passkey checked in the last five minutes"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/alerts/targets/{id}":
    delete:
      operationId: deleteV1AlertsTargetsById
      tags:
        - Company
      summary: Remove an alert target (a signed-in owner after a fresh passkey check).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      x-purser-step-up: "a signed-in owner; when the company asks again before sensitive changes, passkey checked in the last five minutes"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/chat-hooks":
    get:
      operationId: getV1ChatHooks
      tags:
        - Company
      summary: "Slack and Teams (Settings): whether the company's Slack and Teams incoming webhooks are set (their host only, never the URL), and each one's delivery state. Purser posts approval.needed, payment.paid and books.closed there; a message only tells and links to Purser Cloud, it never approves."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/chat-hooks/{product}":
    post:
      operationId: postV1ChatHooksByProduct
      tags:
        - Company
      summary: "Set the company's Slack (product slack: https://hooks.slack.com/services/...) or Teams (product teams: a Teams Workflow's webhook URL) incoming webhook: { url }. A signed-in owner (a fresh passkey check when the company asks for one); never a key. Answers the host only."
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      x-purser-step-up: "a signed-in owner; when the company asks again before sensitive changes, passkey checked in the last five minutes"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteV1ChatHooksByProduct
      tags:
        - Company
      summary: "Remove the company's Slack or Teams webhook (a signed-in owner)."
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      x-purser-step-up: "a signed-in owner; when the company asks again before sensitive changes, passkey checked in the last five minutes"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/chat-hooks/{product}/test":
    post:
      operationId: postV1ChatHooksByProductTest
      tags:
        - Company
      summary: "Post one test message to the company's Slack or Teams webhook now, so the owner sees it arrive: { delivered, status } (the status Slack or Teams answered; 0 when nothing answered). A working test switches a hook that was off back on."
      parameters:
        - name: product
          in: path
          required: true
          schema:
            type: string
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/airwallex/account":
    get:
      operationId: getV1AirwallexAccount
      tags:
        - Company
      summary: "The company's Airwallex account opened through Purser as a platform: its id and onboarding status (created, pending, action_required, active, refused, dormant, closed); whether the cloud offers it at all."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      operationId: postV1AirwallexAccount
      tags:
        - Company
      summary: "Open the company's Airwallex account through Purser (a signed-in owner, who agreed to Airwallex's terms first). One per company."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      x-purser-step-up: "when the company asks again before sensitive changes: a session's passkey checked in the last five minutes"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/airwallex/binding":
    get:
      operationId: getV1AirwallexBinding
      tags:
        - Company
      summary: "The company's binding to its own Airwallex account, signed by Purser's platform key for an hour: the runner pays only from the account in it, only while it is active. 404 while there is none."
      security:
        - bearer:
            - sync
      x-purser-needs: sync
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/airwallex/onboarding-link":
    post:
      operationId: postV1AirwallexOnboardingLink
      tags:
        - Company
      summary: "Airwallex's hosted onboarding link for the company's checks, made for the signed-in owner and short-lived; never stored."
      security:
        - bearer:
            - admin
      x-purser-needs: admin
      x-purser-step-up: "when the company asks again before sensitive changes: a session's passkey checked in the last five minutes"
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/airwallex/webhook":
    post:
      operationId: postV1AirwallexWebhook
      tags:
        - Company
      summary: "Airwallex's account.* webhooks (signed: x-timestamp, x-signature): the onboarding status of an account opened through Purser."
      security: []
      x-purser-needs: public
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  "/v1/airwallex/account/refresh":
    post:
      operationId: postV1AirwallexAccountRefresh
      tags:
        - Company
